        const key = row.slice().sort((first, second) =&gt; first - second).join(&#x27;,&#x27;);
        repeatedPatterns.set(key, (repeatedPatterns.get(key) || 0) + 1);
      });

      repeatedPatterns.forEach((repetitions, key) =&gt; {
        const semiCount = key === &#x27;&#x27; ? 0 : key.split(&#x27;,&#x27;).length;
        const randomNumbersNeeded = 6 - fixedCount - semiCount;
        const distinctCapacity = limitedCombinationCount(randomPoolSize, randomNumbersNeeded);
        if (repetitions &gt; distinctCapacity) {
          score += (repetitions - distinctCapacity) * 1000000;
        }
      });

      for (let first = 0; first &lt; semiRules.length; first += 1) {
        for (let second = first + 1; second &lt; semiRules.length; second += 1) {
          const firstNumber = semiRules[first].number;
          const secondNumber = semiRules[second].number;
          const overlap = rows.filter((row) =&gt; row.includes(firstNumber) &amp;&amp; row.includes(secondNumber)).length;
          const maximumOverlap = Math.min(semiRules[first].appearances, semiRules[second].appearances);
          if (overlap === 0) score += 4;
          if (overlap === maximumOverlap) score += 4;
        }
      }
      return score;
    }

    function createSemiSchedule(fixedRules, semiRules, total) {
      const rowCapacity = 6 - fixedRules.length;
      const totalAppearances = semiRules.reduce((total, rule) =&gt; total + rule.appearances, 0);
      const randomPoolSize = 49 - fixedRules.length - semiRules.length;
      const minimumSemiPerRow = Math.max(0, 6 - fixedRules.length - randomPoolSize);
      if (
        rowCapacity &lt; 0 ||
        totalAppearances &gt; rowCapacity * total ||
        totalAppearances &lt; minimumSemiPerRow * total ||
        semiRules.some((rule) =&gt; rule.appearances &gt; total)
      ) return null;
      if (rowCapacity === 0) return totalAppearances === 0 ? Array.from({ length: total }, () =&gt; []) : null;
      if (semiRules.length === 0) return Array.from({ length: total }, () =&gt; []);

      const orderedRules = semiRules.slice().sort((first, second) =&gt; second.appearances - first.appearances);
      let bestRows = null;
      let bestScore = Number.POSITIVE_INFINITY;
      const attempts = Math.min(240, 80 + semiRules.length * 4);

      for (let attempt = 0; attempt &lt; attempts; attempt += 1) {
        const rows = Array.from({ length: total }, () =&gt; []);
        let valid = true;

        for (const rule of orderedRules) {
          const availableRows = rows
            .map((row, index) =&gt; ({ index, load: row.length }))
            .filter((entry) =&gt; entry.load &lt; rowCapacity)
            .map((entry) =&gt; entry.index);

          if (availableRows.length &lt; rule.appearances) {
            valid = false;
            break;
          }

          secureShuffle(availableRows)
            .slice(0, rule.appearances)
            .forEach((rowIndex) =&gt; rows[rowIndex].push(rule.number));
        }

        if (!valid || rows.some((row) =&gt; row.length &lt; minimumSemiPerRow)) continue;
        const score = scheduleScore(rows, semiRules, fixedRules.length, randomPoolSize);
        if (score &lt; bestScore) {
          bestScore = score;
          bestRows = rows.map((row) =&gt; row.slice());
          if (score === 0) break;
        }
      }

      if (bestRows) return bestRows;

      const balancedRows = Array.from({ length: total }, () =&gt; []);
      for (const rule of orderedRules) {
        const availableRows = secureShuffle(
          balancedRows
            .map((row, index) =&gt; ({ index, load: row.length }))
            .filter((entry) =&gt; entry.load &lt; rowCapacity)
        )
          .sort((first, second) =&gt; first.load - second.load)
          .slice(0, rule.appearances);

        if (availableRows.length &lt; rule.appearances) return null;
        availableRows.forEach((entry) =&gt; balancedRows[entry.index].push(rule.number));
      }

      return balancedRows.some((row) =&gt; row.length &lt; minimumSemiPerRow) ? null : balancedRows;
    }

    function limitedCombinationCount(available, needed, limit = 101) {
      if (needed &lt; 0 || needed &gt; available) return 0;
      const chosen = Math.min(needed, available - needed);
      let count = 1;
      for (let step = 1; step &lt;= chosen; step += 1) {
        count = count * (available - chosen + step) / step;
        if (count &gt;= limit) return limit;
      }
      return Math.round(count);
    }

    function createUniqueRandomFillings(pool, needed, count, acceptFilling = () =&gt; true) {
      if (count === 0) return [];
      if (needed === 0) return count === 1 &amp;&amp; acceptFilling([]) ? [[]] : null;
      if (limitedCombinationCount(pool.length, needed, count) &lt; count) return null;

      const fillings = [];
      const used = new Set();
      const maximumAttempts = Math.max(1500, count * 350);
      for (let attempt = 0; attempt &lt; maximumAttempts &amp;&amp; fillings.length &lt; count; attempt += 1) {
        const filling = secureShuffle(pool)
          .slice(0, needed)
          .sort((first, second) =&gt; first - second);
        const key = filling.join(&#x27;,&#x27;);
        if (used.has(key)) continue;
        if (!acceptFilling(filling)) continue;
        used.add(key);
        fillings.push(filling);
      }
      return fillings.length === count ? fillings : null;
    }

    function createCombinationsFromSchedule(
      fixedNumbers,
      schedule,
      reservedNumbers,
      combinationPredicate = null
    ) {
      const reservedSet = new Set(reservedNumbers);
      const pool = Array.from({ length: 49 }, (_, index) =&gt; index + 1)
        .filter((number) =&gt; !reservedSet.has(number));
      const groups = new Map();

      schedule.forEach((semiNumbers, rowIndex) =&gt; {
        const required = [...fixedNumbers, ...semiNumbers].sort((first, second) =&gt; first - second);
        const key = required.join(&#x27;,&#x27;);
        if (!groups.has(key)) groups.set(key, { required, rowIndexes: [] });
        groups.get(key).rowIndexes.push(rowIndex);
      });

      const generated = Array.from({ length: schedule.length });
      for (const group of groups.values()) {
        const needed = 6 - group.required.length;
        const capacity = limitedCombinationCount(pool.length, needed);
        if (capacity &lt; group.rowIndexes.length) {
          return {
            combinations: null,
            message: `La regla ${group.required.join(&#x27;, &#x27;)} solo permite ${capacity} ${capacity === 1 ? &#x27;combinación distinta&#x27; : &#x27;combinaciones distintas&#x27;}, pero necesita ${group.rowIndexes.length}.`
          };
        }

        const fillings = createUniqueRandomFillings(
          pool,
          needed,
          group.rowIndexes.length,
          (filling) =&gt; {
            if (!combinationPredicate) return true;
            const combination = [...group.required, ...filling]
              .sort((first, second) =&gt; first - second);
            return combinationPredicate(combination);
          }
        );
        if (!fillings) {
          return {
            combinations: null,
            message: &#x27;No se han podido completar todas las combinaciones sin duplicados. Modifica alguna regla y vuelve a intentarlo.&#x27;
          };
        }

        group.rowIndexes.forEach((rowIndex, index) =&gt; {
          generated[rowIndex] = [...group.required, ...fillings[index]]
            .sort((first, second) =&gt; first - second);
        });
      }

      return { combinations: generated, message: &#x27;&#x27; };
    }

    async function generateTicketFromRules() {
      const total = getRuleCombinationTotal();
      if (savedCombinations.length &gt; 0) {
        setRuleMessage(&#x27;Vacía primero la lista de combinaciones guardadas.&#x27;, true);
        return;
      }

      const assessment = assessRuleConfiguration();
      if (!assessment.valid) {
        setRuleMessage(assessment.message, true);
        return;
      }

      const fixedRules = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;);
      const semiRules = numberRules.filter((rule) =&gt; rule.type === &#x27;semi&#x27;);
      const fixedNumbers = fixedRules.map((rule) =&gt; rule.number);
      const reservedNumbers = numberRules.map((rule) =&gt; rule.number);
      let filterConfiguration;
      try {
        filterConfiguration = readZoneFilterConfiguration(
          rulesFilterModeSelect,
          &#x27;Generador con fijos y semifijos&#x27;
        );
      } catch (error) {
        setRuleMessage(error.message, true);
        return;
      }
      const combinationPredicate = filterConfiguration
        ? (combination) =&gt; combinationPassesActiveFilters(combination, filterConfiguration)
        : null;
      const automaticSearches = total &lt;= 30 ? 6 : 3;
      let schedule = null;
      let creation = null;

      for (let search = 0; search &lt; automaticSearches; search += 1) {
        const candidateSchedule = createSemiSchedule(fixedRules, semiRules, total);
        if (!candidateSchedule) continue;
        schedule = candidateSchedule;
        creation = createCombinationsFromSchedule(
          fixedNumbers,
          candidateSchedule,
          reservedNumbers,
          combinationPredicate
        );
        if (creation.combinations) break;
      }

      if (!schedule || !creation) {
        setRuleMessage(&#x27;Las apariciones seleccionadas no caben en combinaciones de 6 números. Reduce los fijos o las frecuencias.&#x27;, true);
        return;
      }

      if (!creation.combinations) {
        setRuleMessage(
          `${creation.message}${filterConfiguration ? &#x27; Los filtros activos pueden ser incompatibles con algunas reglas.&#x27; : &#x27;&#x27;} Se han probado automáticamente varios repartos. Pulsa de nuevo «${generateTicketButton.textContent}» para iniciar otra búsqueda o modifica los criterios.`,
          true
        );
        return;
      }
      const generated = creation.combinations;

      busy = true;
      generateTicketButton.disabled = true;
      drawButton.disabled = true;
      resetButton.disabled = true;
      drum.classList.add(&#x27;is-mixing&#x27;);
      status.textContent = `El bombo está mezclando los números para ${combinationCountLabel(total)}…`;
      relocateBalls();
      await wait(reducedMotion ? 10 : 900);
      drum.classList.remove(&#x27;is-mixing&#x27;);
      busy = false;

      savedOrigin = &#x27;rules&#x27;;
      savedCombinations = generated;
      savedPageIndex = 0;
      ruleGeneratedCombinations = generated.map((combination) =&gt; combination.slice());
      copyRulesButton.disabled = false;
      drawn = generated[0].slice();
      remaining = Array.from({ length: 49 }, (_, index) =&gt; index + 1).filter((number) =&gt; !drawn.includes(number));
      createDrumBalls();
      drawn.forEach((number) =&gt; ballsContainer.querySelector(`[data-number=&quot;${number}&quot;]`)?.remove());
      relocateBalls();
      refreshResults();
      renderSavedCombinations();
      generateTicketButton.disabled = !assessRuleConfiguration().valid;
      setRuleMessage(
        `Generadas ${combinationCountLabel(total)} diferentes con el reparto solicitado${filterConfiguration ? &#x27; y todos los filtros activos&#x27; : &#x27;&#x27;}.`
      );
      status.textContent = `Primera combinación del boleto · ${generated[0].join(&#x27;, &#x27;)}`;
      summary.textContent = `Se han generado y guardado ${combinationCountLabel(total)} con los números fijos y semifijos seleccionados.`;
    }

    function parseTxtCombinations(text) {
      const combinations = [];
      const errors = [];
      const seen = new Set();
      const lines = text.replace(/^\uFEFF/, &#x27;&#x27;).split(/\r?\n/);

      lines.forEach((rawLine, index) =&gt; {
        const lineNumber = index + 1;
        let line = rawLine.trim();
        if (!line || line.startsWith(&#x27;#&#x27;)) return;
        line = line.replace(/^\d+\s*[.)-]\s+/, &#x27;&#x27;).trim();

        let numbers;
        if (/^\d{12}$/.test(line)) {
          numbers = line.match(/\d{2}/g).map(Number);
        } else {
          const matches = line.match(/\d+/g) || [];
          numbers = matches.map(Number);
          if (matches.some((match) =&gt; match.length &gt; 2)) numbers = [];
        }

        if (numbers.length !== 6 || numbers.some((number) =&gt; number &lt; 1 || number &gt; 49) || new Set(numbers).size !== 6) {
          errors.push(lineNumber);
          return;
        }

        const combination = numbers.sort((first, second) =&gt; first - second);
        const key = combinationKey(combination);
        if (seen.has(key)) {
          errors.push(lineNumber);
          return;
        }
        seen.add(key);
        combinations.push(combination);
      });

      return { combinations, errors };
    }

    function readFileAsText(file) {
      return new Promise((resolve, reject) =&gt; {
        const reader = new FileReader();
        reader.addEventListener(&#x27;load&#x27;, () =&gt; resolve(String(reader.result || &#x27;&#x27;)));
        reader.addEventListener(&#x27;error&#x27;, () =&gt; reject(reader.error));
        reader.readAsText(file, &#x27;UTF-8&#x27;);
      });
    }

    function updateTxtGuidance() {
      const total = importedCombinations.length;
      if (total === 0) return;
      const sourceLabel = importedSource === &#x27;clipboard&#x27; ? &#x27;El texto pegado&#x27; : &#x27;El archivo&#x27;;
      if (gameSelect.value === &#x27;2&#x27; &amp;&amp; total === 1) {
        const rules = getBonolotoQrRules();
        if (!rules.singleCombinationAllowed) {
          setTxtMessage(`${sourceLabel} contiene 1 combinación. ${getBonolotoSingleCombinationError(rules)}`, true);
          return;
        }
        setTxtMessage(`${sourceLabel} contiene 1 combinación válida para «Semana en curso»: quedan ${rules.drawCount} sorteos de Bonoloto.`);
        return;
      }
      const qrTotal = splitQrGroups(importedCombinations).length;
      setTxtMessage(`${total} ${total === 1 ? &#x27;combinación válida&#x27; : &#x27;combinaciones válidas&#x27;} · se generarán ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QR&#x27;}.`);
    }

    function updateImportedControls() {
      const hasPastedText = pastedCombinationsInput.value.trim().length &gt; 0;
      const hasFile = Boolean(txtFileInput.files?.[0]);
      loadPastedButton.disabled = !hasPastedText;
      reduceImportedButton.disabled = importedCombinations.length &lt; 2;
      clearTxtButton.disabled = !hasPastedText &amp;&amp; !hasFile &amp;&amp; importedCombinations.length === 0;
    }

    function resetImportedCombinations() {
      importedCombinations = [];
      importedSource = null;
      generateTxtQrButton.disabled = true;
      reduceImportedButton.disabled = true;
      refreshFilterSourceButtons();
    }

    function acceptImportedText(text, source) {
      resetImportedCombinations();

      if (text.length &gt; 1024 * 1024) {
        setTxtMessage(&#x27;El contenido supera el máximo de 1 MB.&#x27;, true);
        updateImportedControls();
        return false;
      }

      const result = parseTxtCombinations(text);
      if (result.errors.length &gt; 0) {
        const shownLines = result.errors.slice(0, 6).join(&#x27;, &#x27;);
        const extra = result.errors.length &gt; 6 ? &#x27;…&#x27; : &#x27;&#x27;;
        setTxtMessage(`No se ha cargado: revisa las líneas ${shownLines}${extra}. Cada línea debe tener 6 números distintos del 1 al 49.`, true);
        updateImportedControls();
        return false;
      }
      if (result.combinations.length === 0) {
        setTxtMessage(&#x27;No se han encontrado combinaciones válidas.&#x27;, true);
        updateImportedControls();
        return false;
      }
      if (result.combinations.length &gt; 1000) {
        setTxtMessage(&#x27;El contenido tiene más de 1000 combinaciones.&#x27;, true);
        updateImportedControls();
        return false;
      }

      let acceptedCombinations = result.combinations;
      let filterConfiguration;
      try {
        filterConfiguration = readZoneFilterConfiguration(
          txtFilterModeSelect,
          &#x27;Carga desde TXT o portapapeles&#x27;
        );
      } catch (error) {
        setTxtMessage(error.message, true);
        updateImportedControls();
        return false;
      }
      if (filterConfiguration) {
        acceptedCombinations = result.combinations.filter((combination) =&gt;
          combinationPassesActiveFilters(combination, filterConfiguration)
        );
        if (acceptedCombinations.length === 0) {
          setTxtMessage(
            `Las ${result.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones son válidas, pero ninguna cumple todos los filtros activos.`,
            true
          );
          updateImportedControls();
          return false;
        }
      }

      importedCombinations = acceptedCombinations;
      importedSource = source;
      generateTxtQrButton.disabled = false;
      updateTxtGuidance();
      updateImportedControls();
      refreshFilterSourceButtons();
      const origin = source === &#x27;clipboard&#x27; ? &#x27;Texto pegado&#x27; : &#x27;Archivo cargado&#x27;;
      if (filterConfiguration) {
        setTxtMessage(
          `${importedCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} de ${result.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones cumplen todos los filtros activos.`
        );
      }
      summary.textContent = filterConfiguration
        ? `${origin}: ${importedCombinations.length} de ${result.combinations.length} combinaciones cumplen todos los filtros activos.`
        : `${origin} con ${importedCombinations.length} combinaciones válidas.`;
      return true;
    }

    async function loadTxtFile() {
      const file = txtFileInput.files?.[0];

      if (!file) {
        updateImportedControls();
        return;
      }

      pastedCombinationsInput.value = &#x27;&#x27;;
      resetImportedCombinations();
      hideQr();
      refreshFilterSourceButtons();
      updateImportedControls();

      if (file.size &gt; 1024 * 1024) {
        setTxtMessage(&#x27;El archivo supera el máximo de 1 MB.&#x27;, true);
        return;
      }

      try {
        const text = await readFileAsText(file);
        acceptImportedText(text, &#x27;file&#x27;);
      } catch (error) {
        setTxtMessage(&#x27;No se ha podido leer el archivo TXT.&#x27;, true);
      }
    }

    function loadPastedCombinations() {
      const text = pastedCombinationsInput.value.trim();
      if (!text) {
        setTxtMessage(&#x27;Pega primero las combinaciones en el recuadro.&#x27;, true);
        pastedCombinationsInput.focus();
        updateImportedControls();
        return;
      }

      txtFileInput.value = &#x27;&#x27;;
      hideQr();
      acceptImportedText(text, &#x27;clipboard&#x27;);
    }

    async function pasteCombinationsFromClipboard() {
      const clipboard = findReadableClipboard();
      if (!clipboard) {
        pastedCombinationsInput.focus();
        setTxtMessage(&#x27;Mantén pulsado y elige «Pegar». Para añadir otro bloque, pulsa antes «Nueva línea».&#x27;);
        return;
      }

      try {
        const text = await clipboard.readText();
        if (!text.trim()) {
          pastedCombinationsInput.focus();
          setTxtMessage(&#x27;El portapapeles no contiene texto con combinaciones.&#x27;, true);
          return;
        }
        const existingText = pastedCombinationsInput.value.trimEnd();
        const clipboardText = text.trim();
        pastedCombinationsInput.value = existingText
          ? `${existingText}\n${clipboardText}\n`
          : `${clipboardText}\n`;
        pastedCombinationsInput.setSelectionRange?.(
          pastedCombinationsInput.value.length,
          pastedCombinationsInput.value.length
        );
        pastedCombinationsInput.focus();
        loadPastedCombinations();
      } catch (error) {
        pastedCombinationsInput.focus();
        setTxtMessage(&#x27;El navegador no permite leer el portapapeles automáticamente. Mantén pulsado y elige «Pegar»; usa «Nueva línea» para continuar debajo.&#x27;);
      }
      updateImportedControls();
    }

    function replacePastedTextRange(text, start, end) {
      if (typeof pastedCombinationsInput.setRangeText === &#x27;function&#x27;) {
        pastedCombinationsInput.setRangeText(text, start, end, &#x27;end&#x27;);
        return;
      }

      pastedCombinationsInput.value =
        pastedCombinationsInput.value.slice(0, start) +
        text +
        pastedCombinationsInput.value.slice(end);
      const cursorPosition = start + text.length;
      pastedCombinationsInput.setSelectionRange?.(cursorPosition, cursorPosition);
    }

    function insertPastedCombinationNewline() {
      const start = pastedCombinationsInput.selectionStart ?? pastedCombinationsInput.value.length;
      const end = pastedCombinationsInput.selectionEnd ?? start;
      replacePastedTextRange(&#x27;\n&#x27;, start, end);
      pastedCombinationsInput.focus();
      handlePastedCombinationsInput();
      setTxtMessage(&#x27;Nueva línea preparada. Ya puedes pegar el siguiente bloque de combinaciones.&#x27;);
    }

    function handleManualCombinationPaste(event) {
      const clipboardText = event.clipboardData?.getData(&#x27;text/plain&#x27;);
      const numberTotal = (clipboardText?.match(/\d+/g) || []).length;
      if (!clipboardText || numberTotal &lt; 6) return;

      const start = pastedCombinationsInput.selectionStart ?? pastedCombinationsInput.value.length;
      const end = pastedCombinationsInput.selectionEnd ?? start;
      const textBefore = pastedCombinationsInput.value.slice(0, start);
      const needsLeadingBreak = textBefore.trim() &amp;&amp; !/[\r\n]\s*$/.test(textBefore);
      const preparedText = `${needsLeadingBreak ? &#x27;\n&#x27; : &#x27;&#x27;}${clipboardText.trim()}\n`;

      event.preventDefault();
      replacePastedTextRange(preparedText, start, end);
      handlePastedCombinationsInput();
      setTxtMessage(&#x27;Bloque pegado. El cursor ha quedado preparado en una línea nueva.&#x27;);
    }

    function handlePastedCombinationsInput() {
      resetImportedCombinations();
      hideQr();
      updateImportedControls();
      if (pastedCombinationsInput.value.trim()) {
        setTxtMessage(&#x27;Texto preparado. Puedes añadir otro bloque debajo o cargar las combinaciones.&#x27;);
      } else {
        setTxtMessage(&#x27;Una combinación por línea. En el móvil puedes usar «Nueva línea» antes de pegar otro bloque.&#x27;);
      }
    }

    function clearTxtFile() {
      txtFileInput.value = &#x27;&#x27;;
      pastedCombinationsInput.value = &#x27;&#x27;;
      resetImportedCombinations();
      hideQr();
      updateImportedControls();
      setTxtMessage(&#x27;Una combinación por línea. En el móvil puedes usar «Nueva línea» antes de pegar otro bloque.&#x27;);
    }

    function setDevelopmentMessage(message, isError = false) {
      developmentMessage.textContent = message;
      developmentMessage.classList.toggle(&#x27;is-error&#x27;, isError);
      developmentMessage.classList.remove(&#x27;is-warning&#x27;);
    }

    function setDevelopmentWarning(message) {
      developmentMessage.textContent = message;
      developmentMessage.classList.remove(&#x27;is-error&#x27;);
      developmentMessage.classList.add(&#x27;is-warning&#x27;);
    }

    function exactCombinationCount(available, needed) {
      if (needed &lt; 0 || needed &gt; available) return 0;
      const chosen = Math.min(needed, available - needed);
      let count = 1;
      for (let step = 1; step &lt;= chosen; step += 1) {
        count = count * (available - chosen + step) / step;
      }
      return Math.round(count);
    }

    function getDevelopmentFeasibility(total, fixedTotal, mode, guarantee) {
      const caseTotal = total &gt;= 6
        ? exactCombinationCount(total - fixedTotal, 6 - fixedTotal)
        : 0;
      const technicalLimit = mode === &#x27;full&#x27;
        ? DEVELOPMENT_FULL_CASE_LIMIT
        : DEVELOPMENT_REDUCTION_CASE_LIMITS[guarantee] || DEVELOPMENT_REDUCTION_CASE_LIMITS[4];
      const mobileLikeDevice =
        window.matchMedia(&#x27;(max-width: 760px)&#x27;).matches ||
        window.matchMedia(&#x27;(pointer: coarse)&#x27;).matches;
      const preventiveLimit = mobileLikeDevice
        ? Math.min(technicalLimit, DEVELOPMENT_MOBILE_CASE_LIMIT)
        : technicalLimit;
      const limit = effectiveCombinationLimit(preventiveLimit);
      const feasible = total &gt;= DEVELOPMENT_MIN_NUMBERS &amp;&amp;
        total &lt;= DEVELOPMENT_MAX_NUMBERS &amp;&amp;
        caseTotal &gt; 0 &amp;&amp;
        caseTotal &lt;= limit;
      const workload = caseTotal &lt;= DEVELOPMENT_DENSE_CASE_LIMIT
        ? &#x27;ligera&#x27;
        : caseTotal &lt;= 100000
          ? &#x27;moderada&#x27;
          : &#x27;alta&#x27;;
      const override = highLoadOverrideEnabled &amp;&amp; caseTotal &gt; preventiveLimit &amp;&amp; feasible;
      return { caseTotal, limit, preventiveLimit, feasible, workload, override };
    }

    function getExternalDevelopmentFeasibility(source, guarantee) {
      const caseTotal = source?.combinations?.length ?? 0;
      const uniqueTotal = source?.numbers?.length ?? 0;
      const technicalLimit =
        DEVELOPMENT_REDUCTION_CASE_LIMITS[guarantee] ||
        DEVELOPMENT_REDUCTION_CASE_LIMITS[4];
      const mobileLikeDevice =
        window.matchMedia(&#x27;(max-width: 760px)&#x27;).matches ||
        window.matchMedia(&#x27;(pointer: coarse)&#x27;).matches;
      const preventiveLimit = mobileLikeDevice
        ? Math.min(technicalLimit, DEVELOPMENT_MOBILE_CASE_LIMIT)
        : technicalLimit;
      const limit = effectiveCombinationLimit(preventiveLimit);
      const feasible =
        caseTotal &gt;= 2 &amp;&amp;
        uniqueTotal &gt;= DEVELOPMENT_MIN_NUMBERS &amp;&amp;
        uniqueTotal &lt;= DEVELOPMENT_MAX_NUMBERS &amp;&amp;
        caseTotal &lt;= limit;
      const workload = caseTotal &lt;= DEVELOPMENT_DENSE_CASE_LIMIT
        ? &#x27;ligera&#x27;
        : caseTotal &lt;= 100000
          ? &#x27;moderada&#x27;
          : &#x27;alta&#x27;;
      const override = highLoadOverrideEnabled &amp;&amp; caseTotal &gt; preventiveLimit &amp;&amp; feasible;
      return { caseTotal, limit, preventiveLimit, feasible, workload, override };
    }

    function renderDevelopmentExternalSource() {
      const source = developmentExternalSource;
      developmentExternalSourceSummary.hidden = !source;
      if (!source) {
        developmentExternalSourceText.textContent = &#x27;&#x27;;
        return;
      }
      developmentExternalSourceText.textContent =
        `${source.label} · ${source.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones · ${source.numbers.length} números naturales distintos.`;
    }

    function scrollToDevelopment() {
      requestAnimationFrame(() =&gt; {
        const targetTop =
          developmentSection.getBoundingClientRect().top + window.scrollY - 12;
        window.scrollTo({
          top: Math.max(0, targetTop),
          behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27;
        });
        developmentSection.focus({ preventScroll: true });
        quickNavLinks.forEach((item) =&gt; item.removeAttribute(&#x27;aria-current&#x27;));
        const quickDevelopmentLink = quickNavLinks.find(
          (link) =&gt; link.getAttribute(&#x27;href&#x27;) === &#x27;#lottery-development-section&#x27;
        );
        quickDevelopmentLink?.setAttribute(&#x27;aria-current&#x27;, &#x27;location&#x27;);
      });
    }

    function sendCombinationsToReducer(combinations, sourceDetails, feedback) {
      if (developmentBusy) {
        feedback?.(
          &#x27;El reductor está realizando un cálculo. Detén o espera a que termine antes de enviar otro conjunto.&#x27;,
          true
        );
        return false;
      }
      const seen = new Set();
      const prepared = [];
      combinations.forEach((combination) =&gt; {
        const normalised = [...combination].sort((first, second) =&gt; first - second);
        if (
          normalised.length !== 6 ||
          new Set(normalised).size !== 6 ||
          normalised.some((number) =&gt; !Number.isInteger(number) || number &lt; 1 || number &gt; 49)
        ) {
          return;
        }
        const key = combinationKey(normalised);
        if (seen.has(key)) return;
        seen.add(key);
        prepared.push(normalised);
      });

      if (prepared.length &lt; 2) {
        feedback?.(
          &#x27;Se necesitan al menos 2 combinaciones distintas para utilizar el reductor.&#x27;,
          true
        );
        return false;
      }

      const numbers = [...new Set(prepared.flat())].sort(
        (first, second) =&gt; first - second
      );
      if (numbers.length &lt; DEVELOPMENT_MIN_NUMBERS) {
        feedback?.(
          `Las combinaciones solo reúnen ${numbers.length} números distintos; el reductor necesita al menos ${DEVELOPMENT_MIN_NUMBERS}.`,
          true
        );
        return false;
      }

      developmentExternalSource = {
        key: sourceDetails.key,
        label: sourceDetails.label,
        combinations: prepared.map((combination) =&gt; [...combination]),
        numbers
      };
      developmentSelectedNumbers = numbers.slice();
      developmentFixedNumbers = [];
      developmentModeInputs.forEach((input) =&gt; {
        input.checked = input.value === &#x27;reduced&#x27;;
      });
      invalidateDevelopmentResults(
        `${prepared.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones recibidas desde «${sourceDetails.label}». Elige la garantía, la cobertura y el método para reducir únicamente este universo.`
      );
      renderDevelopmentExternalSource();
      refreshDevelopmentControls();
      feedback?.(
        `${prepared.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones enviadas al reductor sin perder su procedencia.`
      );
      summary.textContent =
        `${prepared.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones de ${sourceDetails.label} preparadas en el reductor.`;
      scrollToDevelopment();
      return true;
    }

    function getDevelopmentMode() {
      return developmentModeInputs.find((input) =&gt; input.checked)?.value || &#x27;reduced&#x27;;
    }

    function getDevelopmentCoverageMode() {
      return developmentCoverageInputs.find((input) =&gt; input.checked)?.value || &#x27;full&#x27;;
    }

    function getDevelopmentRequestedPercentage() {
      if (getDevelopmentCoverageMode() === &#x27;full&#x27;) return 100;
      const requested = Number(developmentPercentageInput.value);
      return Number.isFinite(requested) ? Math.min(99.999, Math.max(1, requested)) : 90;
    }

    function formatDevelopmentPercentage(value) {
      const percentageParts = value.toLocaleString(&#x27;es-ES&#x27;, {
        minimumFractionDigits: 3,
        maximumFractionDigits: 3,
        useGrouping: false
      }).split(&#x27;,&#x27;);
      return `${percentageParts[0].padStart(3, &#x27;0&#x27;)},${percentageParts[1]} %`;
    }

    function createDevelopmentViewOptions(mode = &#x27;reduced&#x27;) {
      developmentViewSelect.replaceChildren();
      if (mode === &#x27;full&#x27;) {
        const fullOption = document.createElement(&#x27;option&#x27;);
        fullOption.value = &#x27;full&#x27;;
        fullOption.textContent = &#x27;Desarrollo completo&#x27;;
        developmentViewSelect.appendChild(fullOption);
      } else {
        const reducedOption = document.createElement(&#x27;option&#x27;);
        reducedOption.value = &#x27;reduced&#x27;;
        reducedOption.textContent = &#x27;Reducción generada&#x27;;
        developmentViewSelect.appendChild(reducedOption);
      }
      developmentViewSelect.value = mode === &#x27;full&#x27; ? &#x27;full&#x27; : &#x27;reduced&#x27;;
    }

    function invalidateDevelopmentResults(message = &#x27;La aplicación comprobará exactamente la cobertura solicitada sobre todos los casos posibles.&#x27;) {
      developmentReducedCombinations = [];
      developmentFullCombinations = [];
      developmentPageIndex = 0;
      developmentOutput.hidden = true;
      developmentList.replaceChildren();
      developmentBreakdown.hidden = true;
      developmentBreakdownBody.replaceChildren();
      developmentBreakdownData = { conditioned: [], general: [] };
      developmentPendingBreakdown = null;
      developmentBreakdownPending.hidden = true;
      developmentBreakdownTableWrap.hidden = false;
      developmentBreakdownNote.hidden = false;
      developmentGeneratedFixedNumbers = [];
      developmentGeneratedExternalSourceLabel = &#x27;&#x27;;
      createDevelopmentViewOptions(getDevelopmentMode());
      setDevelopmentMessage(message);
      hideQr();
      refreshFilterSourceButtons();
    }

    function refreshDevelopmentControls() {
      const externalSource = developmentExternalSource;
      if (externalSource) {
        developmentSelectedNumbers = externalSource.numbers.slice();
        developmentFixedNumbers = [];
        developmentModeInputs.forEach((input) =&gt; {
          input.checked = input.value === &#x27;reduced&#x27;;
        });
      }
      const total = developmentSelectedNumbers.length;
      developmentFixedNumbers = developmentFixedNumbers.filter((number) =&gt; developmentSelectedNumbers.includes(number));
      const fixedTotal = developmentFixedNumbers.length;
      const mode = externalSource ? &#x27;reduced&#x27; : getDevelopmentMode();
      const reductionMode = mode === &#x27;reduced&#x27;;
      const percentageMode = getDevelopmentCoverageMode() === &#x27;percentage&#x27;;
      const guarantee = Number(developmentGuaranteeSelect.value);
      const feasibility = externalSource
        ? getExternalDevelopmentFeasibility(externalSource, guarantee)
        : getDevelopmentFeasibility(total, fixedTotal, mode, guarantee);
      renderDevelopmentExternalSource();
      developmentSelectedCount.textContent = `${total} / ${DEVELOPMENT_MAX_NUMBERS}`;
      developmentV.textContent = String(total);
      developmentF.textContent = String(fixedTotal);
      developmentClearButton.disabled = developmentBusy || (!externalSource &amp;&amp; total === 0);
      developmentClearOutputButton.disabled = developmentBusy;
      developmentRandomNumbersButton.disabled = developmentBusy || Boolean(externalSource);
      developmentRandomTotalInput.disabled = developmentBusy || Boolean(externalSource);
      developmentModeInputs.forEach((input) =&gt; {
        input.disabled = developmentBusy || Boolean(externalSource);
      });
      developmentGuaranteeWrap.hidden = !reductionMode;
      developmentCoverageWrap.hidden = !reductionMode;
      developmentPercentageWrap.hidden = !reductionMode || !percentageMode;
      developmentMethodWrap.hidden = !reductionMode;
      developmentGuaranteeSelect.disabled = developmentBusy || !reductionMode;
      developmentCoverageInputs.forEach((input) =&gt; {
        input.disabled = developmentBusy || !reductionMode;
      });
      developmentPercentageInput.disabled = developmentBusy || !reductionMode || !percentageMode;
      developmentMethodSelect.disabled = developmentBusy || !reductionMode;
      developmentGenerateButton.disabled = developmentBusy || !feasibility.feasible;
      developmentGenerateButton.textContent = developmentBusy
        ? developmentBreakdownBusy
          ? &#x27;Calculando desglose…&#x27;
          : mode === &#x27;full&#x27;
          ? &#x27;Generando desarrollo…&#x27;
          : developmentMethodSelect.value === &#x27;hybrid&#x27; ? &#x27;Buscando reducción…&#x27; : &#x27;Calculando…&#x27;
        : &#x27;Calcular&#x27;;
      const cyclesRunning =
        developmentBusy &amp;&amp;
        !developmentBreakdownBusy &amp;&amp;
        reductionMode &amp;&amp;
        developmentMethodSelect.value === &#x27;hybrid&#x27;;
      developmentStopButton.hidden = !cyclesRunning;
      developmentStopButton.disabled = !cyclesRunning || developmentStopRequested;
      developmentStopButton.textContent = developmentStopRequested ? &#x27;Deteniendo…&#x27; : &#x27;Detener ciclos&#x27;;

      const fullTotal = total &gt;= 6 ? exactCombinationCount(total - fixedTotal, 6 - fixedTotal) : 0;
      const generalTotal = total &gt;= 6 ? exactCombinationCount(total, 6) : 0;
      if (externalSource) {
        const sourceText =
          `Se reducirán únicamente las ${feasibility.caseTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones recibidas desde «${externalSource.label}»; no se creará un desarrollo nuevo con sus ${total} números distintos.`;
        developmentFullCount.textContent = feasibility.feasible
          ? feasibility.override
            ? `${sourceText} Supera el límite preventivo de ${feasibility.preventiveLimit.toLocaleString(&#x27;es-ES&#x27;)}, pero has autorizado la alta carga bajo tu responsabilidad.`
            : `${sourceText} Carga estimada ${feasibility.workload}.`
          : `${sourceText} El universo supera el límite seguro de ${feasibility.limit.toLocaleString(&#x27;es-ES&#x27;)} combinaciones para esta garantía y dispositivo.`;
      } else if (total &lt; 7) {
        developmentFullCount.textContent = `Selecciona ${7 - total} ${7 - total === 1 ? &#x27;número más&#x27; : &#x27;números más&#x27;}.`;
      } else if (mode === &#x27;full&#x27;) {
        const baseText = fixedTotal &gt; 0
          ? `Se generarán ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones que contienen los ${fixedTotal} fijos: C(${total - fixedTotal},${6 - fixedTotal}).`
          : `Se generarán ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones: C(${total},6). Se mostrarán por páginas.`;
        developmentFullCount.textContent = feasibility.feasible
          ? feasibility.override
            ? `${baseText} Supera el límite preventivo de ${feasibility.preventiveLimit.toLocaleString(&#x27;es-ES&#x27;)}, pero has autorizado la alta carga bajo tu responsabilidad. El navegador podría ralentizarse, bloquearse o cerrarse.`
            : `${baseText} Carga estimada ${feasibility.workload}. En móviles una carga alta puede ralentizar o bloquear temporalmente el navegador.`
          : `${baseText} Este desarrollo supera el límite seguro de ${feasibility.limit.toLocaleString(&#x27;es-ES&#x27;)} combinaciones para generarlo dentro del navegador; reduce números o añade fijos.`;
      } else {
        const coverageText = percentageMode
          ? `con un mínimo del ${formatDevelopmentPercentage(getDevelopmentRequestedPercentage())}`
          : &#x27;con cobertura garantizada al 100 %&#x27;;
        const baseText = fixedTotal &gt; 0
          ? `Sistema condicionado: ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} casos con los ${fixedTotal} fijos acertados, ${coverageText}. Si el tamaño lo permite, el desglose general analizará también los ${generalTotal.toLocaleString(&#x27;es-ES&#x27;)} resultados.`
          : `La reducción se calculará sobre ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} casos, ${coverageText}.`;
        developmentFullCount.textContent = feasibility.feasible
          ? feasibility.override
            ? `${baseText} Supera el límite preventivo de ${feasibility.preventiveLimit.toLocaleString(&#x27;es-ES&#x27;)}, pero has autorizado la alta carga bajo tu responsabilidad. El navegador podría ralentizarse, bloquearse o cerrarse.`
            : `${baseText} Carga estimada ${feasibility.workload}. En móviles una carga alta puede reducir mucho el rendimiento e incluso provocar que el navegador fuerce el bloqueo o cierre de la página.`
          : `${baseText} Con esta garantía se supera el límite seguro de ${feasibility.limit.toLocaleString(&#x27;es-ES&#x27;)} casos para un navegador. Añade fijos, selecciona menos números o elige una garantía inferior.`;
      }

      developmentNumberGrid.querySelectorAll(&#x27;[data-development-number]&#x27;).forEach((button) =&gt; {
        const number = Number(button.dataset.developmentNumber);
        const selected = developmentSelectedNumbers.includes(number);
        const fixed = developmentFixedNumbers.includes(number);
        button.classList.toggle(&#x27;is-selected&#x27;, selected);
        button.classList.toggle(&#x27;is-fixed&#x27;, fixed);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
        button.setAttribute(
          &#x27;aria-label&#x27;,
          fixed
            ? `Número ${number}, fijo. Toca para quitarlo.`
            : selected
              ? `Número ${number}, seleccionado. Toca para convertirlo en fijo.`
              : `Número ${number}, no seleccionado. Toca para seleccionarlo.`
        );
        button.disabled = developmentBusy || Boolean(externalSource);
      });
    }

    function createDevelopmentNumberButtons() {
      developmentNumberGrid.replaceChildren();
      const fragment = document.createDocumentFragment();
      for (let number = 1; number &lt;= 49; number += 1) {
        const button = document.createElement(&#x27;button&#x27;);
        button.className = &#x27;btn development-number&#x27;;
        button.type = &#x27;button&#x27;;
        button.dataset.developmentNumber = String(number);
        button.textContent = String(number).padStart(2, &#x27;0&#x27;);
        button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
        button.setAttribute(&#x27;aria-label&#x27;, `Seleccionar el número ${number}`);
        fragment.appendChild(button);
      }
      developmentNumberGrid.appendChild(fragment);
    }

    function updateDevelopmentModeGuidance(prefix = &#x27;&#x27;) {
      const total = developmentSelectedNumbers.length;
      const fixedTotal = developmentFixedNumbers.length;
      const introductoryText = prefix ? `${prefix} ` : &#x27;&#x27;;
      if (developmentExternalSource) {
        setDevelopmentMessage(
          `${introductoryText}${developmentExternalSource.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones de «${developmentExternalSource.label}» preparadas. Elige la garantía, la cobertura y el método; la reducción conservará este universo condicionado.`
        );
        return;
      }
      if (total &lt; DEVELOPMENT_MIN_NUMBERS) {
        setDevelopmentMessage(`${introductoryText}Selecciona entre ${DEVELOPMENT_MIN_NUMBERS} y ${DEVELOPMENT_MAX_NUMBERS} números.`);
        return;
      }
      const mode = getDevelopmentMode();
      const feasibility = getDevelopmentFeasibility(
        total,
        fixedTotal,
        mode,
        Number(developmentGuaranteeSelect.value)
      );
      if (!feasibility.feasible) {
        setDevelopmentWarning(
          `${introductoryText}Se han seleccionado ${total} números, pero los ${feasibility.caseTotal.toLocaleString(&#x27;es-ES&#x27;)} casos superan el cálculo seguro para esta opción. Añade fijos, reduce la selección o cambia la garantía.`
        );
        return;
      }
      if (mode === &#x27;full&#x27;) {
        const fullTotal = exactCombinationCount(total - fixedTotal, 6 - fixedTotal);
        setDevelopmentWarning(
          fixedTotal &gt; 0
            ? `${introductoryText}Aviso: se generarán ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones que contienen los ${fixedTotal} números fijos.`
            : `${introductoryText}Aviso: se generarán ${fullTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones del desarrollo completo y se mostrarán por páginas.`
        );
      } else {
        const fixedText = fixedTotal &gt; 0
          ? ` ${fixedTotal} ${fixedTotal === 1 ? &#x27;número fijo&#x27; : &#x27;números fijos&#x27;} marcados.`
          : &#x27;&#x27;;
        setDevelopmentMessage(`${introductoryText}Selección preparada.${fixedText} Elige la garantía, la cobertura y el método, y pulsa generar.`);
      }
    }

    function toggleDevelopmentNumber(number) {
      if (developmentBusy || !Number.isInteger(number) || number &lt; 1 || number &gt; 49) return;
      const selectedIndex = developmentSelectedNumbers.indexOf(number);
      const fixedIndex = developmentFixedNumbers.indexOf(number);
      let guidancePrefix = &#x27;&#x27;;
      if (fixedIndex &gt;= 0) {
        developmentFixedNumbers.splice(fixedIndex, 1);
        developmentSelectedNumbers.splice(selectedIndex, 1);
      } else if (selectedIndex &gt;= 0) {
        if (developmentFixedNumbers.length &gt;= 5) {
          developmentSelectedNumbers.splice(selectedIndex, 1);
          guidancePrefix = &#x27;Ya había 5 números fijos; el número se ha eliminado de la selección.&#x27;;
        } else {
          developmentFixedNumbers.push(number);
          developmentFixedNumbers.sort((first, second) =&gt; first - second);
        }
      } else if (developmentSelectedNumbers.length &lt; DEVELOPMENT_MAX_NUMBERS) {
        developmentSelectedNumbers.push(number);
        developmentSelectedNumbers.sort((first, second) =&gt; first - second);
      } else {
        setDevelopmentMessage(`El máximo para este módulo son ${DEVELOPMENT_MAX_NUMBERS} números. Quita uno antes de añadir otro.`, true);
        return;
      }
      invalidateDevelopmentResults();
      refreshDevelopmentControls();
      updateDevelopmentModeGuidance(guidancePrefix);
    }

    function selectRandomDevelopmentNumbers() {
      const requested = Math.trunc(Number(developmentRandomTotalInput.value));
      const total = Math.min(
        DEVELOPMENT_MAX_NUMBERS,
        Math.max(DEVELOPMENT_MIN_NUMBERS, Number.isInteger(requested) ? requested : DEVELOPMENT_MIN_NUMBERS)
      );
      developmentRandomTotalInput.value = String(total);
      developmentSelectedNumbers = secureShuffle(
        Array.from({ length: 49 }, (_, index) =&gt; index + 1)
      )
        .slice(0, total)
        .sort((first, second) =&gt; first - second);
      developmentFixedNumbers = [];
      invalidateDevelopmentResults();
      refreshDevelopmentControls();
      updateDevelopmentModeGuidance(`${total} números elegidos al azar.`);
    }

    function clearDevelopmentNumbers() {
      if (developmentBusy) return;
      developmentExternalSource = null;
      developmentSelectedNumbers = [];
      developmentFixedNumbers = [];
      invalidateDevelopmentResults(&#x27;Se han eliminado el universo recibido, los números seleccionados y la reducción o desarrollo generado.&#x27;);
      scrutinyOutput.hidden = true;
      summary.textContent = &#x27;Generador y reductor limpiados.&#x27;;
      refreshDevelopmentControls();
    }

    function createSixNumberEntries(numbers, fixedNumbers = []) {
      const entries = [];
      const fixedSet = new Set(fixedNumbers);
      const fixedIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? index : -1)
        .filter((index) =&gt; index &gt;= 0);
      const availableIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? -1 : index)
        .filter((index) =&gt; index &gt;= 0);
      const needed = 6 - fixedIndices.length;
      if (needed &lt; 0 || needed &gt; availableIndices.length) return entries;
      const positions = new Array(needed);
      let baseLow = 0;
      let baseHigh = 0;
      fixedIndices.forEach((index) =&gt; {
        if (index &lt; 32) baseLow |= 1 &lt;&lt; index;
        else baseHigh |= 1 &lt;&lt; (index - 32);
      });
      const visit = (depth, start, maskLow, maskHigh) =&gt; {
        if (depth === needed) {
          const indices = fixedIndices.concat(positions).sort((first, second) =&gt; first - second);
          entries.push({
            indices,
            mask: maskLow,
            maskLow: maskLow &gt;&gt;&gt; 0,
            maskHigh: maskHigh &gt;&gt;&gt; 0,
            maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
            combination: indices.map((index) =&gt; numbers[index])
          });
          return;
        }
        const remainingPlaces = needed - depth;
        for (let position = start; position &lt;= availableIndices.length - remainingPlaces; position += 1) {
          const index = availableIndices[position];
          positions[depth] = index;
          visit(
            depth + 1,
            position + 1,
            index &lt; 32 ? maskLow | (1 &lt;&lt; index) : maskLow,
            index &gt;= 32 ? maskHigh | (1 &lt;&lt; (index - 32)) : maskHigh
          );
        }
      };
      visit(0, 0, baseLow, baseHigh);
      return entries;
    }

    function createDevelopmentEntryFromCombination(numbers, combination) {
      const indices = combination
        .map((number) =&gt; numbers.indexOf(number))
        .sort((first, second) =&gt; first - second);
      if (indices.length !== 6 || indices.some((index) =&gt; index &lt; 0)) {
        throw new Error(&#x27;La reducción guardada no coincide con los números seleccionados.&#x27;);
      }
      let maskLow = 0;
      let maskHigh = 0;
      indices.forEach((index) =&gt; {
        if (index &lt; 32) maskLow |= 1 &lt;&lt; index;
        else maskHigh |= 1 &lt;&lt; (index - 32);
      });
      return {
        indices,
        mask: maskLow,
        maskLow: maskLow &gt;&gt;&gt; 0,
        maskHigh: maskHigh &gt;&gt;&gt; 0,
        maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
        combination: combination.slice()
      };
    }

    function popcount32(value) {
      let current = value &gt;&gt;&gt; 0;
      current -= (current &gt;&gt;&gt; 1) &amp; 0x55555555;
      current = (current &amp; 0x33333333) + ((current &gt;&gt;&gt; 2) &amp; 0x33333333);
      return (((current + (current &gt;&gt;&gt; 4)) &amp; 0x0f0f0f0f) * 0x01010101) &gt;&gt;&gt; 24;
    }

    function developmentEntryHits(firstEntry, secondEntry) {
      return popcount32(firstEntry.maskLow &amp; secondEntry.maskLow) +
        popcount32(firstEntry.maskHigh &amp; secondEntry.maskHigh);
    }

    function forEachBitsetIndex(bitset, maximum, callback) {
      for (let wordIndex = 0; wordIndex &lt; bitset.length; wordIndex += 1) {
        let bits = bitset[wordIndex] &gt;&gt;&gt; 0;
        while (bits !== 0) {
          const lowestBit = (bits &amp; -bits) &gt;&gt;&gt; 0;
          const offset = 31 - Math.clz32(lowestBit);
          const index = wordIndex * 32 + offset;
          if (index &lt; maximum) callback(index);
          bits = (bits ^ lowestBit) &gt;&gt;&gt; 0;
        }
      }
    }

    function createFullBitset(total) {
      const bitset = new Uint32Array(Math.ceil(total / 32));
      for (let index = 0; index &lt; total; index += 1) {
        bitset[index &gt;&gt;&gt; 5] |= 1 &lt;&lt; (index &amp; 31);
      }
      return bitset;
    }

    function bitsetScore(bitset, uncovered) {
      let score = 0;
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        score += popcount32(bitset[wordIndex] &amp; uncovered[wordIndex]);
      }
      return score;
    }

    function removeCovered(uncovered, coverage) {
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        uncovered[wordIndex] = (uncovered[wordIndex] &amp; ~coverage[wordIndex]) &gt;&gt;&gt; 0;
      }
    }

    function bitsetIsEmpty(bitset) {
      return bitset.every((word) =&gt; word === 0);
    }

    function mergeCoverage(target, source) {
      for (let wordIndex = 0; wordIndex &lt; target.length; wordIndex += 1) {
        target[wordIndex] |= source[wordIndex];
      }
    }

    async function buildDevelopmentCoverage(candidateEntries, winningEntries, guarantee) {
      const candidateTotal = candidateEntries.length;
      const universeTotal = winningEntries.length;
      const words = Math.ceil(universeTotal / 32);
      const coverage = Array.from({ length: candidateTotal }, () =&gt; new Uint32Array(words));
      const symmetricUniverse = candidateEntries === winningEntries;
      for (let first = 0; first &lt; candidateTotal; first += 1) {
        const start = symmetricUniverse ? first : 0;
        for (let second = start; second &lt; universeTotal; second += 1) {
          if (developmentEntryHits(candidateEntries[first], winningEntries[second]) &lt; guarantee) continue;
          coverage[first][second &gt;&gt;&gt; 5] |= 1 &lt;&lt; (second &amp; 31);
          if (symmetricUniverse) {
            coverage[second][first &gt;&gt;&gt; 5] |= 1 &lt;&lt; (first &amp; 31);
          }
        }
        if (first % 48 === 47) {
          const progress = Math.round(((first + 1) / candidateTotal) * 100);
          setDevelopmentMessage(`Preparando la comprobación matemática… ${progress} %`);
          await wait(0);
        }
      }
      return coverage;
    }

    function createSeededRandom(seed) {
      let state = seed &gt;&gt;&gt; 0;
      return () =&gt; {
        state = (Math.imul(state, 1664525) + 1013904223) &gt;&gt;&gt; 0;
        return state / 4294967296;
      };
    }

    function shuffleWithRandom(values, random) {
      const result = values.slice();
      for (let index = result.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function chooseBestCoverage(coverages, uncovered, excluded, random) {
      let bestScore = -1;
      let selectedIndex = -1;
      let equalBestTotal = 0;
      for (let index = 0; index &lt; coverages.length; index += 1) {
        if (excluded?.[index]) continue;
        const score = bitsetScore(coverages[index], uncovered);
        if (score &gt; bestScore) {
          bestScore = score;
          selectedIndex = index;
          equalBestTotal = 1;
        } else if (score === bestScore &amp;&amp; score &gt; 0) {
          equalBestTotal += 1;
          if (random() &lt; 1 / equalBestTotal) selectedIndex = index;
        }
      }
      return { index: selectedIndex, score: bestScore };
    }

    function pruneSelectedItems(selected, coverages, universeTotal, targetCount, random) {
      const coverageCounts = new Uint16Array(universeTotal);
      selected.forEach((selectedIndex) =&gt; {
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] += 1;
        });
      });

      let coveredTotal = coverageCounts.reduce((total, count) =&gt; total + (count &gt; 0 ? 1 : 0), 0);
      const retained = new Set(selected);
      shuffleWithRandom(selected, random).forEach((selectedIndex) =&gt; {
        let lostCases = 0;
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          if (coverageCounts[coveredIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &lt; targetCount) return;
        retained.delete(selectedIndex);
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] -= 1;
        });
        coveredTotal -= lostCases;
      });
      return selected.filter((selectedIndex) =&gt; retained.has(selectedIndex));
    }

    async function createRandomReduction(coverage, random, universeTotal, targetCount, cycleProgress = null) {
      const candidateTotal = coverage.length;
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(candidateTotal);
      const selected = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(coverage, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#x27;No se ha podido completar la cobertura.&#x27;);
        used[best.index] = 1;
        selected.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, coverage[best.index]);
        if (selected.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso · mejor B=${cycleProgress.best ?? &#x27;—&#x27;} · ${cycleProgress.stagnant} sin mejora · ${selected.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `Construyendo la reducción aleatoria… ${selected.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }
      return pruneSelectedItems(selected, coverage, universeTotal, targetCount, random);
    }

    function rotateDevelopmentMask(mask, shift, size) {
      if (shift % size === 0) return mask;
      const normalized = shift % size;
      const limit = (1 &lt;&lt; size) - 1;
      return ((mask &lt;&lt; normalized) | (mask &gt;&gt;&gt; (size - normalized))) &amp; limit;
    }

    function createCycleGroups(entries, size, coverage, random) {
      const positionOrder = shuffleWithRandom(
        Array.from({ length: size }, (_, index) =&gt; index),
        random
      );
      const maskToIndex = new Map(entries.map((entry, index) =&gt; [entry.mask, index]));
      const assigned = new Uint8Array(entries.length);
      const words = Math.ceil(entries.length / 32);
      const groups = [];

      const toCycleMask = (originalMask) =&gt; positionOrder.reduce(
        (cycleMask, originalPosition, cyclePosition) =&gt;
          originalMask &amp; (1 &lt;&lt; originalPosition) ? cycleMask | (1 &lt;&lt; cyclePosition) : cycleMask,
        0
      );
      const fromCycleMask = (cycleMask) =&gt; positionOrder.reduce(
        (originalMask, originalPosition, cyclePosition) =&gt;
          cycleMask &amp; (1 &lt;&lt; cyclePosition) ? originalMask | (1 &lt;&lt; originalPosition) : originalMask,
        0
      );

      for (let entryIndex = 0; entryIndex &lt; entries.length; entryIndex += 1) {
        if (assigned[entryIndex]) continue;
        const cycleMask = toCycleMask(entries[entryIndex].mask);
        const indices = [];
        const uniqueIndices = new Set();
        for (let shift = 0; shift &lt; size; shift += 1) {
          const originalMask = fromCycleMask(rotateDevelopmentMask(cycleMask, shift, size));
          const rotatedIndex = maskToIndex.get(originalMask);
          if (rotatedIndex !== undefined &amp;&amp; !uniqueIndices.has(rotatedIndex)) {
            uniqueIndices.add(rotatedIndex);
            indices.push(rotatedIndex);
          }
        }
        indices.forEach((index) =&gt; {
          assigned[index] = 1;
        });
        const groupCoverage = new Uint32Array(words);
        indices.forEach((index) =&gt; mergeCoverage(groupCoverage, coverage[index]));
        groups.push({ indices, coverage: groupCoverage });
      }
      return groups;
    }

    async function createCycleReduction(entries, coverage, random, universeTotal, targetCount) {
      const groups = createCycleGroups(entries, developmentSelectedNumbers.length, coverage, random);
      const groupCoverages = groups.map((group) =&gt; group.coverage);
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(groups.length);
      const selectedGroups = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(groupCoverages, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#x27;No se ha podido completar la cobertura por ciclos.&#x27;);
        used[best.index] = 1;
        selectedGroups.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, groupCoverages[best.index]);
        if (selectedGroups.length % 3 === 0) {
          setDevelopmentMessage(`Construyendo la reducción por ciclos… ${selectedGroups.length} ciclos provisionales.`);
          await wait(0);
        }
      }
      const retainedGroups = pruneSelectedItems(selectedGroups, groupCoverages, universeTotal, targetCount, random);
      const ticketIndices = retainedGroups.flatMap((groupIndex) =&gt; groups[groupIndex].indices);
      return {
        ticketIndices: [...new Set(ticketIndices)],
        cycleTotal: retainedGroups.length
      };
    }

    async function createHybridReduction(entries, coverage, random, universeTotal, targetCount) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateIndices = await createRandomReduction(coverage, random, universeTotal, targetCount, {
          cycle: completedCycles,
          best: bestIndices?.length ?? null,
          stagnant: stagnantCycles
        });
        const candidateVerification = verifyDevelopmentReduction(
          candidateIndices,
          coverage,
          universeTotal,
          targetCount
        );
        if (
          bestIndices === null ||
          candidateIndices.length &lt; bestIndices.length ||
          (candidateIndices.length === bestIndices.length &amp;&amp; candidateVerification.coveredTotal &gt; bestCoveredTotal)
        ) {
          bestIndices = candidateIndices.slice();
          bestCoveredTotal = candidateVerification.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
          if (
            candidateIndices.length === bestIndices.length &amp;&amp;
            candidateVerification.coveredTotal === bestCoveredTotal &amp;&amp;
            random() &lt; 0.5
          ) {
            bestIndices = candidateIndices.slice();
          }
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} · mejor resultado B=${bestIndices.length} · cobertura ${formatDevelopmentPercentage(bestCoveredTotal / universeTotal * 100)} · ${stagnantCycles} ${stagnantCycles === 1 ? &#x27;ciclo sin mejora&#x27; : &#x27;ciclos sin mejora&#x27;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        completedCycles,
        stagnantCycles
      };
    }

    async function createSparseRandomReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount,
      cycleProgress = null
    ) {
      const universeTotal = winningEntries.length;
      const coverageCounts = new Uint16Array(universeTotal);
      const selectedRecords = [];
      let coveredTotal = 0;

      const findUncoveredIndex = () =&gt; {
        const start = Math.floor(random() * universeTotal);
        for (let offset = 0; offset &lt; universeTotal; offset += 1) {
          const index = (start + offset) % universeTotal;
          if (coverageCounts[index] === 0) return index;
        }
        return -1;
      };

      while (coveredTotal &lt; targetCount) {
        const ticketIndex = findUncoveredIndex();
        if (ticketIndex &lt; 0) break;
        const ticketEntry = candidateEntries[ticketIndex];
        const coveredIndices = [];
        for (let winningIndex = 0; winningIndex &lt; universeTotal; winningIndex += 1) {
          if (developmentEntryHits(ticketEntry, winningEntries[winningIndex]) &gt;= guarantee) {
            coveredIndices.push(winningIndex);
          }
        }
        coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 0) coveredTotal += 1;
          coverageCounts[winningIndex] += 1;
        });
        selectedRecords.push({ index: ticketIndex, coveredIndices });
        if (selectedRecords.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso · mejor B=${cycleProgress.best ?? &#x27;—&#x27;} · ${selectedRecords.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `Cálculo avanzado en curso… ${selectedRecords.length} apuestas provisionales · ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }

      const retained = new Set(selectedRecords.map((record) =&gt; record.index));
      const pruningOrder = shuffleWithRandom(selectedRecords, random);
      for (let recordIndex = 0; recordIndex &lt; pruningOrder.length; recordIndex += 1) {
        const record = pruningOrder[recordIndex];
        let lostCases = 0;
        record.coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &gt;= targetCount) {
          retained.delete(record.index);
          record.coveredIndices.forEach((winningIndex) =&gt; {
            coverageCounts[winningIndex] -= 1;
          });
          coveredTotal -= lostCases;
        }
        if (recordIndex % 24 === 23) await wait(0);
      }

      return {
        ticketIndices: selectedRecords
          .map((record) =&gt; record.index)
          .filter((index) =&gt; retained.has(index)),
        coveredTotal
      };
    }

    async function createSparseHybridReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount
    ) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateResult = await createSparseRandomReduction(
          candidateEntries,
          winningEntries,
          guarantee,
          random,
          targetCount,
          {
            cycle: completedCycles,
            best: bestIndices?.length ?? null,
            stagnant: stagnantCycles
          }
        );
        if (
          bestIndices === null ||
          candidateResult.ticketIndices.length &lt; bestIndices.length ||
          (
            candidateResult.ticketIndices.length === bestIndices.length &amp;&amp;
            candidateResult.coveredTotal &gt; bestCoveredTotal
          )
        ) {
          bestIndices = candidateResult.ticketIndices.slice();
          bestCoveredTotal = candidateResult.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} · mejor resultado B=${bestIndices.length} · cobertura ${formatDevelopmentPercentage(bestCoveredTotal / winningEntries.length * 100)} · ${stagnantCycles} ${stagnantCycles === 1 ? &#x27;ciclo sin mejora&#x27; : &#x27;ciclos sin mejora&#x27;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        coveredTotal: bestCoveredTotal,
        completedCycles,
        stagnantCycles
      };
    }

    function verifyDevelopmentReduction(selectedIndices, coverage, universeTotal, targetCount = universeTotal) {
      const covered = new Uint32Array(Math.ceil(universeTotal / 32));
      selectedIndices.forEach((index) =&gt; mergeCoverage(covered, coverage[index]));
      let coveredTotal = 0;
      covered.forEach((word) =&gt; {
        coveredTotal += popcount32(word);
      });
      return {
        valid: coveredTotal &gt;= targetCount,
        coveredTotal,
        coveragePercentage: universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100
      };
    }

    async function calculateDevelopmentPrizeBreakdown(winningEntries, ticketEntries, options = {}) {
      const groups = Array.from({ length: 7 }, () =&gt; ({
        cases: 0,
        minimums: Array(7).fill(Infinity),
        maximums: Array(7).fill(0)
      }));
      const yieldEvery = Math.max(
        1,
        Math.min(512, Math.floor(250000 / Math.max(1, ticketEntries.length)))
      );

      for (let winningIndex = 0; winningIndex &lt; winningEntries.length; winningIndex += 1) {
        const winningEntry = winningEntries[winningIndex];
        const prizesByHits = Array(7).fill(0);
        ticketEntries.forEach((ticketEntry) =&gt; {
          const hits = developmentEntryHits(winningEntry, ticketEntry);
          prizesByHits[hits] += 1;
        });
        let bestHits = 6;
        while (bestHits &gt; 0 &amp;&amp; prizesByHits[bestHits] === 0) bestHits -= 1;
        const group = groups[bestHits];
        group.cases += 1;
        for (let hits = 0; hits &lt;= 6; hits += 1) {
          group.minimums[hits] = Math.min(group.minimums[hits], prizesByHits[hits]);
          group.maximums[hits] = Math.max(group.maximums[hits], prizesByHits[hits]);
        }
        if (
          winningIndex % yieldEvery === yieldEvery - 1 ||
          winningIndex === winningEntries.length - 1
        ) {
          if (options.shouldCancel?.()) {
            const cancellationError = new Error(&#x27;BREAKDOWN_CANCELLED&#x27;);
            cancellationError.code = &#x27;BREAKDOWN_CANCELLED&#x27;;
            throw cancellationError;
          }
          options.onProgress?.(
            Math.min(100, Math.round((winningIndex + 1) / winningEntries.length * 100))
          );
          await wait(0);
        }
      }

      let cumulativeCases = 0;
      return Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((guarantee) =&gt; {
        const group = groups[guarantee];
        cumulativeCases += group.cases;
        return {
          guarantee,
          cases: group.cases,
          coverage: winningEntries.length === 0 ? 0 : cumulativeCases / winningEntries.length * 100,
          ranges: Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((hits) =&gt; {
            if (group.cases === 0) return &#x27;—&#x27;;
            return `${group.minimums[hits]}–${group.maximums[hits]}`;
          })
        };
      });
    }

    function renderDevelopmentPrizeBreakdown(rows) {
      developmentBreakdownBody.replaceChildren();
      rows.forEach((rowData) =&gt; {
        const row = document.createElement(&#x27;tr&#x27;);
        row.classList.toggle(&#x27;has-cases&#x27;, rowData.cases &gt; 0);
        const values = [
          rowData.cases.toLocaleString(&#x27;es-ES&#x27;),
          formatDevelopmentPercentage(rowData.coverage),
          `${rowData.guarantee} si 6`,
          ...rowData.ranges
        ];
        values.forEach((value) =&gt; {
          const cell = document.createElement(&#x27;td&#x27;);
          cell.textContent = value;
          row.appendChild(cell);
        });
        developmentBreakdownBody.appendChild(row);
      });
    }

    function renderSelectedDevelopmentPrizeBreakdown() {
      developmentBreakdownPending.hidden = true;
      developmentBreakdownTableWrap.hidden = false;
      developmentBreakdownNote.hidden = false;
      const hasFixedNumbers = developmentGeneratedFixedNumbers.length &gt; 0;
      const hasGeneralBreakdown = developmentBreakdownData.general.length &gt; 0;
      developmentBreakdownViewWrap.hidden = !hasFixedNumbers || !hasGeneralBreakdown;
      if (!hasFixedNumbers || !hasGeneralBreakdown) developmentBreakdownViewSelect.value = &#x27;conditioned&#x27;;
      const selectedView = hasFixedNumbers &amp;&amp; hasGeneralBreakdown
        ? developmentBreakdownViewSelect.value
        : &#x27;conditioned&#x27;;
      const rows = developmentBreakdownData[selectedView] || [];
      renderDevelopmentPrizeBreakdown(rows);

      if (hasFixedNumbers &amp;&amp; selectedView === &#x27;conditioned&#x27;) {
        const conditionedCases = rows.reduce((total, row) =&gt; total + row.cases, 0);
        developmentBreakdownDescription.textContent =
          `Sistema condicionado: ${conditionedCases.toLocaleString(&#x27;es-ES&#x27;)} casos en los que se aciertan los ${developmentGeneratedFixedNumbers.length} fijos (${developmentGeneratedFixedNumbers.map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;)).join(&#x27;, &#x27;)}).`;
        developmentBreakdownNote.textContent = hasGeneralBreakdown
          ? &#x27;La cobertura es acumulada y está condicionada a acertar todos los fijos. «5 si 6» incluye los casos con 5 o 6 aciertos.&#x27;
          : &#x27;La cobertura está condicionada a acertar todos los fijos. Por el tamaño del sistema se ha omitido el desglose general para proteger el rendimiento del dispositivo.&#x27;;
      } else if (hasFixedNumbers) {
        const generalCases = rows.reduce((total, row) =&gt; total + row.cases, 0);
        developmentBreakdownDescription.textContent =
          `Desglose general sobre los ${generalCases.toLocaleString(&#x27;es-ES&#x27;)} posibles resultados de seis números, sin presuponer que se acierten los fijos.`;
        developmentBreakdownNote.textContent =
          &#x27;Este desglose general complementa la garantía condicionada. La cobertura es acumulada y no incluye complementario, reintegro ni Joker.&#x27;;
      } else {
        developmentBreakdownDescription.textContent = developmentGeneratedExternalSourceLabel
          ? `Desglose condicionado al universo recibido desde «${developmentGeneratedExternalSourceLabel}» y cantidad mínima–máxima de apuestas premiadas.`
          : &#x27;Casos posibles al acertar los 6 números seleccionados y cantidad mínima–máxima de apuestas premiadas en la reducción.&#x27;;
        developmentBreakdownNote.textContent = developmentGeneratedExternalSourceLabel
          ? &#x27;La cobertura solo se refiere a las combinaciones del universo recibido. Es acumulada y no incluye complementario, reintegro ni Joker.&#x27;
          : &#x27;La cobertura es acumulada: por ejemplo, «5 si 6» incluye todos los casos con al menos 5 aciertos. No se incluyen complementario, reintegro ni Joker.&#x27;;
      }
    }

    function renderPendingDevelopmentBreakdown() {
      if (!developmentPendingBreakdown) return;
      const pending = developmentPendingBreakdown;
      developmentBreakdown.hidden = false;
      developmentBreakdownViewWrap.hidden = true;
      developmentBreakdownTableWrap.hidden = true;
      developmentBreakdownNote.hidden = true;
      developmentBreakdownPending.hidden = false;
      developmentBreakdownCalculateButton.hidden = developmentBreakdownBusy;
      developmentBreakdownCancelButton.hidden = !developmentBreakdownBusy;
      developmentBreakdownCancelButton.disabled = developmentBreakdownCancelRequested;
      developmentBreakdownCancelButton.textContent = developmentBreakdownCancelRequested
        ? &#x27;Cancelando…&#x27;
        : &#x27;Cancelar cálculo&#x27;;
      developmentBreakdownDescription.textContent =
        &#x27;La cobertura solicitada está comprobada, pero el desglose detallado requiere un cálculo adicional muy exigente.&#x27;;
      developmentBreakdownPendingText.textContent =
        `${pending.caseTotal.toLocaleString(&#x27;es-ES&#x27;)} casos × ${pending.ticketTotal.toLocaleString(&#x27;es-ES&#x27;)} apuestas = aproximadamente ${pending.comparisonTotal.toLocaleString(&#x27;es-ES&#x27;)} comparaciones.`;
    }

    async function calculatePendingDevelopmentBreakdown() {
      if (!developmentPendingBreakdown || developmentBreakdownBusy) return;
      const pending = developmentPendingBreakdown;
      developmentBreakdownBusy = true;
      developmentBreakdownCancelRequested = false;
      developmentBusy = true;
      renderPendingDevelopmentBreakdown();
      refreshDevelopmentControls();
      setDevelopmentWarning(
        `Calculando voluntariamente el desglose de ${pending.caseTotal.toLocaleString(&#x27;es-ES&#x27;)} casos. Puedes cancelarlo; en móviles puede tardar bastante.`
      );

      try {
        let winningEntries = pending.universeCombinations
          ? pending.universeCombinations.map((combination) =&gt;
              createDevelopmentEntryFromCombination(pending.numbers, combination)
            )
          : createSixNumberEntries(pending.numbers, pending.fixedNumbers);
        if (pending.filterConfiguration &amp;&amp; !pending.universeAlreadyFiltered) {
          winningEntries = winningEntries.filter((entry) =&gt;
            combinationPassesActiveFilters(entry.combination, pending.filterConfiguration)
          );
        }
        const ticketEntries = pending.combinations.map((combination) =&gt;
          createDevelopmentEntryFromCombination(pending.numbers, combination)
        );
        await wait(0);
        const rows = await calculateDevelopmentPrizeBreakdown(
          winningEntries,
          ticketEntries,
          {
            shouldCancel: () =&gt; developmentBreakdownCancelRequested,
            onProgress: (progress) =&gt; {
              setDevelopmentWarning(
                `Calculando el desglose completo… ${progress} %. No cierres la página si deseas conservar el cálculo.`
              );
            }
          }
        );
        developmentBreakdownData.conditioned = rows;
        developmentPendingBreakdown = null;
        developmentBreakdownPending.hidden = true;
        developmentBreakdownTableWrap.hidden = false;
        developmentBreakdownNote.hidden = false;
        renderSelectedDevelopmentPrizeBreakdown();
        setDevelopmentMessage(
          `Desglose completo calculado sobre ${pending.caseTotal.toLocaleString(&#x27;es-ES&#x27;)} casos y ${pending.ticketTotal.toLocaleString(&#x27;es-ES&#x27;)} apuestas.`
        );
      } catch (error) {
        if (error.code === &#x27;BREAKDOWN_CANCELLED&#x27;) {
          setDevelopmentWarning(
            &#x27;Cálculo del desglose cancelado. La reducción y su cobertura comprobada se conservan; puedes volver a solicitarlo cuando quieras.&#x27;
          );
        } else {
          setDevelopmentMessage(`No se ha podido calcular el desglose: ${error.message}`, true);
        }
      } finally {
        developmentBreakdownBusy = false;
        developmentBreakdownCancelRequested = false;
        developmentBusy = false;
        if (developmentPendingBreakdown) renderPendingDevelopmentBreakdown();
        refreshDevelopmentControls();
      }
    }

    function cancelPendingDevelopmentBreakdown() {
