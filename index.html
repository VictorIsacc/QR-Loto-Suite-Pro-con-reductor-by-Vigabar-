        else input.value = input.defaultValue;
      });
      refreshFilterCardStates();
      clearFilteredResult(&#x27;Filtros restablecidos. La procedencia seleccionada se mantiene sin cambios.&#x27;);
      updateFilterSourceSummary(false);
    }

    async function copyFilteredCombinations() {
      if (filteredCombinations.length === 0) {
        setFilterMessage(&#x27;Aplica primero los filtros y conserva al menos una combinación.&#x27;, true);
        return;
      }
      const result = await copyTextToClipboard(combinationsToClipboardText(filteredCombinations));
      if (result.copied) {
        setFilterMessage(`${filteredCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones filtradas copiadas, una por línea.`);
      } else if (result.manual) {
        setFilterMessage(&#x27;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#x27;);
      } else {
        setFilterMessage(&#x27;No se han podido copiar las combinaciones filtradas.&#x27;, true);
      }
    }

    function generateFilteredQr() {
      if (filteredCombinations.length === 0) {
        setFilterMessage(&#x27;Aplica primero los filtros y conserva al menos una combinación.&#x27;, true);
        return;
      }
      prepareQrGeneration(filteredCombinations, &#x27;filtered&#x27;);
    }

    function sendFilteredToScrutinizer() {
      if (filteredCombinations.length === 0) {
        setFilterMessage(&#x27;Aplica primero los filtros y conserva al menos una combinación.&#x27;, true);
        return;
      }
      scrutinySourceSelect.value = &#x27;filtered&#x27;;
      scrutinyOutput.hidden = true;
      setScrutinyMessage(`${filteredCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones filtradas preparadas para el escrutinio.`);
      const scrutinySection = root.querySelector(&#x27;#lottery-scrutiny-section&#x27;);
      const targetTop = scrutinySection.getBoundingClientRect().top + window.scrollY - 12;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
    }

    function makeTicketId() {
      return window.crypto?.randomUUID?.() ?? `ticket-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function ticketGameName(game) {
      return game === &#x27;1&#x27; ? &#x27;La Primitiva&#x27; : &#x27;Bonoloto&#x27;;
    }

    function ticketPeriodName(period) {
      return period === &#x27;1&#x27; ? &#x27;Semana en curso&#x27; : &#x27;Un día&#x27;;
    }

    function cleanTicketName(value, game = gameSelect.value, createdAt = new Date().toISOString()) {
      const cleaned = String(value ?? &#x27;&#x27;).replace(/\s+/g, &#x27; &#x27;).trim().slice(0, 60);
      if (cleaned) return cleaned;
      const date = new Date(createdAt);
      const readableDate = Number.isNaN(date.getTime())
        ? new Date().toLocaleDateString(&#x27;es-ES&#x27;)
        : date.toLocaleDateString(&#x27;es-ES&#x27;);
      return `${ticketGameName(game)} · ${readableDate}`;
    }

    function normaliseTicketCombination(value, position) {
      if (!Array.isArray(value) || value.length !== 6) {
        throw new Error(`La combinación ${position} no contiene exactamente seis números.`);
      }
      const combination = value.map(Number).sort((first, second) =&gt; first - second);
      if (
        combination.some((number) =&gt; !Number.isInteger(number) || number &lt; 1 || number &gt; 49)
        || new Set(combination).size !== 6
      ) {
        throw new Error(`La combinación ${position} contiene números repetidos o fuera del 1 al 49.`);
      }
      return combination;
    }

    function normaliseTicket(rawTicket) {
      if (!rawTicket || typeof rawTicket !== &#x27;object&#x27; || Array.isArray(rawTicket)) {
        throw new Error(&#x27;La copia no contiene un boleto válido.&#x27;);
      }
      if (rawTicket.schema !== TICKET_SCHEMA || Number(rawTicket.version) !== TICKET_VERSION) {
        throw new Error(&#x27;La copia no pertenece a una versión compatible de QR Loto Suite.&#x27;);
      }

      const game = String(rawTicket.game);
      const period = String(rawTicket.period);
      if (![&#x27;1&#x27;, &#x27;2&#x27;].includes(game) || ![&#x27;0&#x27;, &#x27;1&#x27;].includes(period)) {
        throw new Error(&#x27;La modalidad o el periodo del boleto no son válidos.&#x27;);
      }

      const reintegro = game === &#x27;1&#x27; ? String(rawTicket.reintegro) : null;
      const joker = game === &#x27;1&#x27; ? String(rawTicket.joker) : null;
      if (game === &#x27;1&#x27; &amp;&amp; (!/^[0-9]$/.test(reintegro) || ![&#x27;0&#x27;, &#x27;NO&#x27;].includes(joker))) {
        throw new Error(&#x27;El reintegro o la opción Joker del boleto no son válidos.&#x27;);
      }

      if (!Array.isArray(rawTicket.combinations) || rawTicket.combinations.length === 0) {
        throw new Error(&#x27;El boleto no contiene combinaciones.&#x27;);
      }
      const combinations = rawTicket.combinations.map((combination, index) =&gt; normaliseTicketCombination(combination, index + 1));

      const sourceRaw = rawTicket.source &amp;&amp; typeof rawTicket.source === &#x27;object&#x27; ? rawTicket.source : {};
      const source = {
        key: String(sourceRaw.key ?? &#x27;saved-ticket&#x27;).slice(0, 40),
        label: String(sourceRaw.label ?? &#x27;Boleto completo importado&#x27;).slice(0, 140),
        description: String(sourceRaw.description ?? &#x27;Boleto completo conservado por QR Loto Suite.&#x27;).slice(0, 240)
      };

      if (!Array.isArray(rawTicket.pages) || rawTicket.pages.length === 0) {
        throw new Error(&#x27;La copia no conserva sus códigos QR.&#x27;);
      }
      let cursor = 0;
      const pages = rawTicket.pages.map((page, index) =&gt; {
        const count = Number(page?.count);
        const text = String(page?.text ?? &#x27;&#x27;);
        if (!Number.isInteger(count) || count &lt; 1 || count &gt; 8 || !text) {
          throw new Error(`El código QR ${index + 1} no es válido.`);
        }
        const group = combinations.slice(cursor, cursor + count);
        cursor += count;
        if (group.length !== count || text !== buildQrTextForTicket(group, game, period, joker, reintegro)) {
          throw new Error(`El código QR ${index + 1} no coincide con los datos guardados del boleto.`);
        }
        return { count, text };
      });
      if (cursor !== combinations.length) {
        throw new Error(&#x27;La cantidad de combinaciones no coincide con los códigos QR guardados.&#x27;);
      }

      const createdDate = new Date(rawTicket.createdAt);
      const createdAt = Number.isNaN(createdDate.getTime()) ? new Date().toISOString() : createdDate.toISOString();
      return {
        schema: TICKET_SCHEMA,
        version: TICKET_VERSION,
        id: String(rawTicket.id || makeTicketId()).slice(0, 100),
        name: cleanTicketName(rawTicket.name, game, createdAt),
        createdAt,
        game,
        period,
        reintegro,
        joker,
        source,
        combinations,
        pages
      };
    }

    function serialiseTicket(ticket) {
      return `${TICKET_EXPORT_HEADER}\r\n${JSON.stringify(normaliseTicket(ticket), null, 2)}`;
    }

    function parseTicketText(text) {
      const cleaned = String(text ?? &#x27;&#x27;).replace(/^\uFEFF/, &#x27;&#x27;).trim();
      if (!cleaned) throw new Error(&#x27;Pega o selecciona primero una copia de boleto.&#x27;);
      const payload = cleaned.startsWith(TICKET_EXPORT_HEADER)
        ? cleaned.slice(TICKET_EXPORT_HEADER.length).trim()
        : cleaned;
      let parsed;
      try {
        parsed = JSON.parse(payload);
      } catch (error) {
        throw new Error(&#x27;El texto no tiene el formato de un boleto completo exportado por la app.&#x27;);
      }
      return normaliseTicket(parsed);
    }

    function setTicketActionMessage(message, isError = false) {
      ticketActionMessage.textContent = message;
      ticketActionMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function setTicketImportMessage(message, isError = false) {
      ticketImportMessage.textContent = message;
      ticketImportMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function currentTicketSnapshot() {
      if (!currentGeneratedTicket) return null;
      return normaliseTicket({
        ...currentGeneratedTicket,
        name: cleanTicketName(ticketNameInput.value, currentGeneratedTicket.game, currentGeneratedTicket.createdAt)
      });
    }

    function saveTicketsToBrowser() {
      try {
        window.localStorage.setItem(TICKET_STORAGE_KEY, JSON.stringify(savedTickets));
        ticketStorageMessage.textContent = &#x27;Guardado local activo. Conserva además una copia TXT por si borras los datos del navegador o cambias de dispositivo.&#x27;;
        ticketStorageMessage.classList.remove(&#x27;is-error&#x27;);
        return true;
      } catch (error) {
        ticketStorageMessage.textContent = &#x27;Este navegador no permite conservar el boleto localmente o no dispone de espacio. Usa «Copiar boleto completo» o «Descargar copia TXT».&#x27;;
        ticketStorageMessage.classList.add(&#x27;is-error&#x27;);
        return false;
      }
    }

    function loadTicketsFromBrowser() {
      try {
        const stored = window.localStorage.getItem(TICKET_STORAGE_KEY);
        if (!stored) {
          savedTickets = [];
          return;
        }
        const parsed = JSON.parse(stored);
        savedTickets = Array.isArray(parsed)
          ? parsed.slice(0, TICKET_STORAGE_LIMIT).map(normaliseTicket)
          : [];
        ticketStorageMessage.textContent = savedTickets.length &gt; 0
          ? `Guardado local activo: ${savedTickets.length} ${savedTickets.length === 1 ? &#x27;boleto recuperado&#x27; : &#x27;boletos recuperados&#x27;} en este navegador. Conserva también copias TXT.`
          : &#x27;Conserva además una copia TXT: los datos locales pueden desaparecer si borras los datos del navegador.&#x27;;
        ticketStorageMessage.classList.remove(&#x27;is-error&#x27;);
      } catch (error) {
        savedTickets = [];
        ticketStorageMessage.textContent = &#x27;No se han podido leer los boletos guardados en este navegador. Puedes recuperarlos desde una copia TXT.&#x27;;
        ticketStorageMessage.classList.add(&#x27;is-error&#x27;);
      }
    }

    function createTicketAction(label, action, id, className = &#x27;&#x27;) {
      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
      button.className = `btn ${className}`.trim();
      button.textContent = label;
      button.dataset.ticketAction = action;
      button.dataset.ticketId = id;
      return button;
    }

    function renderSavedTickets() {
      ticketList.replaceChildren();
      ticketCount.textContent = `${savedTickets.length} ${savedTickets.length === 1 ? &#x27;boleto&#x27; : &#x27;boletos&#x27;}`;
      if (savedTickets.length === 0) {
        const empty = document.createElement(&#x27;p&#x27;);
        empty.className = &#x27;ticket-list-empty&#x27;;
        empty.textContent = &#x27;Todavía no hay boletos completos guardados en este navegador.&#x27;;
        ticketList.appendChild(empty);
        refreshFilterSourceButtons();
        return;
      }

      savedTickets.forEach((ticket) =&gt; {
        const card = document.createElement(&#x27;article&#x27;);
        card.className = &#x27;ticket-card&#x27;;
        card.dataset.game = ticket.game === &#x27;1&#x27; ? &#x27;primitiva&#x27; : &#x27;bonoloto&#x27;;

        const heading = document.createElement(&#x27;div&#x27;);
        heading.className = &#x27;ticket-card-heading&#x27;;
        const name = document.createElement(&#x27;strong&#x27;);
        name.textContent = ticket.name;
        const date = document.createElement(&#x27;span&#x27;);
        date.className = &#x27;ticket-card-date&#x27;;
        date.textContent = new Date(ticket.createdAt).toLocaleString(&#x27;es-ES&#x27;, { dateStyle: &#x27;short&#x27;, timeStyle: &#x27;short&#x27; });
        heading.append(name, date);

        const meta = document.createElement(&#x27;div&#x27;);
        meta.className = &#x27;ticket-card-meta&#x27;;
        const metaValues = [
          ticketGameName(ticket.game),
          `${ticket.combinations.length} ${ticket.combinations.length === 1 ? &#x27;apuesta&#x27; : &#x27;apuestas&#x27;}`,
          `${ticket.pages.length} ${ticket.pages.length === 1 ? &#x27;QR&#x27; : &#x27;QR&#x27;}`,
          ticketPeriodName(ticket.period)
        ];
        if (ticket.game === &#x27;1&#x27;) {
          metaValues.push(`R: ${ticket.reintegro}`, ticket.joker === &#x27;0&#x27; ? &#x27;Joker: sí&#x27; : &#x27;Joker: no&#x27;);
        }
        metaValues.forEach((value) =&gt; {
          const item = document.createElement(&#x27;span&#x27;);
          item.textContent = value;
          meta.appendChild(item);
        });

        const source = document.createElement(&#x27;p&#x27;);
        source.className = &#x27;ticket-card-source&#x27;;
        source.textContent = `Procedencia original: ${ticket.source.label}`;

        const actions = document.createElement(&#x27;div&#x27;);
        actions.className = &#x27;ticket-card-actions&#x27;;
        actions.append(
          createTicketAction(&#x27;Ver QR&#x27;, &#x27;open&#x27;, ticket.id, &#x27;btn-primary&#x27;),
          createTicketAction(&#x27;Escrutar&#x27;, &#x27;scrutinize&#x27;, ticket.id),
          createTicketAction(&#x27;Filtrar&#x27;, &#x27;filter&#x27;, ticket.id),
          createTicketAction(&#x27;Copiar apuestas&#x27;, &#x27;copy-bets&#x27;, ticket.id),
          createTicketAction(&#x27;Copiar boleto&#x27;, &#x27;copy&#x27;, ticket.id),
          createTicketAction(&#x27;TXT&#x27;, &#x27;download&#x27;, ticket.id),
          createTicketAction(&#x27;Eliminar&#x27;, &#x27;delete&#x27;, ticket.id, &#x27;btn-ghost ticket-delete&#x27;)
        );
        card.append(heading, meta, source, actions);
        ticketList.appendChild(card);
      });
      refreshFilterSourceButtons();
    }

    function rebuildQrPagesFromTicket(ticket) {
      let cursor = 0;
      const source = {
        key: &#x27;saved-ticket&#x27;,
        label: `Mis boletos · ${ticket.name}`,
        description: `Boleto completo guardado. Procedencia original: ${ticket.source.label}`
      };
      return ticket.pages.map((page) =&gt; {
        const combinations = ticket.combinations.slice(cursor, cursor + page.count).map((combination) =&gt; [...combination]);
        cursor += page.count;
        return { combinations, text: page.text, source };
      });
    }

    function openSavedTicket(ticket) {
      const normalised = normaliseTicket(ticket);
      gameSelect.value = normalised.game;
      periodSelect.value = normalised.period;
      if (normalised.game === &#x27;1&#x27;) {
        reintegroSelect.value = normalised.reintegro;
        jokerSelect.value = normalised.joker;
      }
      updateGameOptions();
      currentGeneratedTicket = normalised;
      ticketNameInput.value = normalised.name;
      qrPages = rebuildQrPagesFromTicket(normalised);
      qrPageIndex = 0;
      showQrPage(0);
      setTicketActionMessage(&#x27;Boleto recuperado con todos sus datos. Puedes actualizar su nombre, copiarlo o descargarlo.&#x27;);
      scrollToGeneratedQr();
    }

    function loadTicketInScrutinizer(ticket) {
      loadedTicketForScrutiny = normaliseTicket(ticket);
      scrutinySourceSelect.value = &#x27;ticket&#x27;;
      scrutinyGameSelect.value = loadedTicketForScrutiny.game;
      updateScrutinyGame();
      setScrutinyMessage(
        loadedTicketForScrutiny.game === &#x27;1&#x27;
          ? `Boleto «${loadedTicketForScrutiny.name}» cargado. Se usará su reintegro jugado (${loadedTicketForScrutiny.reintegro}). Introduce el resultado oficial.`
          : `Boleto «${loadedTicketForScrutiny.name}» cargado. Introduce el resultado oficial de Bonoloto.`
      );
      const targetTop = root.querySelector(&#x27;#lottery-scrutiny-section&#x27;).getBoundingClientRect().top + window.scrollY - 12;
      window.scrollTo({ top: Math.max(0, targetTop), behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
    }

    function safeTicketFilename(ticket) {
      const safeName = ticket.name
        .normalize(&#x27;NFD&#x27;)
        .replace(/[\u0300-\u036f]/g, &#x27;&#x27;)
        .replace(/[^a-zA-Z0-9_-]+/g, &#x27;-&#x27;)
        .replace(/^-+|-+$/g, &#x27;&#x27;)
        .slice(0, 60) || &#x27;boleto&#x27;;
      return `${safeName}-QR-Loto-Suite.txt`;
    }

    async function copyTicketBundle(ticket, feedback = &#x27;action&#x27;) {
      const normalised = normaliseTicket(ticket);
      const result = await copyTextToClipboard(serialiseTicket(normalised));
      const message = result.copied
        ? `Boleto completo «${normalised.name}» copiado al portapapeles.`
        : result.manual
          ? &#x27;El navegador ha mostrado el boleto para copiarlo manualmente.&#x27;
          : &#x27;No se ha podido copiar el boleto. Descarga la copia TXT.&#x27;;
      const isError = Boolean(result.error);
      if (feedback === &#x27;import&#x27;) setTicketImportMessage(message, isError);
      else setTicketActionMessage(message, isError);
    }

    async function copyTicketCombinations(ticket, feedback = &#x27;import&#x27;) {
      const normalised = normaliseTicket(ticket);
      const result = await copyTextToClipboard(combinationsToClipboardText(normalised.combinations));
      const total = normalised.combinations.length;
      const message = result.copied
        ? `${total} ${total === 1 ? &#x27;apuesta copiada&#x27; : &#x27;apuestas copiadas&#x27;} de «${normalised.name}», una por línea.`
        : result.manual
          ? &#x27;El navegador ha mostrado las apuestas para copiarlas manualmente.&#x27;
          : &#x27;No se han podido copiar las apuestas de este boleto.&#x27;;
      const isError = Boolean(result.error);
      if (feedback === &#x27;import&#x27;) setTicketImportMessage(message, isError);
      else setTicketActionMessage(message, isError);
    }

    function downloadTicketBundle(ticket, feedback = &#x27;action&#x27;) {
      const normalised = normaliseTicket(ticket);
      try {
        const blob = new Blob([`\uFEFF${serialiseTicket(normalised)}`], { type: &#x27;text/plain;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = safeTicketFilename(normalised);
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
        const message = `Copia TXT de «${normalised.name}» preparada para descargar.`;
        if (feedback === &#x27;import&#x27;) setTicketImportMessage(message);
        else setTicketActionMessage(message);
      } catch (error) {
        const message = &#x27;Este navegador no ha permitido la descarga. Usa la opción de copiar el boleto completo.&#x27;;
        if (feedback === &#x27;import&#x27;) setTicketImportMessage(message, true);
        else setTicketActionMessage(message, true);
      }
    }

    function saveCurrentTicket() {
      const ticket = currentTicketSnapshot();
      if (!ticket) {
        setTicketActionMessage(&#x27;Genera o abre primero un boleto con códigos QR.&#x27;, true);
        return;
      }
      const existingIndex = savedTickets.findIndex((savedTicket) =&gt; savedTicket.id === ticket.id);
      if (existingIndex === -1 &amp;&amp; savedTickets.length &gt;= TICKET_STORAGE_LIMIT) {
        setTicketActionMessage(`Se ha alcanzado el límite de ${TICKET_STORAGE_LIMIT} boletos locales. Elimina alguno o descarga este boleto como TXT.`, true);
        return;
      }
      const previousTickets = [...savedTickets];
      if (existingIndex === -1) savedTickets.unshift(ticket);
      else savedTickets.splice(existingIndex, 1, ticket);
      if (!saveTicketsToBrowser()) {
        savedTickets = previousTickets;
        renderSavedTickets();
        setTicketActionMessage(&#x27;No se ha podido guardar localmente. Usa «Copiar boleto completo» o «Descargar copia TXT».&#x27;, true);
        return;
      }
      currentGeneratedTicket = ticket;
      ticketNameInput.value = ticket.name;
      renderSavedTickets();
      setTicketActionMessage(existingIndex === -1 ? &#x27;Boleto guardado en «Mis boletos».&#x27; : &#x27;Boleto actualizado en «Mis boletos».&#x27;);
    }

    function importTicketBundle(text) {
      if (savedTickets.length &gt;= TICKET_STORAGE_LIMIT) {
        setTicketImportMessage(`Se ha alcanzado el límite de ${TICKET_STORAGE_LIMIT} boletos locales. Elimina alguno antes de importar.`, true);
        return;
      }
      try {
        const imported = parseTicketText(text);
        imported.id = makeTicketId();
        const previousTickets = [...savedTickets];
        savedTickets.unshift(imported);
        if (!saveTicketsToBrowser()) {
          savedTickets = previousTickets;
          renderSavedTickets();
          setTicketImportMessage(&#x27;La copia es válida, pero el navegador no ha podido conservarla. Libera espacio o ábrela desde el archivo cuando la necesites.&#x27;, true);
          return;
        }
        ticketImportText.value = &#x27;&#x27;;
        renderSavedTickets();
        setTicketImportMessage(`Boleto «${imported.name}» importado con ${imported.combinations.length} combinaciones y ${imported.pages.length} QR.`);
      } catch (error) {
        setTicketImportMessage(error.message, true);
      }
    }

    async function pasteTicketFromClipboard() {
      const clipboard = findReadableClipboard();
      if (!clipboard) {
        ticketImportText.focus();
        setTicketImportMessage(&#x27;Mantén pulsado dentro del cuadro y elige «Pegar»; después pulsa «Importar boleto».&#x27;);
        return;
      }
      try {
        const text = await clipboard.readText();
        if (!text.trim()) {
          setTicketImportMessage(&#x27;El portapapeles está vacío.&#x27;, true);
          return;
        }
        ticketImportText.value = text;
        setTicketImportMessage(&#x27;Boleto pegado. Pulsa «Importar boleto» para comprobarlo y guardarlo.&#x27;);
      } catch (error) {
        ticketImportText.focus();
        setTicketImportMessage(&#x27;El navegador no permite leer el portapapeles automáticamente. Pega el texto manteniendo pulsado dentro del cuadro.&#x27;);
      }
    }

    async function loadTicketFile() {
      const file = ticketFileInput.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        ticketImportText.value = text;
        importTicketBundle(text);
      } catch (error) {
        setTicketImportMessage(&#x27;No se ha podido leer el archivo seleccionado.&#x27;, true);
      } finally {
        ticketFileInput.value = &#x27;&#x27;;
      }
    }

    async function handleTicketListAction(event) {
      const button = event.target.closest(&#x27;[data-ticket-action][data-ticket-id]&#x27;);
      if (!button) return;
      const ticket = savedTickets.find((item) =&gt; item.id === button.dataset.ticketId);
      if (!ticket) return;
      const action = button.dataset.ticketAction;
      if (action === &#x27;open&#x27;) {
        openSavedTicket(ticket);
      } else if (action === &#x27;scrutinize&#x27;) {
        loadTicketInScrutinizer(ticket);
      } else if (action === &#x27;filter&#x27;) {
        openFiltersForSource(&#x27;ticket&#x27;, ticket);
      } else if (action === &#x27;copy-bets&#x27;) {
        await copyTicketCombinations(ticket, &#x27;import&#x27;);
      } else if (action === &#x27;copy&#x27;) {
        await copyTicketBundle(ticket, &#x27;import&#x27;);
      } else if (action === &#x27;download&#x27;) {
        downloadTicketBundle(ticket, &#x27;import&#x27;);
      } else if (action === &#x27;delete&#x27;) {
        if (button.dataset.deleteConfirmed !== &#x27;true&#x27;) {
          ticketList.querySelectorAll(&#x27;[data-ticket-action=&quot;delete&quot;]&#x27;).forEach((deleteButton) =&gt; {
            deleteButton.dataset.deleteConfirmed = &#x27;false&#x27;;
            deleteButton.textContent = &#x27;Eliminar&#x27;;
          });
          button.dataset.deleteConfirmed = &#x27;true&#x27;;
          button.textContent = &#x27;Confirmar eliminación&#x27;;
          setTicketImportMessage(`Pulsa otra vez «Confirmar eliminación» para borrar «${ticket.name}».`);
          setTimeout(() =&gt; {
            if (!button.isConnected || button.dataset.deleteConfirmed !== &#x27;true&#x27;) return;
            button.dataset.deleteConfirmed = &#x27;false&#x27;;
            button.textContent = &#x27;Eliminar&#x27;;
            setTicketImportMessage(&#x27;Eliminación cancelada por falta de confirmación.&#x27;);
          }, 6000);
          return;
        }
        const previousTickets = [...savedTickets];
        savedTickets = savedTickets.filter((item) =&gt; item.id !== ticket.id);
        if (!saveTicketsToBrowser()) {
          savedTickets = previousTickets;
          renderSavedTickets();
          setTicketImportMessage(&#x27;El navegador no ha podido guardar la eliminación. Inténtalo de nuevo o revisa sus permisos de almacenamiento.&#x27;, true);
          return;
        }
        if (loadedTicketForScrutiny?.id === ticket.id) {
          loadedTicketForScrutiny = null;
          if (scrutinySourceSelect.value === &#x27;ticket&#x27;) scrutinySourceSelect.value = &#x27;current&#x27;;
        }
        if (loadedTicketForFilters?.id === ticket.id) {
          loadedTicketForFilters = null;
          if (filterSourceSelect.value === &#x27;ticket&#x27;) {
            filterSourceSelect.value = &#x27;current&#x27;;
            updateFilterSourceSummary();
          }
        }
        renderSavedTickets();
        setTicketImportMessage(`Boleto «${ticket.name}» eliminado de este navegador.`);
      }
    }

    function hideQr() {
      qrArea.hidden = true;
      qrCode.replaceChildren();
      qrText.value = &#x27;&#x27;;
      qrCostSummary.hidden = true;
      qrCostAmount.textContent = &#x27;0,00 €&#x27;;
      qrCostBreakdown.textContent = &#x27;&#x27;;
      qrCostAll.textContent = &#x27;&#x27;;
      qrCostAll.hidden = true;
      currentGeneratedTicket = null;
      ticketNameInput.value = &#x27;&#x27;;
      setTicketActionMessage(&#x27;La copia TXT permite recuperar el boleto en otro dispositivo o navegador.&#x27;);
    }

    function scrollToGeneratedQr() {
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
      requestAnimationFrame(() =&gt; {
        const targetTop = qrArea.getBoundingClientRect().top + window.scrollY - 12;
        window.scrollTo({
          top: Math.max(0, targetTop),
          behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27;
        });
        quickNavLinks.forEach((item) =&gt; item.removeAttribute(&#x27;aria-current&#x27;));
      });
    }

    function formatEuro(amount) {
      return euroFormatter.format(amount);
    }

    function getWeeklyDrawCount(product, referenceDate = new Date()) {
      const day = referenceDate.getDay();
      if (product === &#x27;2&#x27;) {
        return day === 0 ? 1 : 8 - day;
      }
      if (day === 0) return 0;
      return [1, 4, 6].filter((drawDay) =&gt; drawDay &gt;= day).length;
    }

    function getBonolotoQrRules(referenceDate = new Date(), periodValue = periodSelect.value) {
      const isWeekly = periodValue === &#x27;1&#x27;;
      const drawCount = isWeekly ? getWeeklyDrawCount(&#x27;2&#x27;, referenceDate) : 1;
      const singleCombinationAllowed = isWeekly &amp;&amp; drawCount &gt;= 2;
      return {
        isWeekly,
        drawCount,
        singleCombinationAllowed,
        minimumCombinations: singleCombinationAllowed ? 1 : 2
      };
    }

    function getBonolotoSingleCombinationError(rules = getBonolotoQrRules()) {
      if (!rules.isWeekly) {
        return &#x27;Una sola combinación de Bonoloto solo es válida al seleccionar «Semana en curso» y cuando queden al menos 2 sorteos. Para un único sorteo necesitas 2 combinaciones.&#x27;;
      }
      if (rules.drawCount === 1) {
        return &#x27;Solo queda 1 sorteo de Bonoloto esta semana; necesitas al menos 2 combinaciones. Una sola apuesta solo es válida cuando quedan 2 o más sorteos.&#x27;;
      }
      return &#x27;No quedan suficientes sorteos de Bonoloto esta semana para jugar una sola combinación; necesitas al menos 2 combinaciones.&#x27;;
    }

    function getQrCostDetailsForOptions(
      combinationCount,
      product,
      period,
      joker
    ) {
      const isPrimitiva = product === &#x27;1&#x27;;
      const combinationPrice = isPrimitiva ? 1 : 0.5;
      const jokerPrice = isPrimitiva &amp;&amp; joker === &#x27;0&#x27; ? 1 : 0;
      const drawCount = period === &#x27;1&#x27; ? getWeeklyDrawCount(product) : 1;
      const pricePerDraw = combinationCount * combinationPrice + jokerPrice;
      return {
        combinationCount,
        combinationPrice,
        jokerPrice,
        drawCount,
        pricePerDraw,
        total: pricePerDraw * drawCount
      };
    }

    function getQrCostDetails(combinationCount) {
      return getQrCostDetailsForOptions(
        combinationCount,
        gameSelect.value,
        periodSelect.value,
        jokerSelect.value
      );
    }

    function updateQrCost() {
      if (costSelect.value !== &#x27;1&#x27; || qrPages.length === 0 || qrArea.hidden) {
        qrCostSummary.hidden = true;
        return;
      }

      const currentPage = qrPages[qrPageIndex];
      const details = getQrCostDetails(currentPage.combinations.length);
      const combinationLabel = details.combinationCount === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;;
      const jokerText = details.jokerPrice &gt; 0 ? ` + Joker ${formatEuro(details.jokerPrice)}` : &#x27;&#x27;;
      const baseText = `${details.combinationCount} ${combinationLabel} × ${formatEuro(details.combinationPrice)}${jokerText} = ${formatEuro(details.pricePerDraw)} por sorteo`;

      qrCostAmount.textContent = formatEuro(details.total);
      if (periodSelect.value === &#x27;1&#x27;) {
        if (details.drawCount === 0) {
          qrCostBreakdown.textContent = `${baseText}. No quedan sorteos de La Primitiva en la semana actual.`;
        } else {
          const drawLabel = details.drawCount === 1 ? &#x27;sorteo pendiente&#x27; : &#x27;sorteos pendientes&#x27;;
          qrCostBreakdown.textContent = `${baseText} · ${details.drawCount} ${drawLabel} esta semana, contando hoy cuando corresponda.`;
        }
      } else {
        qrCostBreakdown.textContent = `${baseText} · un único sorteo.`;
      }

      if (qrPages.length &gt; 1) {
        const allQrTotal = qrPages.reduce(
          (total, page) =&gt; total + getQrCostDetails(page.combinations.length).total,
          0
        );
        const jokerNote = gameSelect.value === &#x27;1&#x27; &amp;&amp; jokerSelect.value === &#x27;0&#x27;
          ? &#x27; El importe incluye 1,00 € de Joker por cada QR o boleto.&#x27;
          : &#x27;&#x27;;
        qrCostAll.textContent = `Total de los ${qrPages.length} códigos QR: ${formatEuro(allQrTotal)}.${jokerNote}`;
        qrCostAll.hidden = false;
      } else {
        qrCostAll.textContent = &#x27;&#x27;;
        qrCostAll.hidden = true;
      }
      qrCostSummary.hidden = false;
    }

    function setQrMessage(message, isError = false) {
      qrMessage.textContent = message;
      qrMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function updateQrGuidance() {
      const total = savedCombinations.length;
      if (gameSelect.value === &#x27;2&#x27;) {
        const rules = getBonolotoQrRules();
        if (total === 0) {
          if (rules.singleCombinationAllowed) {
            setQrMessage(`Bonoloto admite una sola combinación en «Semana en curso»: quedan ${rules.drawCount} sorteos. Para un único sorteo, el mínimo son 2.`);
          } else if (rules.isWeekly) {
            setQrMessage(&#x27;Bonoloto necesita al menos 2 combinaciones porque solo queda 1 sorteo esta semana.&#x27;);
          } else {
            setQrMessage(&#x27;Bonoloto necesita al menos 2 combinaciones para un único sorteo. Una sola combinación solo es válida en «Semana en curso» si quedan al menos 2 sorteos.&#x27;);
          }
        } else if (total === 1 &amp;&amp; !rules.singleCombinationAllowed) {
          setQrMessage(getBonolotoSingleCombinationError(rules), true);
        } else {
          const qrTotal = splitQrGroups(savedCombinations).length;
          const weeklyNote = total === 1
            ? ` · válida para los ${rules.drawCount} sorteos pendientes`
            : &#x27;&#x27;;
          setQrMessage(`Bonoloto preparado con ${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}${weeklyNote} · ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QRs&#x27;}.`);
        }
      } else if (total === 0) {
        setQrMessage(&#x27;La Primitiva admite de 1 a 8 combinaciones por cada QR.&#x27;);
      } else {
        const qrTotal = splitQrGroups(savedCombinations).length;
        setQrMessage(`La Primitiva preparada con ${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;} · ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QRs&#x27;}.`);
      }
    }

    function updateGameOptions() {
      const isPrimitiva = gameSelect.value === &#x27;1&#x27;;
      reintegroWrap.hidden = !isPrimitiva;
      jokerWrap.hidden = !isPrimitiva;
      hideQr();
      updateQrGuidance();
      updateTxtGuidance();
    }

    function refreshSaveButton() {
      const complete = drawn.length === 6;
      const currentKey = complete ? combinationKey([...drawn].sort((a, b) =&gt; a - b)) : &#x27;&#x27;;
      savedCurrent = complete &amp;&amp; savedCombinations.some((combination) =&gt; combinationKey(combination) === currentKey);
      saveButton.disabled = busy || !complete || savedCurrent || savedCombinations.length &gt;= 8 || savedOrigin === &#x27;rules&#x27;;
      const randomCombinationsAvailable = savedOrigin === &#x27;random&#x27;
        ? savedCombinations.length &gt; 0
        : savedOrigin === null &amp;&amp; savedCombinations.length === 0 &amp;&amp; complete;
      copyRandomButton.disabled = busy || !randomCombinationsAvailable;

      if (savedOrigin === &#x27;rules&#x27; &amp;&amp; savedCombinations.length &gt; 0) {
        saveButton.textContent = &#x27;Lista de fijos/semifijos&#x27;;
      } else if (savedCurrent) {
        saveButton.textContent = &#x27;Combinación guardada&#x27;;
      } else if (savedCombinations.length &gt;= 8) {
        saveButton.textContent = &#x27;Lista completa&#x27;;
      } else {
        saveButton.textContent = &#x27;Guardar combinación&#x27;;
      }

      const nextDrawReady = !busy
        &amp;&amp; complete
        &amp;&amp; savedCurrent
        &amp;&amp; savedOrigin === &#x27;random&#x27;
        &amp;&amp; savedCombinations.length &lt; 8;
      resetButton.classList.toggle(&#x27;btn-primary&#x27;, nextDrawReady);
      resetButton.classList.toggle(&#x27;btn-ghost&#x27;, !nextDrawReady);
      resetButton.classList.toggle(&#x27;is-next-draw-ready&#x27;, nextDrawReady);
      resetButton.setAttribute(
        &#x27;aria-label&#x27;,
        nextDrawReady
          ? `Preparar el siguiente sorteo; faltan ${8 - savedCombinations.length} combinaciones para completar el boleto`
          : &#x27;Preparar un nuevo sorteo&#x27;
      );
    }

    function renderSavedCombinations() {
      savedList.replaceChildren();
      const pageTotal = Math.max(1, Math.ceil(savedCombinations.length / SAVED_PAGE_SIZE));
      savedPageIndex = Math.min(savedPageIndex, pageTotal - 1);

      if (savedCombinations.length === 0) {
        const empty = document.createElement(&#x27;li&#x27;);
        empty.className = &#x27;saved-empty&#x27;;
        empty.textContent = &#x27;Aún no has guardado ninguna combinación.&#x27;;
        savedList.appendChild(empty);
      } else {
        const firstIndex = savedPageIndex * SAVED_PAGE_SIZE;
        savedCombinations
          .slice(firstIndex, firstIndex + SAVED_PAGE_SIZE)
          .forEach((combination, pageOffset) =&gt; {
          const index = firstIndex + pageOffset;
          const item = document.createElement(&#x27;li&#x27;);
          item.className = &#x27;saved-item&#x27;;

          const position = document.createElement(&#x27;span&#x27;);
          position.className = &#x27;saved-index&#x27;;
          position.textContent = `${index + 1}.`;

          const numbers = document.createElement(&#x27;span&#x27;);
          numbers.className = &#x27;saved-numbers&#x27;;
          numbers.textContent = combination.map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;)).join(&#x27; · &#x27;);

          const removeButton = document.createElement(&#x27;button&#x27;);
          removeButton.className = &#x27;btn btn-ghost&#x27;;
          removeButton.type = &#x27;button&#x27;;
          removeButton.dataset.removeIndex = String(index);
          removeButton.textContent = &#x27;Quitar&#x27;;
          removeButton.setAttribute(&#x27;aria-label&#x27;, `Quitar combinación ${index + 1}`);

          item.append(position, numbers, removeButton);
          savedList.appendChild(item);
        });
      }

      const hasSeveralPages = savedCombinations.length &gt; SAVED_PAGE_SIZE;
      savedPagination.hidden = !hasSeveralPages;
      savedPage.textContent = `${savedPageIndex + 1} de ${pageTotal}`;
      savedPreviousButton.disabled = savedPageIndex === 0;
      savedNextButton.disabled = savedPageIndex &gt;= pageTotal - 1;
      savedCount.textContent = savedOrigin === &#x27;rules&#x27;
        ? String(savedCombinations.length)
        : `${savedCombinations.length} / 8`;
      clearSavedButton.disabled = savedCombinations.length === 0;
      generateQrButton.disabled = savedCombinations.length === 0;
      reduceSavedButton.disabled = savedCombinations.length &lt; 2;
      reduceRulesButton.disabled = ruleGeneratedCombinations.length &lt; 2;
      viewRuleCombinationsButton.disabled = savedOrigin !== &#x27;rules&#x27; || savedCombinations.length === 0;
      refreshSaveButton();
      updateQrGuidance();
      refreshFilterSourceButtons();
    }

    function saveCurrentCombination() {
      if (drawn.length !== 6 || savedCombinations.length &gt;= 8) return;
      if (savedOrigin === &#x27;rules&#x27;) {
        status.textContent = &#x27;Vacía la lista de fijos y semifijos antes de guardar combinaciones aleatorias.&#x27;;
        return;
      }

      const combination = [...drawn].sort((a, b) =&gt; a - b);
      let filterConfiguration;
      try {
        filterConfiguration = readZoneFilterConfiguration(
          drawFilterModeSelect,
          &#x27;Combinación del bombo&#x27;
        );
      } catch (error) {
        status.textContent = error.message;
        return;
      }
      if (
        filterConfiguration
        &amp;&amp; !combinationPassesActiveFilters(combination, filterConfiguration)
      ) {
        status.textContent =
          &#x27;La combinación extraída no cumple todos los filtros activos y no se ha guardado. Puedes iniciar otro sorteo o cambiar los filtros.&#x27;;
        summary.textContent =
          &#x27;La combinación se mantiene visible, pero no se añadió a la lista porque no supera las condiciones seleccionadas.&#x27;;
        return;
      }
      const key = combinationKey(combination);
      if (savedCombinations.some((saved) =&gt; combinationKey(saved) === key)) {
        status.textContent = &#x27;Esta combinación ya está guardada.&#x27;;
        refreshSaveButton();
        return;
      }

      savedOrigin = &#x27;random&#x27;;
      savedCombinations.push(combination);
      savedPageIndex = Math.max(0, Math.ceil(savedCombinations.length / SAVED_PAGE_SIZE) - 1);
      hideQr();
      renderSavedCombinations();
      const remainingSlots = 8 - savedCombinations.length;
      status.textContent = remainingSlots &gt; 0
        ? `Combinación guardada${filterConfiguration ? &#x27; con filtros&#x27; : &#x27;&#x27;} · ${combination.join(&#x27;, &#x27;)} · pulsa «Nuevo sorteo» para continuar.`
        : `Combinación guardada${filterConfiguration ? &#x27; con filtros&#x27; : &#x27;&#x27;} · ${combination.join(&#x27;, &#x27;)} · lista completa.`;
      summary.textContent = remainingSlots &gt; 0
        ? `Combinación ${savedCombinations.length} guardada. Quedan ${remainingSlots} combinaciones para completar el boleto; el botón Nuevo sorteo está resaltado.`
        : &#x27;Combinación 8 guardada. La lista está completa.&#x27;;
    }

    function removeSavedCombination(index) {
      if (!Number.isInteger(index) || index &lt; 0 || index &gt;= savedCombinations.length) return;
      if (savedOrigin === &#x27;rules&#x27;) {
        ruleGeneratedCombinations.splice(index, 1);
      }
      savedCombinations.splice(index, 1);
      if (savedCombinations.length === 0) savedOrigin = null;
      copyRulesButton.disabled = ruleGeneratedCombinations.length === 0;
      hideQr();
      renderSavedCombinations();
      summary.textContent = `Combinación eliminada. Quedan ${savedCombinations.length} combinaciones guardadas.`;
    }

    function clearSavedCombinations() {
      if (savedOrigin === &#x27;rules&#x27;) ruleGeneratedCombinations = [];
      savedCombinations = [];
      savedOrigin = null;
      savedPageIndex = 0;
      savedCurrent = false;
      copyRulesButton.disabled = ruleGeneratedCombinations.length === 0;
      hideQr();
      renderSavedCombinations();
      summary.textContent = &#x27;Se han eliminado todas las combinaciones guardadas.&#x27;;
    }

    function buildQrTextForTicket(combinations, product, weekly, joker, reintegro) {
      const bets = combinations.map((combination, index) =&gt; `.${index + 1}=${combinationKey(combination)}`).join(&#x27;&#x27;);
      const primitivaFields = product === &#x27;1&#x27; ? `J=${joker};R=${reintegro};` : &#x27;&#x27;;
      return `A=1;P=${product};W=${weekly};${bets};${primitivaFields}`;
    }

    function buildQrText(combinations) {
      return buildQrTextForTicket(
        combinations,
        gameSelect.value,
        periodSelect.value,
        jokerSelect.value,
        reintegroSelect.value
      );
    }

    function splitQrGroups(combinations) {
      const groups = [];
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      const bonolotoRequiresTwo = isBonoloto &amp;&amp; !getBonolotoQrRules().singleCombinationAllowed;
      let index = 0;

      if (bonolotoRequiresTwo &amp;&amp; combinations.length % 8 === 1 &amp;&amp; combinations.length &gt; 1) {
        while (combinations.length - index &gt; 9) {
          groups.push(combinations.slice(index, index + 8));
          index += 8;
        }
        groups.push(combinations.slice(index, index + 7));
        groups.push(combinations.slice(index + 7, index + 9));
        return groups;
      }

      while (index &lt; combinations.length) {
        groups.push(combinations.slice(index, index + 8));
        index += 8;
      }
      return groups;
    }

    function getQrSourceDetails(source) {
      if (source === &#x27;saved&#x27;) {
        if (savedOrigin === &#x27;rules&#x27;) {
          return {
            key: &#x27;rules&#x27;,
            label: &#x27;Generador con fijos y semifijos&#x27;,
            description: &#x27;Combinaciones creadas en la zona de fijos y semifijos.&#x27;
          };
        }
        return {
          key: &#x27;drum&#x27;,
          label: &#x27;Bombo · combinaciones extraídas y guardadas&#x27;,
          description: &#x27;Combinaciones obtenidas mediante la extracción del bombo y guardadas en el boleto.&#x27;
        };
      }

      if (source === &#x27;filtered&#x27;) {
        return filteredSourceDetails ?? {
          key: &#x27;filtered&#x27;,
          label: &#x27;Resultado de la zona de filtros&#x27;,
          description: &#x27;Combinaciones que cumplen todos los filtros activos.&#x27;
        };
      }

      if (source === &#x27;txt&#x27;) {
        if (importedSource === &#x27;clipboard&#x27;) {
          return {
            key: &#x27;clipboard&#x27;,
            label: &#x27;Combinaciones pegadas desde el portapapeles&#x27;,
            description: &#x27;Combinaciones introducidas pegando texto desde el portapapeles.&#x27;
          };
        }
        return {
          key: &#x27;file&#x27;,
          label: &#x27;Archivo TXT cargado&#x27;,
          description: &#x27;Combinaciones importadas desde un archivo TXT.&#x27;
        };
      }

      if (source === &#x27;development&#x27;) {
        if (developmentViewSelect.value === &#x27;full&#x27;) {
          return {
            key: &#x27;full&#x27;,
            label: &#x27;Desarrollo completo&#x27;,
            description: &#x27;Combinaciones procedentes del desarrollo completo generado.&#x27;
          };
        }
        return {
          key: &#x27;reduced&#x27;,
          label: &#x27;Reducción matemática&#x27;,
          description: &#x27;Combinaciones procedentes de la reducción generada.&#x27;
        };
      }

      if (source === &#x27;digital&#x27;) {
        return {
          key: &#x27;digital&#x27;,
          label: signatureSourceLabel(),
          description: digitalGeneratedSignatureMode === &#x27;combined&#x27;
            ? &#x27;Combinaciones procedentes de la intersección de la firma digital y la firma de terminación.&#x27;
            : digitalGeneratedSignatureMode === &#x27;termination&#x27;
              ? &#x27;Combinaciones naturales procedentes de la firma de terminaciones y sus equivalencias.&#x27;
              : &#x27;Combinaciones naturales equivalentes procedentes de la selección P1–P6, SDCD y equivalencias.&#x27;
        };
      }

      return {
        key: &#x27;saved&#x27;,
        label: &#x27;Combinaciones guardadas&#x27;,
        description: &#x27;Combinaciones enviadas al generador QR.&#x27;
      };
    }

    function getQrGroupSizesForOptions(total, product, period) {
      const sizes = [];
      const bonolotoRequiresTwo = product === &#x27;2&#x27;
        &amp;&amp; !getBonolotoQrRules(new Date(), period).singleCombinationAllowed;
      let remainingTotal = total;

      if (bonolotoRequiresTwo &amp;&amp; total % 8 === 1 &amp;&amp; total &gt; 1) {
        while (remainingTotal &gt; 9) {
          sizes.push(8);
          remainingTotal -= 8;
        }
        sizes.push(7, 2);
        return sizes;
      }

      while (remainingTotal &gt; 0) {
        const size = Math.min(8, remainingTotal);
        sizes.push(size);
        remainingTotal -= size;
      }
      return sizes;
    }

    function setQrSetupMessage(message, isError = false) {
      qrSetupMessage.textContent = message;
      qrSetupMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function setQrPreparationFeedback(source, message, isError = false) {
      if (source === &#x27;txt&#x27;) {
        txtMessage.textContent = message;
        txtMessage.classList.toggle(&#x27;is-error&#x27;, isError);
      } else if (source === &#x27;development&#x27;) {
        setDevelopmentMessage(message, isError);
      } else if (source === &#x27;digital&#x27;) {
        setDigitalMessage(message, isError ? &#x27;error&#x27; : &#x27;&#x27;);
      } else if (source === &#x27;filtered&#x27;) {
        setFilterMessage(message, isError);
      } else {
        setQrMessage(message, isError);
      }
    }

    function updateQrSetupGuidance() {
      const isPrimitiva = qrSetupGameSelect.value === &#x27;1&#x27;;
      const gameKey = isPrimitiva ? &#x27;primitiva&#x27; : &#x27;bonoloto&#x27;;
      const gameName = isPrimitiva ? &#x27;LA PRIMITIVA&#x27; : &#x27;BONOLOTO&#x27;;
      const total = pendingQrRequest?.combinations?.length ?? 0;
      const sourceDetails = pendingQrRequest?.sourceDetails;

      qrSetupReintegroWrap.hidden = !isPrimitiva;
      qrSetupJokerWrap.hidden = !isPrimitiva;
      qrSetupGameBadge.dataset.game = gameKey;
      qrSetupGameBadge.textContent = gameName;
      qrSetupReview.dataset.game = gameKey;
      qrSetupReviewGame.textContent = gameName;

      if (sourceDetails) {
        qrSetupSource.dataset.source = sourceDetails.key;
        qrSetupSourceValue.textContent = sourceDetails.label;
        qrSetupSource.title = sourceDetails.description;
      }
      qrSetupCount.textContent = `${total.toLocaleString(&#x27;es-ES&#x27;)} ${total === 1 ? &#x27;apuesta&#x27; : &#x27;apuestas&#x27;}`;

      const groupSizes = getQrGroupSizesForOptions(
        total,
        qrSetupGameSelect.value,
        qrSetupPeriodSelect.value
      );
      const qrTotal = groupSizes.length;
      let invalidMessage = &#x27;&#x27;;
      if (total === 0) {
        invalidMessage = &#x27;No hay apuestas preparadas para generar los códigos QR.&#x27;;
      } else if (!isPrimitiva) {
        const rules = getBonolotoQrRules(new Date(), qrSetupPeriodSelect.value);
        if (total &lt; rules.minimumCombinations) {
          invalidMessage = getBonolotoSingleCombinationError(rules);
        }
      }

      qrSetupConfirmButton.disabled = Boolean(invalidMessage);
      if (invalidMessage) {
        setQrSetupMessage(invalidMessage, true);
      } else {
        const periodName = qrSetupPeriodSelect.value === &#x27;1&#x27; ? &#x27;semana en curso&#x27; : &#x27;un día&#x27;;
        const primitivaDetails = isPrimitiva
          ? ` · reintegro ${qrSetupReintegroSelect.value} · Joker ${qrSetupJokerSelect.value === &#x27;0&#x27; ? &#x27;sí&#x27; : &#x27;no&#x27;}`
          : &#x27;&#x27;;
        setQrSetupMessage(
          `${gameName}: ${total.toLocaleString(&#x27;es-ES&#x27;)} ${total === 1 ? &#x27;apuesta&#x27; : &#x27;apuestas&#x27;} para ${periodName}${primitivaDetails}. Se crearán ${qrTotal} ${qrTotal === 1 ? &#x27;QR&#x27; : &#x27;QRs&#x27;}.`
        );
      }

      if (qrSetupCostSelect.value !== &#x27;1&#x27; || total === 0) {
        qrSetupCostPreview.textContent = &#x27;El coste estimado no se mostrará junto a los códigos QR.&#x27;;
        return;
      }

      const costDetails = groupSizes.map((count) =&gt; getQrCostDetailsForOptions(
        count,
        qrSetupGameSelect.value,
        qrSetupPeriodSelect.value,
        qrSetupJokerSelect.value
      ));
      const totalCost = costDetails.reduce((sum, details) =&gt; sum + details.total, 0);
      const drawCount = costDetails[0]?.drawCount ?? 0;
      const drawText = qrSetupPeriodSelect.value === &#x27;1&#x27;
        ? `${drawCount} ${drawCount === 1 ? &#x27;sorteo pendiente&#x27; : &#x27;sorteos pendientes&#x27;} esta semana`
        : &#x27;un único sorteo&#x27;;
      const jokerText = isPrimitiva &amp;&amp; qrSetupJokerSelect.value === &#x27;0&#x27;
        ? &#x27; Incluye 1,00 € de Joker por cada QR o boleto y sorteo.&#x27;
        : &#x27;&#x27;;
      qrSetupCostPreview.textContent = `Coste total estimado: ${formatEuro(totalCost)} para ${drawText}.${jokerText}`;
    }

    function scrollToQrSetup() {
      const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
      requestAnimationFrame(() =&gt; {
        const targetTop = qrSetupArea.getBoundingClientRect().top + window.scrollY - 12;
        window.scrollTo({
          top: Math.max(0, targetTop),
          behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27;
        });
        qrSetupArea.focus({ preventScroll: true });
        quickNavLinks.forEach((item) =&gt; item.removeAttribute(&#x27;aria-current&#x27;));
      });
    }

    function prepareQrGeneration(combinations, source) {
      const total = combinations.length;
      if (total === 0) {
        hideQr();
        const message = source === &#x27;txt&#x27;
          ? &#x27;Carga primero un archivo TXT o un texto con combinaciones válidas.&#x27;
          : source === &#x27;development&#x27;
            ? &#x27;Genera primero una reducción o un desarrollo completo.&#x27;
            : source === &#x27;digital&#x27;
              ? &#x27;Genera primero un desarrollo por firma posicional.&#x27;
            : source === &#x27;filtered&#x27;
              ? &#x27;Aplica primero los filtros y conserva al menos una combinación.&#x27;
            : &#x27;Guarda al menos una combinación antes de preparar el QR.&#x27;;
        setQrPreparationFeedback(source, message, true);
        return;
      }

      hideQr();
      const sourceDetails = getQrSourceDetails(source);
      pendingQrRequest = { combinations, source, sourceDetails };
      qrSetupGameSelect.value = gameSelect.value;
      qrSetupPeriodSelect.value = periodSelect.value;
      qrSetupReintegroSelect.value = reintegroSelect.value;
      qrSetupJokerSelect.value = jokerSelect.value;
      qrSetupCostSelect.value = costSelect.value;
      qrSetupArea.hidden = false;
      updateQrSetupGuidance();
      setQrPreparationFeedback(
        source,
        `${total.toLocaleString(&#x27;es-ES&#x27;)} ${total === 1 ? &#x27;apuesta preparada&#x27; : &#x27;apuestas preparadas&#x27;}. Confirma ahora la modalidad en «Configurar y generar QR».`
      );
      summary.textContent = `${total.toLocaleString(&#x27;es-ES&#x27;)} apuestas enviadas a la configuración del QR.`;
      scrollToQrSetup();
    }

    function cancelQrSetup() {
      pendingQrRequest = null;
      qrSetupArea.hidden = true;
      setQrSetupMessage(&#x27;Revisa los datos y confirma la generación.&#x27;);
      summary.textContent = &#x27;Se ha cancelado la configuración del código QR.&#x27;;
    }

    function confirmQrGeneration() {
      if (!pendingQrRequest) {
        setQrSetupMessage(&#x27;Vuelve a una zona de combinaciones y pulsa «Preparar QR».&#x27;, true);
        qrSetupConfirmButton.disabled = true;
        return;
      }

      updateQrSetupGuidance();
      if (qrSetupConfirmButton.disabled) return;

      const request = pendingQrRequest;
      gameSelect.value = qrSetupGameSelect.value;
      periodSelect.value = qrSetupPeriodSelect.value;
      reintegroSelect.value = qrSetupReintegroSelect.value;
      jokerSelect.value = qrSetupJokerSelect.value;
      costSelect.value = qrSetupCostSelect.value;
      updateGameOptions();

      const generated = generateQrPages(
        request.combinations,
        request.source,
        request.sourceDetails
      );
      if (!generated) {
        pendingQrRequest = request;
        qrSetupArea.hidden = false;
        updateQrSetupGuidance();
        return;
      }

      pendingQrRequest = null;
      qrSetupArea.hidden = true;
    }

    function showQrPage(index) {
      if (qrPages.length === 0) return;

      qrPageIndex = Math.max(0, Math.min(index, qrPages.length - 1));
      const currentPage = qrPages[qrPageIndex];
      const sourceDetails = currentPage.source;
      qrCode.replaceChildren();
      qrText.value = currentPage.text;
      qrArea.hidden = false;
      qrLabel.textContent = `Código QR ${qrPageIndex + 1} de ${qrPages.length}`;
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      const qrGameName = isBonoloto ? &#x27;Bonoloto&#x27; : &#x27;La Primitiva&#x27;;
      qrGame.dataset.game = isBonoloto ? &#x27;bonoloto&#x27; : &#x27;primitiva&#x27;;
      qrGame.title = qrGameName;
      qrGameLogo.src = isBonoloto ? qrGameLogoSources.bonoloto : qrGameLogoSources.primitiva;
      qrGameLogo.alt = `Logotipo de ${qrGameName}`;
      const qrIncludesJoker = !isBonoloto &amp;&amp; currentPage.text.includes(&#x27;;J=0;&#x27;);
      qrJoker.hidden = !qrIncludesJoker;
      if (qrIncludesJoker) {
        qrJokerLogo.src = qrGameLogoSources.joker;
      }
      qrPage.textContent = `QR ${qrPageIndex + 1} de ${qrPages.length}`;
      qrOrigin.dataset.source = sourceDetails.key;
      qrOriginValue.textContent = sourceDetails.label;
      qrOrigin.title = sourceDetails.description;
      qrPreviousButton.disabled = qrPageIndex === 0;
      qrNextButton.disabled = qrPageIndex === qrPages.length - 1;
      qrCode.setAttribute(&#x27;aria-label&#x27;, `Código QR ${qrPageIndex + 1} de ${qrPages.length}, con ${currentPage.combinations.length} combinaciones. Procedencia: ${sourceDetails.label}`);

      new QRCode(qrCode, {
        text: currentPage.text,
        width: 280,
        height: 280,
        colorDark: &#x27;#000000&#x27;,
        colorLight: &#x27;#ffffff&#x27;,
        correctLevel: QRCode.CorrectLevel.M
      });

      updateQrCost();
      const costSummary = costSelect.value === &#x27;1&#x27; ? ` Coste estimado: ${qrCostAmount.textContent}.` : &#x27;&#x27;;
      summary.textContent = `Mostrando el código QR ${qrPageIndex + 1} de ${qrPages.length}, con ${currentPage.combinations.length} combinaciones. Procedencia: ${sourceDetails.label}.${costSummary}`;
    }

    function generateQrPages(combinations, source, sourceDetailsOverride = null) {
      const total = combinations.length;
      const isBonoloto = gameSelect.value === &#x27;2&#x27;;
      const sourceIsTxt = source === &#x27;txt&#x27;;
      const bonolotoRules = isBonoloto ? getBonolotoQrRules() : null;
      const sourceDetails = sourceDetailsOverride ?? getQrSourceDetails(source);

      if (total === 0) {
        hideQr();
        if (sourceIsTxt) {
          txtMessage.textContent = &#x27;Selecciona primero un archivo TXT válido.&#x27;;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(&#x27;Guarda al menos una combinación antes de generar el QR.&#x27;, true);
        }
        return false;
      }

      if (isBonoloto &amp;&amp; total &lt; bonolotoRules.minimumCombinations) {
        hideQr();
        const message = getBonolotoSingleCombinationError(bonolotoRules);
        if (sourceIsTxt) {
          txtMessage.textContent = message;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(message, true);
        }
        return false;
      }

      if (typeof QRCode === &#x27;undefined&#x27;) {
        hideQr();
        const message = &#x27;No se ha podido iniciar el generador QR.&#x27;;
        if (sourceIsTxt) {
          txtMessage.textContent = message;
          txtMessage.classList.add(&#x27;is-error&#x27;);
        } else {
          setQrMessage(message, true);
        }
        return false;
      }

      const groups = splitQrGroups(combinations);
      qrPages = groups.map((group) =&gt; ({
        combinations: group,
        text: buildQrText(group),
        source: sourceDetails
      }));
      const createdAt = new Date().toISOString();
      currentGeneratedTicket = normaliseTicket({
        schema: TICKET_SCHEMA,
        version: TICKET_VERSION,
        id: makeTicketId(),
        name: cleanTicketName(&#x27;&#x27;, gameSelect.value, createdAt),
        createdAt,
        game: gameSelect.value,
        period: periodSelect.value,
        reintegro: gameSelect.value === &#x27;1&#x27; ? reintegroSelect.value : null,
        joker: gameSelect.value === &#x27;1&#x27; ? jokerSelect.value : null,
        source: sourceDetails,
        combinations: combinations.map((combination) =&gt; [...combination]),
        pages: qrPages.map((page) =&gt; ({ count: page.combinations.length, text: page.text }))
      });
      ticketNameInput.value = currentGeneratedTicket.name;
      setTicketActionMessage(&#x27;Este boleto ya puede guardarse en el navegador, copiarse o descargarse como TXT.&#x27;);
      qrPageIndex = 0;
      showQrPage(0);
      scrollToGeneratedQr();

      const gameName = isBonoloto ? &#x27;Bonoloto&#x27; : &#x27;La Primitiva&#x27;;
      const weeklySingleNote = isBonoloto &amp;&amp; total === 1
        ? ` Válida para los ${bonolotoRules.drawCount} sorteos pendientes de la semana.`
        : &#x27;&#x27;;
      const resultMessage = `${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;} repartidas en ${qrPages.length} ${qrPages.length === 1 ? &#x27;código QR&#x27; : &#x27;códigos QR&#x27;}.${weeklySingleNote}`;
      if (sourceIsTxt) {
        txtMessage.textContent = `${gameName}: ${resultMessage}`;
        txtMessage.classList.remove(&#x27;is-error&#x27;);
      } else {
        setQrMessage(`${gameName}: ${resultMessage}`);
      }
      summary.textContent = `${gameName}: ${resultMessage}`;
      return true;
    }

    function generateQr() {
      prepareQrGeneration(savedCombinations, &#x27;saved&#x27;);
    }

    function generateTxtQr() {
      prepareQrGeneration(importedCombinations, &#x27;txt&#x27;);
    }

    function combinationsToClipboardText(combinations) {
      return combinations
        .map((combination) =&gt; combination.map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;)).join(&#x27; &#x27;))
        .join(&#x27;\r\n&#x27;);
    }

    function findClipboard() {
      try {
        if (window.top?.navigator?.clipboard?.writeText) return window.top.navigator.clipboard;
      } catch (error) {
        // El entorno puede impedir el acceso a la ventana superior.
      }
      return window.navigator?.clipboard?.writeText ? window.navigator.clipboard : null;
    }

    function findReadableClipboard() {
      try {
        if (window.top?.navigator?.clipboard?.readText) return window.top.navigator.clipboard;
      } catch (error) {
        // El entorno puede impedir el acceso a la ventana superior.
      }
      return window.navigator?.clipboard?.readText ? window.navigator.clipboard : null;
    }

    async function copyTextToClipboard(text) {
      const clipboard = findClipboard();
      if (clipboard) {
        try {
          await clipboard.writeText(text);
          return { copied: true };
        } catch (error) {
          // Se intenta el método compatible con páginas locales.
        }
      }

      const textArea = document.createElement(&#x27;textarea&#x27;);
      textArea.className = &#x27;sr-only&#x27;;
      textArea.value = text;
      textArea.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
      textArea.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      document.body.appendChild(textArea);
      textArea.select?.();
      textArea.setSelectionRange?.(0, text.length);

      let copied = false;
      try {
        copied = typeof document.execCommand === &#x27;function&#x27; &amp;&amp; document.execCommand(&#x27;copy&#x27;);
      } catch (error) {
        copied = false;
      }
      textArea.remove();
      if (copied) return { copied: true };

      if (typeof window.prompt === &#x27;function&#x27;) {
        window.prompt(&#x27;Copia estas combinaciones y pégalas en un archivo TXT&#x27;, text);
        return { manual: true };
      }
      return { error: true };
    }

    async function copyRandomCombinations() {
      const combinations = savedOrigin === &#x27;random&#x27; &amp;&amp; savedCombinations.length &gt; 0
        ? savedCombinations
        : savedOrigin === null &amp;&amp; drawn.length === 6
          ? [[...drawn].sort((first, second) =&gt; first - second)]
          : [];

      if (combinations.length === 0) {
        status.textContent = &#x27;Genera o guarda primero al menos una combinación aleatoria.&#x27;;
        return;
      }

      const result = await copyTextToClipboard(combinationsToClipboardText(combinations));
      if (result.copied) {
        status.textContent = `${combinations.length} ${combinations.length === 1 ? &#x27;combinación aleatoria copiada&#x27; : &#x27;combinaciones aleatorias copiadas&#x27;} al portapapeles.`;
        summary.textContent = `${combinations.length} combinaciones aleatorias copiadas, una por línea.`;
      } else if (result.manual) {
        status.textContent = &#x27;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#x27;;
      } else if (result.error) {
        status.textContent = &#x27;No se han podido copiar las combinaciones.&#x27;;
      }
    }

    async function copyRuleCombinations() {
      if (ruleGeneratedCombinations.length === 0) {
        setRuleMessage(&#x27;Genera primero las combinaciones con fijos o semifijos.&#x27;, true);
        return;
      }

      const result = await copyTextToClipboard(combinationsToClipboardText(ruleGeneratedCombinations));
      if (result.copied) {
        setRuleMessage(`${ruleGeneratedCombinations.length} combinaciones copiadas al portapapeles, una por línea.`);
        summary.textContent = `${ruleGeneratedCombinations.length} combinaciones de fijos y semifijos copiadas.`;
      } else if (result.manual) {
        setRuleMessage(&#x27;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#x27;);
      } else if (result.error) {
        setRuleMessage(&#x27;No se han podido copiar las combinaciones.&#x27;, true);
      }
    }

    function showRuleGeneratedCombinations() {
      if (savedOrigin !== &#x27;rules&#x27; || savedCombinations.length === 0) {
        setRuleMessage(&#x27;Genera primero las combinaciones con fijos o semifijos.&#x27;, true);
        return;
      }
      savedPageIndex = 0;
      renderSavedCombinations();
      summary.textContent = `Mostrando ${savedCombinations.length} combinaciones generadas con fijos y semifijos.`;
      requestAnimationFrame(() =&gt; {
        savedSection.scrollIntoView({
          behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27;,
          block: &#x27;start&#x27;
        });
        savedSection.focus({ preventScroll: true });
      });
    }

    function setRuleMessage(message, isError = false) {
      ruleMessage.textContent = message;
      ruleMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function setTxtMessage(message, isError = false) {
      txtMessage.textContent = message;
      txtMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function populateRuleNumbers() {
      ruleNumberSelect.replaceChildren();
      for (let number = 1; number &lt;= 49; number += 1) {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = String(number);
        option.textContent = String(number).padStart(2, &#x27;0&#x27;);
        ruleNumberSelect.appendChild(option);
      }
    }

    function getRuleCombinationTotal() {
      const total = Math.trunc(Number(ruleTotalSelect.value));
      return Number.isInteger(total) ? Math.min(100, Math.max(1, total)) : 8;
    }

    function combinationCountLabel(total) {
      return `${total} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}`;
    }

    function getRulePositionStats() {
      const combinationTotal = getRuleCombinationTotal();
      const total = combinationTotal * 6;
      const fixed = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;).length * combinationTotal;
      const semi = numberRules
        .filter((rule) =&gt; rule.type === &#x27;semi&#x27;)
        .reduce((sum, rule) =&gt; sum + rule.appearances, 0);
      const occupied = fixed + semi;
      return {
        combinationTotal,
        total,
        fixed,
        semi,
        occupied,
        remaining: Math.max(0, total - occupied),
        excess: Math.max(0, occupied - total)
      };
    }

    function updateRulePositionSummary() {
      const positions = getRulePositionStats();
      const fixedWidth = positions.total &gt; 0 ? Math.min(100, positions.fixed / positions.total * 100) : 0;
      const semiWidth = positions.total &gt; 0
        ? Math.min(100 - fixedWidth, positions.semi / positions.total * 100)
        : 0;

      rulePositionTotal.textContent = String(positions.total);
      rulePositionFixed.textContent = String(positions.fixed);
      rulePositionSemi.textContent = String(positions.semi);
      rulePositionRemainingWrap.firstChild.textContent = positions.excess
        ? (positions.excess === 1 ? &#x27;Sobra &#x27; : &#x27;Sobran &#x27;)
        : &#x27;Por cubrir &#x27;;
      rulePositionRemaining.textContent = String(positions.excess || positions.remaining);
      rulePositionFixedBar.style.width = `${fixedWidth}%`;
      rulePositionSemiBar.style.width = `${semiWidth}%`;
      rulePositionSummary.classList.toggle(&#x27;has-excess&#x27;, positions.excess &gt; 0);
      rulePositionNote.classList.toggle(&#x27;is-error&#x27;, positions.excess &gt; 0);

      if (positions.excess &gt; 0) {
        rulePositionNote.textContent = positions.excess === 1
          ? &#x27;Sobra 1 posición entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.&#x27;
          : `Sobran ${positions.excess} posiciones entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.`;
      } else if (positions.occupied === 0) {
        rulePositionNote.textContent = `Las ${positions.total} posiciones se completarán aleatoriamente.`;
      } else if (positions.remaining === 0) {
        rulePositionNote.textContent = `Los criterios ocupan exactamente las ${positions.total} posiciones; no quedan huecos aleatorios.`;
      } else {
        rulePositionNote.textContent = `${positions.occupied} posiciones quedan definidas y ${positions.remaining} se completarán aleatoriamente.`;
      }

      rulePositionTrack.setAttribute(
        &#x27;aria-label&#x27;,
        positions.excess
          ? `Los criterios exceden en ${positions.excess} las ${positions.total} posiciones disponibles`
          : `${positions.occupied} de ${positions.total} posiciones ocupadas por los criterios`
      );
    }

    function updateRuleQuantityControls() {
      const total = getRuleCombinationTotal();
      const fixedOption = ruleTypeSelect.querySelector(&#x27;option[value=&quot;fixed&quot;]&#x27;);
      fixedOption.textContent = `Fijo · ${total} ${total === 1 ? &#x27;vez&#x27; : &#x27;veces&#x27;}`;
      generateTicketButton.textContent = `Generar ${combinationCountLabel(total)}`;
      ruleFrequencySelect.max = String(total);
      const requestedFrequency = Math.trunc(Number(ruleFrequencySelect.value));
      const preferredFrequency = Number.isInteger(requestedFrequency)
        ? Math.min(Math.max(1, requestedFrequency), total)
        : Math.max(1, Math.ceil(total / 2));
      ruleFrequencySelect.value = String(preferredFrequency);
      updateRulePositionSummary();
    }

    function updateRuleTypeControl() {
      ruleFrequencyWrap.hidden = ruleTypeSelect.value !== &#x27;semi&#x27;;
    }

    function assessRuleConfiguration() {
      const total = getRuleCombinationTotal();
      const fixedRules = numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;);
      const semiRules = numberRules.filter((rule) =&gt; rule.type === &#x27;semi&#x27;);
      const positions = getRulePositionStats();

      if (numberRules.length === 0) {
        return {
          valid: false,
          message: `Añade al menos un número fijo o semifijo para generar ${combinationCountLabel(total)}.`
        };
      }

      if (positions.excess &gt; 0) {
        return {
          valid: false,
          message: positions.excess === 1
            ? &#x27;Sobra 1 posición entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.&#x27;
            : `Sobran ${positions.excess} posiciones entre los criterios seleccionados. Reduce fijos o apariciones de semifijos.`
        };
      }

      if (fixedRules.length &gt; 6) {
        return { valid: false, message: &#x27;No puede haber más de 6 números fijos por combinación.&#x27; };
      }

      if (fixedRules.length === 6 &amp;&amp; total &gt; 1) {
        return {
          valid: false,
          message: `Con 6 números fijos solo se puede crear 1 combinación; ${total} resultarían idénticas.`
        };
      }

      if (semiRules.some((rule) =&gt; !Number.isInteger(rule.appearances) || rule.appearances &lt; 1 || rule.appearances &gt; total)) {
        return {
          valid: false,
          message: `Una frecuencia de semifijo no puede superar las ${combinationCountLabel(total)} seleccionadas.`
        };
      }

      const variableSemiRules = semiRules.filter((rule) =&gt; rule.appearances &lt; total);
      if (variableSemiRules.length === 0) {
        const requiredCount = fixedRules.length + semiRules.length;
        const randomPoolSize = 49 - numberRules.length;
        const distinctCapacity = limitedCombinationCount(randomPoolSize, 6 - requiredCount);
        if (distinctCapacity &lt; total) {
          return {
            valid: false,
            message: `Estas reglas solo permiten ${distinctCapacity} ${distinctCapacity === 1 ? &#x27;combinación distinta&#x27; : &#x27;combinaciones distintas&#x27;}; reduce la cantidad o cambia los criterios.`
          };
        }
      }

      const rowCapacity = 6 - fixedRules.length;
      const totalAppearances = semiRules.reduce((sum, rule) =&gt; sum + rule.appearances, 0);
      if (totalAppearances &gt; rowCapacity * total) {
        return {
          valid: false,
          message: `No es posible repartir ${totalAppearances} apariciones de semifijos: solo quedan ${rowCapacity * total} huecos después de los fijos.`
        };
      }

      const randomPoolSize = 49 - numberRules.length;
      const minimumSemiPerCombination = Math.max(0, 6 - fixedRules.length - randomPoolSize);
      if (totalAppearances &lt; minimumSemiPerCombination * total) {
        return {
          valid: false,
          message: &#x27;No quedan suficientes números libres para completar todas las combinaciones con estas reglas.&#x27;
        };
      }

      return {
        valid: true,
        message: positions.remaining === 0
          ? `Configuración posible: los criterios ocupan exactamente las ${positions.total} posiciones.`
          : `Configuración posible: quedan ${positions.remaining} posiciones para completar aleatoriamente.`
      };
    }

    function invalidateRuleGeneratedCombinations() {
      ruleGeneratedCombinations = [];
      copyRulesButton.disabled = true;
      refreshFilterSourceButtons();

    function renderNumberRules() {
      const total = getRuleCombinationTotal();
      ruleList.replaceChildren();

      if (numberRules.length === 0) {
        const empty = document.createElement(&#x27;li&#x27;);

              ? `Fijo · aparece en ${total === 1 ? &#x27;la combinación&#x27; : `las ${total}`}`

            removeButton.className = &#x27;btn btn-ghost&#x27;;

    function addNumberRule() {
      const total = getRuleCombinationTotal();
      const number = Number(ruleNumberSelect.value);
      const type = ruleTypeSelect.value;
      const requestedAppearances = Math.trunc(Number(ruleFrequencySelect.value));
      const appearances = type === &#x27;fixed&#x27;
        ? total
        : Math.min(Math.max(1, Number.isInteger(requestedAppearances) ? requestedAppearances : 1), total);

      if (numberRules.some((rule) =&gt; rule.number === number)) {
        setRuleMessage(`El número ${number} ya está seleccionado.`, true);
        return;
      }

      if (type === &#x27;fixed&#x27; &amp;&amp; numberRules.filter((rule) =&gt; rule.type === &#x27;fixed&#x27;).length &gt;= 6) {
        setRuleMessage(&#x27;Se permiten como máximo 6 números fijos por combinación.&#x27;, true);
        return;
      }

      invalidateRuleGeneratedCombinations();
      numberRules.push({ number, type, appearances });
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      const addedMessage = type === &#x27;fixed&#x27;
        ? `Número ${number} añadido como fijo.`
        : `Número ${number} añadido como semifijo en ${appearances} de ${total}.`;
      setRuleMessage(`${addedMessage} ${assessment.message}`, !assessment.valid);
    }

    function removeNumberRule(index) {
      if (!Number.isInteger(index) || index &lt; 0 || index &gt;= numberRules.length) return;
      invalidateRuleGeneratedCombinations();
      const removed = numberRules.splice(index, 1)[0];
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      setRuleMessage(
        `Número ${removed.number} eliminado de las reglas. ${assessment.message}`,
        numberRules.length &gt; 0 &amp;&amp; !assessment.valid
      );
    }

    function clearNumberRules() {
      invalidateRuleGeneratedCombinations();
      numberRules = [];
      renderNumberRules();
      setRuleMessage(&#x27;Se han quitado todos los números fijos y semifijos.&#x27;);
    }

    function handleRuleTotalChange() {
      const total = getRuleCombinationTotal();
      ruleTotalSelect.value = String(total);
      let adjustedRules = 0;
      invalidateRuleGeneratedCombinations();
      numberRules.forEach((rule) =&gt; {
        if (rule.type === &#x27;fixed&#x27;) {
          rule.appearances = total;
        } else if (rule.appearances &gt; total) {
          rule.appearances = total;
          adjustedRules += 1;
        }
      });
      updateRuleQuantityControls();
      renderNumberRules();
      const assessment = assessRuleConfiguration();
      const adjustmentMessage = adjustedRules &gt; 0
        ? `Se han ajustado ${adjustedRules} ${adjustedRules === 1 ? &#x27;frecuencia&#x27; : &#x27;frecuencias&#x27;} al nuevo máximo. `
        : &#x27;&#x27;;
      setRuleMessage(`${adjustmentMessage}${assessment.message}`, numberRules.length &gt; 0 &amp;&amp; !assessment.valid);
    }

    function secureShuffle(values) {
      const shuffled = values.slice();
      for (let index = shuffled.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = secureRandomIndex(index + 1);
        [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
      }
      return shuffled;
    }

    function scheduleScore(rows, semiRules, fixedCount, randomPoolSize) {
      const loads = rows.map((row) =&gt; row.length);
      const average = loads.reduce((total, load) =&gt; total + load, 0) / rows.length;
      let score = loads.reduce((total, load) =&gt; total + Math.abs(load - average), 0);
      const repeatedPatterns = new Map();

      rows.forEach((row) =&gt; {
