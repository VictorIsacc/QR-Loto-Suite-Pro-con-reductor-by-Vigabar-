<script>
(() => {
  if (!/^https?:$/.test(window.location.protocol)) return;

  const storageKey = 'qr-loto-suite-refresh-token';
  const queryKey = 'actualizacion';

  try {
    const currentUrl = new URL(window.location.href);
    const activeToken = window.sessionStorage.getItem(storageKey);

    if (activeToken && currentUrl.searchParams.get(queryKey) === activeToken) {
      currentUrl.searchParams.delete(queryKey);
      const cleanQuery = currentUrl.searchParams.toString();
      window.history.replaceState(
        null,
        '',
        `${currentUrl.pathname}${cleanQuery ? `?${cleanQuery}` : ''}${currentUrl.hash}`
      );
      return;
    }

    const freshToken = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    window.sessionStorage.setItem(storageKey, freshToken);
    currentUrl.searchParams.set(queryKey, freshToken);
    window.location.replace(currentUrl.toString());
  } catch (_) {
    // La aplicación continúa con normalidad si el navegador bloquea sessionStorage.
  }
})();
</script>

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;

  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {

  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

}

.form-range::-webkit-slider-runnable-track {

  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],

    .is-selected

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#39;lottery-simulator-649&#39;);
    const highLoadPanel = root.querySelector(&#39;.lottery-high-load&#39;);
    const highLoadOverrideInput = root.querySelector(&#39;#lottery-high-load-override&#39;);
    const highLoadStatus = root.querySelector(&#39;#lottery-high-load-status&#39;);
    const quickNavLinks = Array.from(root.querySelectorAll(&#39;.lottery-quick-link[data-lottery-tab]&#39;));
    const bulkTabShell = root.querySelector(&#39;.bulk-area&#39;);
    const tabPanels = {
      sorteo: [root.querySelector(&#39;.lottery-workspace&#39;)],
      rules: [bulkTabShell],
      digital: [root.querySelector(&#39;#lottery-digital-section&#39;)],
      distance: [root.querySelector(&#39;#lottery-distance-section&#39;)],
      filters: [root.querySelector(&#39;#lottery-filters-section&#39;)],
      development: [root.querySelector(&#39;#lottery-development-section&#39;)],
      txt: [bulkTabShell],
      qr: [root.querySelector(&#39;#lottery-qr-empty&#39;), root.querySelector(&#39;#lottery-qr-setup-section&#39;), root.querySelector(&#39;#lottery-qr-area&#39;)],
      scrutiny: [root.querySelector(&#39;#lottery-scrutiny-section&#39;)],
      tickets: [root.querySelector(&#39;#lottery-tickets-section&#39;)],
      settings: [root.querySelector(&#39;#lottery-settings-section&#39;)]
    };
    const allTabPanels = [...new Set(Object.values(tabPanels).flat().filter(Boolean))];
    const rulesTabChild = root.querySelector(&#39;#lottery-rules-section&#39;);
    const txtTabChild = root.querySelector(&#39;#lottery-txt-section&#39;);
    const qrEmptyArea = root.querySelector(&#39;#lottery-qr-empty&#39;);
    bulkTabShell?.classList.add(&#39;is-tab-shell&#39;, &#39;lottery-tab-panel&#39;);
    allTabPanels.forEach((panel) =&gt; panel.classList.add(&#39;lottery-tab-panel&#39;));
    rulesTabChild?.classList.add(&#39;lottery-tab-child&#39;);
    txtTabChild?.classList.add(&#39;lottery-tab-child&#39;);
    let activeLotteryTab = &#39;sorteo&#39;;

    function activateLotteryTab(tabName, options = {}) {
      const nextTab = tabPanels[tabName] ? tabName : &#39;sorteo&#39;;
      activeLotteryTab = nextTab;
      allTabPanels.forEach((panel) =&gt; panel.classList.remove(&#39;is-tab-active&#39;));
      tabPanels[nextTab].forEach((panel) =&gt; panel?.classList.add(&#39;is-tab-active&#39;));
      rulesTabChild?.classList.toggle(&#39;is-tab-active&#39;, nextTab === &#39;rules&#39;);
      txtTabChild?.classList.toggle(&#39;is-tab-active&#39;, nextTab === &#39;txt&#39;);
      if (qrEmptyArea) {
        const setupHidden = root.querySelector(&#39;#lottery-qr-setup-section&#39;)?.hidden !== false;
        const resultHidden = root.querySelector(&#39;#lottery-qr-area&#39;)?.hidden !== false;
        qrEmptyArea.hidden = !(nextTab === &#39;qr&#39; &amp;&amp; setupHidden &amp;&amp; resultHidden);
      }
      quickNavLinks.forEach((link) =&gt; {
        const selected = link.dataset.lotteryTab === nextTab;
        link.setAttribute(&#39;aria-selected&#39;, String(selected));
        link.toggleAttribute(&#39;aria-current&#39;, selected);
        if (selected) link.scrollIntoView({ block: &#39;nearest&#39;, inline: &#39;nearest&#39; });
      });
      const behavior = options.instant || window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches
        ? &#39;auto&#39;
        : &#39;smooth&#39;;
      window.scrollTo({ top: 0, behavior });
      if (options.focusTarget) {
        requestAnimationFrame(() =&gt; options.focusTarget.focus?.({ preventScroll: true }));
      }
    }

    quickNavLinks.forEach((link) =&gt; {
      link.addEventListener(&#39;click&#39;, (event) =&gt; {
        event.preventDefault();
        activateLotteryTab(link.dataset.lotteryTab);
      });
    });

    root.querySelectorAll(&#39;.lottery-mobile-saved-link[href=&quot;#lottery-saved-section&quot;]&#39;).forEach((link) =&gt; {
      link.addEventListener(&#39;click&#39;, (event) =&gt; {
        event.preventDefault();
        activateLotteryTab(&#39;sorteo&#39;, { instant: true });
        requestAnimationFrame(() =&gt; root.querySelector(&#39;#lottery-saved-section&#39;)?.scrollIntoView({
          behavior: window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches ? &#39;auto&#39; : &#39;smooth&#39;,
          block: &#39;start&#39;
        }));
      });
    });

    const tabInstallButton = root.querySelector(&#39;#lottery-tab-install&#39;);
    const tabZoomOutButton = root.querySelector(&#39;#lottery-tab-zoom-out&#39;);
    const tabZoomInput = root.querySelector(&#39;#lottery-tab-zoom-value&#39;);
    const tabZoomInButton = root.querySelector(&#39;#lottery-tab-zoom-in&#39;);
    const tabThemeButton = root.querySelector(&#39;#lottery-tab-theme&#39;);
    const sessionSaveButton = root.querySelector(&#39;#lottery-session-save&#39;);

    function countDigitalPatternEquivalents(pattern) {
      let ways = Array(pattern[0] &lt;= 4 ? 6 : 5).fill(1);
      for (let position = 1; position &lt; 6; position += 1) {
        const nextLength = pattern[position] &lt;= 4 ? 6 : 5;
        const strictLayerIncrease = pattern[position - 1] &gt;= pattern[position] ? 1 : 0;
        const prefixes = [];
        let total = 0;
        ways.forEach((value) =&gt; {
          total += value;
          prefixes.push(total);
        });
        ways = Array.from({ length: nextLength }, (_, layer) =&gt; {
          const limit = layer - strictLayerIncrease;
          if (limit &lt; 0) return 0;
          return prefixes[Math.min(limit, prefixes.length - 1)] ?? 0;
        });
      }
      return ways.reduce((total, value) =&gt; total + value, 0);
    }

          ? 0
          : previousLayer + (pattern[position - 1] &gt;= pattern[position] ? 1 : 0);
        const maximumLayer = pattern[position] &lt;= 4 ? 5 : 4;
        for (let layer = minimumLayer; layer &lt;= maximumLayer; layer += 1) {
          current.push(pattern[position] + 9 * layer);
          visit(position + 1, layer);
          current.pop();
        }
      }

      visit(0, 0);
      return combinations;
    }

    function naturalNumbersForTermination(termination) {
      const numbers = [];
      for (
        let number = termination === 0 ? 10 : termination;
        number &lt;= 49;
        number += 10
      ) {
        numbers.push(number);
      }
      return numbers;
    }

    function countTerminationPatternEquivalents(pattern) {
      let previousNumbers = naturalNumbersForTermination(pattern[0]);
      let previousWays = previousNumbers.map(() =&gt; 1);
      for (let position = 1; position &lt; 6; position += 1) {
        const currentNumbers = naturalNumbersForTermination(pattern[position]);
        const currentWays = currentNumbers.map((number) =&gt; {
          let total = 0;
          for (let index = 0; index &lt; previousNumbers.length; index += 1) {
            if (previousNumbers[index] &lt; number) total += previousWays[index];
          }
          return total;
        });
        previousNumbers = currentNumbers;
        previousWays = currentWays;
      }
      return previousWays.reduce((total, value) =&gt; total + value, 0);
    }

    function expandTerminationPattern(pattern) {
      const combinations = [];
      const current = [];
      function visit(position, previousNumber) {
        if (position === 6) {
          combinations.push([...current]);
          return;
        }
        naturalNumbersForTermination(pattern[position]).forEach((number) =&gt; {
          if (number &lt;= previousNumber) return;
          current.push(number);
          visit(position + 1, number);
          current.pop();
        });
      }
      visit(0, 0);
      return combinations;
    }

    async function analyseTerminationPatterns(safeLimit) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#39;termination&#39;);
      const allowedPositions = terminationSelections.map((selection) =&gt;
        [...selection].sort((first, second) =&gt; first - second)
      );
      const pattern = Array(6).fill(0);
      const classStats = Object.fromEntries(
        DIGITAL_EQUIVALENCE_VALUES.map((value) =&gt; [
          value,
          {
            patterns: 0,
            natural: 0,
            active: activeEquivalences.has(value)
          }
        ])
      );
      const patterns = [];
      let keepPatterns = true;
      let patternCount = 0;
      let naturalTotal = 0;

      function visit(position) {
        if (position === 6) {
          const equivalenceCount = countTerminationPatternEquivalents(pattern);
          if (!DIGITAL_EQUIVALENCE_VALUES.includes(equivalenceCount)) return;
          const stats = classStats[equivalenceCount];
          stats.patterns += 1;
          stats.natural += equivalenceCount;
          if (!activeEquivalences.has(equivalenceCount)) return;
          patternCount += 1;
          naturalTotal += equivalenceCount;
          if (keepPatterns) {
            if (naturalTotal &lt;= safeLimit) patterns.push([...pattern]);
            else {
              patterns.length = 0;
              keepPatterns = false;
            }
          }
          return;
        }
        allowedPositions[position].forEach((value) =&gt; {
          pattern[position] = value;
          visit(position + 1);
        });
      }

      for (let index = 0; index &lt; allowedPositions[0].length; index += 1) {
        pattern[0] = allowedPositions[0][index];
        visit(1);
        setDigitalMessage(
          `Analizando firmas de terminaci&#243;n… ${index + 1} de ${allowedPositions[0].length} bloques.`
        );
        await wait(0);
        if (digitalCancelRequested) return null;
      }

      return {
        mode: &#39;termination&#39;,
        patternCount,
        naturalTotal,
        classStats,
        patterns: keepPatterns ? patterns : [],
        withinLimit: naturalTotal &lt;= safeLimit
      };
    }

    async function analyseDigitalPatterns(safeLimit) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#39;digital&#39;);
      const allowedPositions = digitalSelections
        .slice(0, 6)
        .map((selection) =&gt; [...selection].sort((first, second) =&gt; first - second));
      const allowedSdcd = digitalSelections[6];
      const pattern = Array(6).fill(0);
      const classStats = Object.fromEntries(

      const patterns = [];

      function visit(position, digitalSum) {

          if (!allowedSdcd.has(digitalRoot(digitalSum))) return;
          const equivalenceCount = countDigitalPatternEquivalents(pattern);
          if (!DIGITAL_EQUIVALENCE_VALUES.includes(equivalenceCount)) return;
          const stats = classStats[equivalenceCount];
          stats.patterns += 1;
          stats.natural += equivalenceCount;
          if (!activeEquivalences.has(equivalenceCount)) return;
          patternCount += 1;

          if (keepPatterns) {

            }
          }

        }

        allowedPositions[position].forEach((value) =&gt; {
          pattern[position] = value;
          visit(position + 1, digitalSum + value);
        });
      }

      const firstValues = allowedPositions[0];
      for (let index = 0; index &lt; firstValues.length; index += 1) {
        pattern[0] = firstValues[index];
        visit(1, firstValues[index]);
        setDigitalMessage(
          `Analizando combinaciones digitales… ${index + 1} de ${firstValues.length} bloques.`
        );
        await wait(0);
        if (digitalCancelRequested) return null;
      }

      return {
        patternCount,

          } else if (digitalGeneratedSignatureMode === &#39;combined&#39;) {

    function terminationPatternKey(pattern) {
      return pattern.reduce((key, value) =&gt; key * 10 + value, 0);
    }

    function combinationMatchesTerminationConfiguration(combination, equivalenceCache) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#39;termination&#39;);
      const pattern = combination.map((number) =&gt; number % 10);
      for (let position = 0; position &lt; 6; position += 1) {
        if (!terminationSelections[position].has(pattern[position])) return false;
      }
      const key = terminationPatternKey(pattern);
      let equivalenceCount = equivalenceCache.get(key);
      if (equivalenceCount === undefined) {
        equivalenceCount = countTerminationPatternEquivalents(pattern);
        equivalenceCache.set(key, equivalenceCount);
      }
      return activeEquivalences.has(equivalenceCount);
    }

    async function generateCombinedSignatureDevelopment() {
      if (digitalBusy) return;
      if (!hasCompleteSignatureConfiguration(&#39;digital&#39;)) {
        setDigitalMessage(
          &#39;Completa P1–P6, SDCD y las equivalencias de la firma de ra&#237;z digital antes de combinar.&#39;,

          &#39;Completa P1–P6 y las equivalencias de la firma de terminaci&#243;n antes de combinar.&#39;,
          &#39;error&#39;
        );
        return;
      }

      digitalBusy = true;
      digitalCancelRequested = false;
      digitalGeneratedCombinations = [];

      refreshDigitalControls();
      const safeLimit = digitalDeviceLimit();
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);

          .slice(0, 6)
          .map((selection) =&gt; [...selection].sort((a, b) =&gt; a - b));
        const allowedSdcd = digitalSelections[6];
        const digitalPattern = Array(6).fill(0);
        const terminationEquivalenceCache = new Map();
        const generated = [];

        let candidateTotal = 0;
        let combinedTotal = 0;

        function visitDigital(position, digitalSum) {

            if (!allowedSdcd.has(digitalRoot(digitalSum))) return;
            const digitalEquivalence = countDigitalPatternEquivalents(digitalPattern);
            if (!activeDigitalEquivalences.has(digitalEquivalence)) return;
            patternCount += 1;
            const candidates = expandDigitalPattern(digitalPattern);
            candidateTotal += candidates.length;
            candidates.forEach((combination) =&gt; {
              if (!combinationMatchesTerminationConfiguration(

              )) return;

            &#39;warning&#39;
          );
          return;
        }
        if (generated.length !== combinedTotal) {
          throw new Error(
            `el recuento combinado era ${combinedTotal.toLocaleString(&#39;es-ES&#39;)} y se han conservado ${generated.length.toLocaleString(&#39;es-ES&#39;)}`
          );
        }

        digitalGeneratedCombinations = generated;
        digitalGeneratedPatternCount = patternCount;

    function validateDistanceCrossMode(mode) {

    function combinationMatchesDigitalConfiguration(combination, equivalenceCache) {
      const roots = combination.map(digitalRoot);
      for (let position = 0; position &lt; 6; position += 1) {
        if (!digitalSelections[position].has(roots[position])) return false;
      }
      const rootSum = roots.reduce((total, value) =&gt; total + value, 0);
      if (!digitalSelections[6].has(digitalRoot(rootSum))) return false;
      const key = roots.join(&#39;&#39;);
      let equivalenceCount = equivalenceCache.get(key);
      if (equivalenceCount === undefined) {
        equivalenceCount = countDigitalPatternEquivalents(roots);
        equivalenceCache.set(key, equivalenceCount);
      }
      return effectiveEquivalenceSelectionsForMode(&#39;digital&#39;).has(equivalenceCount);
    }

    function* enumerateDistancePatterns(allowed, allowedSums) {
      const current = Array(5).fill(0);
      const minimumRemaining = Array(6).fill(0);
      for (let index = 4; index &gt;= 0; index -= 1) {
        minimumRemaining[index] = minimumRemaining[index + 1] + allowed[index][0];
      }

      function* visit(position, sum) {
        if (position === 5) {
          if (allowedSums.has(sum)) yield [...current];
          return;
        }
        for (const value of allowed[position]) {
          const nextSum = sum + value;
          if (nextSum + minimumRemaining[position + 1] &gt; 48) break;
          current[position] = value;
          yield* visit(position + 1, nextSum);
        }
      }

      yield* visit(0, 0);
    }

    async function analyseDistanceDevelopment(safeLimit, crossMode) {
      const allowed = effectiveDistanceSelections().map((selection) =&gt;
        selection.sort((first, second) =&gt; first - second)
      );
      const allowedSums = effectiveDistanceSums();
      const digitalEquivalenceCache = new Map();
      const terminationEquivalenceCache = new Map();
      const generated = [];
      const sumStats = Object.fromEntries(
        DISTANCE_SUM_VALUES.map((sum) =&gt; [sum, { patterns: 0, natural: 0 }])
      );
      let keepGenerated = true;
      let patternCount = 0;
      let naturalTotal = 0;
      let examinedPatterns = 0;
      let examinedNaturals = 0;

      for (const pattern of enumerateDistancePatterns(allowed, allowedSums)) {
        const sum = pattern.reduce((total, value) =&gt; total + value, 0);
        const equivalents = 49 - sum;
        let matchingNaturals = 0;
        for (let start = 1; start &lt;= equivalents; start += 1) {
          const combination = [start];
          pattern.forEach((distance) =&gt; {
            combination.push(combination[combination.length - 1] + distance);
          });
          examinedNaturals += 1;
          if ((crossMode === &#39;digital&#39; || crossMode === &#39;both&#39;)
            &amp;&amp; !combinationMatchesDigitalConfiguration(combination, digitalEquivalenceCache)) {
            continue;
          }
          if ((crossMode === &#39;termination&#39; || crossMode === &#39;both&#39;)
            &amp;&amp; !combinationMatchesTerminationConfiguration(combination, terminationEquivalenceCache)) {
            continue;
          }
          matchingNaturals += 1;
          naturalTotal += 1;
          if (keepGenerated) {
            if (naturalTotal &lt;= safeLimit) generated.push(combination);
            else {
              generated.length = 0;
              keepGenerated = false;
            }
          }
        }
        examinedPatterns += 1;
        if (matchingNaturals &gt; 0) {
          patternCount += 1;
          sumStats[sum].patterns += 1;
          sumStats[sum].natural += matchingNaturals;
        }
        if (examinedPatterns % 3000 === 0 || examinedNaturals % 50000 === 0) {
          setDistanceMessage(
            `Analizando firmas… ${examinedPatterns.toLocaleString(&#39;es-ES&#39;)} revisadas &#183; ${naturalTotal.toLocaleString(&#39;es-ES&#39;)} naturales compatibles.`
          );
          await wait(0);
          if (distanceCancelRequested) return null;
        }
      }

      return {
        patternCount,
        naturalTotal,
        sumStats,
        generated: keepGenerated ? generated : [],
        withinLimit: naturalTotal &lt;= safeLimit
      };
    }

          numbers.textContent = combination.map((number) =&gt; String(number).padStart(2, &#39;0&#39;)).join(&#39; &#183; &#39;);
          const distances = combination.slice(1).map((number, position) =&gt; number - combination[position]);
          const sum = distances.reduce((totalValue, value) =&gt; totalValue + value, 0);
          const detail = document.createElement(&#39;span&#39;);
          detail.className = &#39;digital-result-roots&#39;;
          detail.textContent = `D ${distances.join(&#39;-&#39;)} &#183; Σ ${sum} &#183; ${49 - sum} equivalencias`;
          item.append(index, numbers, detail);
          distanceResultList.appendChild(item);
        });
      distanceOutput.hidden = total === 0;
      distanceResultCount.textContent = `${total.toLocaleString(&#39;es-ES&#39;)} ${total === 1 ? &#39;combinaci&#243;n&#39; : &#39;combinaciones&#39;}`;
      distancePagination.hidden = total &lt;= DIGITAL_PAGE_SIZE;
      distancePage.textContent = `${distancePageIndex + 1} de ${pageTotal}`;
      distancePreviousButton.disabled = distancePageIndex === 0;
      distanceNextButton.disabled = distancePageIndex &gt;= pageTotal - 1;

    async function generateDistanceDevelopment() {
      if (distanceBusy) return;
      if (effectiveDistanceSelections().some((selection) =&gt; selection.length === 0)) {
        setDistanceMessage(&#39;Activa al menos una distancia compatible con el filtro SD en cada pareja D1–2 a D5–6.&#39;, &#39;error&#39;);
        return;
      }
      const crossMode = distanceCrossModeSelect.value;
      if (!validateDistanceCrossMode(crossMode)) return;

      distanceBusy = true;
      distanceCancelRequested = false;
      distanceGeneratedCombinations = [];
      distanceGeneratedPatternCount = 0;
      distanceGeneratedCrossMode = crossMode;
      distanceOutput.hidden = true;
      resetDistanceQrWarning();
      refreshDistanceControls();
      const safeLimit = distanceDeviceLimit();
      distanceSafeLimit.textContent = formatOperationLimit(safeLimit);
      setDistanceMessage(`Calculando ${distanceCrossModeLabel(crossMode)}…`);

      try {
        const analysis = await analyseDistanceDevelopment(safeLimit, crossMode);
        if (!analysis || distanceCancelRequested) {
          setDistanceMessage(&#39;C&#225;lculo cancelado. No se ha guardado un resultado parcial.&#39;, &#39;warning&#39;);
          return;
        }
        renderDistanceAnalysis(analysis, safeLimit);
        if (analysis.naturalTotal === 0) {
          setDistanceMessage(&#39;No existen combinaciones naturales que cumplan simult&#225;neamente los criterios seleccionados.&#39;, &#39;error&#39;);
          return;
        }
        if (!analysis.withinLimit) {
          setDistanceMessage(
            `El desarrollo contiene ${analysis.naturalTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones y supera el l&#237;mite seguro de ${safeLimit.toLocaleString(&#39;es-ES&#39;)}. Reduce distancias o sumas, aplica una firma posicional m&#225;s restrictiva o autoriza la alta carga.`,
            &#39;warning&#39;
          );
          return;
        }
        distanceGeneratedCombinations = analysis.generated;
        distanceGeneratedPatternCount = analysis.patternCount;
        distancePageIndex = 0;
        distanceResultDescription.textContent =
          `${analysis.patternCount.toLocaleString(&#39;es-ES&#39;)} firmas v&#225;lidas han generado ${analysis.naturalTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones naturales mediante ${distanceCrossModeLabel(crossMode)}.`;
        renderDistanceResults();
        refreshFilterSourceButtons();
        setDistanceMessage(
          `Desarrollo completado: ${analysis.naturalTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones. Puedes copiarlas, filtrarlas, reducirlas, escrutarlas o preparar sus QR.`
        );
      } catch (error) {
        distanceGeneratedCombinations = [];
        distanceGeneratedPatternCount = 0;
        distanceOutput.hidden = true;
        refreshFilterSourceButtons();
        setDistanceMessage(`No se ha podido completar el desarrollo: ${error.message || &#39;error desconocido&#39;}.`, &#39;error&#39;);
      } finally {
        distanceBusy = false;
        distanceCancelRequested = false;
        refreshDistanceControls();
      }
    }

    function cancelDistanceDevelopment() {
      if (!distanceBusy || distanceCancelRequested) return;
      distanceCancelRequested = true;
      distanceCancelButton.disabled = true;
      setDistanceMessage(&#39;Cancelaci&#243;n solicitada. El proceso se detendr&#225; al finalizar el bloque actual.&#39;, &#39;warning&#39;);
    }

    async function copyDistanceDevelopment() {
      if (distanceGeneratedCombinations.length === 0) {
        setDistanceMessage(&#39;Genera primero un desarrollo por firma de distancias.&#39;, &#39;error&#39;);
        return;
      }
      const result = await copyTextToClipboard(
        combinationsToClipboardText(distanceGeneratedCombinations)
      );
      if (result.copied) {
        setDistanceMessage(`${distanceGeneratedCombinations.length.toLocaleString(&#39;es-ES&#39;)} combinaciones copiadas, una por l&#237;nea.`);
      } else if (result.manual) {
        setDistanceMessage(&#39;El navegador ha mostrado el desarrollo para copiarlo manualmente.&#39;);
      } else {
        setDistanceMessage(&#39;No se ha podido copiar el desarrollo.&#39;, &#39;error&#39;);
      }

    function generateDistanceQr() {
      const total = distanceGeneratedCombinations.length;
      if (total === 0) {
        setDistanceMessage(&#39;Genera primero un desarrollo por firma de distancias.&#39;, &#39;error&#39;);
        return;
      }
      if (total &gt; DIGITAL_QR_WARNING_THRESHOLD &amp;&amp; !distanceQrWarningArmed) {
        distanceQrWarningArmed = true;
        distanceQrButton.textContent = &#39;Confirmar preparaci&#243;n de QR&#39;;
        setDistanceMessage(
          `Este desarrollo contiene ${total.toLocaleString(&#39;es-ES&#39;)} apuestas y puede producir aproximadamente ${Math.ceil(total / 8).toLocaleString(&#39;es-ES&#39;)} c&#243;digos QR. Pulsa de nuevo para continuar.`,
          &#39;warning&#39;
        );

      }
      resetDistanceQrWarning();
      prepareQrGeneration(distanceGeneratedCombinations, &#39;distance&#39;);

    async function generateDistanceFromPositionalSignature(includeAllPositionalSignatures = false) {
      const crossMode = includeAllPositionalSignatures ? &#39;both&#39; : getSignatureMode();
      const requiredModes = crossMode === &#39;both&#39; ? [&#39;digital&#39;, &#39;termination&#39;] : [crossMode];
      const missingMode = requiredModes.find((mode) =&gt; !hasCompleteSignatureConfiguration(mode));
      if (missingMode) {
        const missingLabel = missingMode === &#39;digital&#39;
          ? &#39;la firma digital, incluida SDCD y sus equivalencias&#39;
          : &#39;la firma de terminaci&#243;n y sus equivalencias&#39;;
        setDigitalMessage(`Completa primero ${missingLabel}.`, &#39;error&#39;);
        return;
      }

      distanceCrossModeSelect.value = crossMode;
      clearDistanceGeneratedResult(
        crossMode === &#39;both&#39;
          ? &#39;Preparado el cruce de firma digital + firma de terminaci&#243;n + firma de distancia.&#39;
          : `Preparado para combinar distancias con ${signatureModeDetails(crossMode).sourceLabel.toLocaleLowerCase(&#39;es-ES&#39;)}.`
      );
      renderDistancePanel();
      const distanceSection = root.querySelector(&#39;#lottery-distance-section&#39;);
      activateLotteryTab(&#39;distance&#39;, { focusTarget: distanceSection });

      if (effectiveDistanceSelections().some((selection) =&gt; selection.length === 0)) {
        setDistanceMessage(
          crossMode === &#39;both&#39;
            ? &#39;Las dos firmas posicionales est&#225;n preparadas. Activa ahora al menos una distancia en cada pareja y pulsa &#171;Calcular y generar desarrollo&#187;.&#39;
            : &#39;La firma posicional ya est&#225; preparada. Activa ahora al menos una distancia en cada pareja y pulsa &#171;Calcular y generar desarrollo&#187;.&#39;,
          &#39;warning&#39;
        );
        return;
      }
      await wait(0);
      await generateDistanceDevelopment();
    }
