    function sendCombinationsToReducer(combinations, sourceDetails, feedback) {
      if (developmentBusy) {
        feedback?.(
          &#39;El reductor est&#225; realizando un c&#225;lculo. Det&#233;n o espera a que termine antes de enviar otro conjunto.&#39;,
          true
        );
        return false;
      }
      const seen = new Set();
      const prepared = [];
      combinations.forEach((combination) =&gt; {
        const normalised = [...combination].sort((first, second) =&gt; first - second);
        if (
          normalised.length !== 6 ||
          new Set(normalised).size !== 6 ||
          normalised.some((number) =&gt; !Number.isInteger(number) || number &lt; 1 || number &gt; 49)
        ) {
          return;
        }
        const key = combinationKey(normalised);
        if (seen.has(key)) return;
        seen.add(key);
        prepared.push(normalised);
      });

      if (prepared.length &lt; 2) {
        feedback?.(
          &#39;Se necesitan al menos 2 combinaciones distintas para utilizar el reductor.&#39;,
          true
        );
        return false;
      }

      const numbers = [...new Set(prepared.flat())].sort(
        (first, second) =&gt; first - second
      );
      if (numbers.length &lt; DEVELOPMENT_MIN_NUMBERS) {
        feedback?.(
          `Las combinaciones solo re&#250;nen ${numbers.length} n&#250;meros distintos; el reductor necesita al menos ${DEVELOPMENT_MIN_NUMBERS}.`,
          true

        return false;

      developmentExternalSource = {
        key: sourceDetails.key,
        label: sourceDetails.label,
        combinations: prepared.map((combination) =&gt; [...combination]),
        numbers,
        route: [...(sourceDetails.route ?? [sourceDetails.label])]

      developmentSelectedNumbers = numbers.slice();
      developmentFixedNumbers = [];
      developmentModeInputs.forEach((input) =&gt; {

      invalidateDevelopmentResults(
        `${prepared.length.toLocaleString(&#39;es-ES&#39;)} combinaciones recibidas desde &#171;${sourceDetails.label}&#187;. Elige la garant&#237;a, la cobertura y el m&#233;todo para reducir &#250;nicamente este universo.`
      );
      renderDevelopmentExternalSource();
      refreshDevelopmentControls();
      feedback?.(
        `${prepared.length.toLocaleString(&#39;es-ES&#39;)} combinaciones enviadas al reductor sin perder su procedencia.`

      summary.textContent =

      scrollToDevelopment();

            : `${baseText} Carga estimada ${feasibility.workload}. En m&#243;viles una carga alta puede ralentizar o bloquear temporalmente el navegador.`
          : `${baseText} Este desarrollo supera el l&#237;mite seguro de ${feasibility.limit.toLocaleString(&#39;es-ES&#39;)} combinaciones para generarlo dentro del navegador; reduce n&#250;meros o a&#241;ade fijos.`;
      } else {

        const baseText = fixedTotal &gt; 0

          : `La reducci&#243;n se calcular&#225; sobre ${fullTotal.toLocaleString(&#39;es-ES&#39;)} casos, ${coverageText}.`;
        developmentFullCount.textContent = feasibility.feasible
          ? feasibility.override

            : `${baseText} Carga estimada ${feasibility.workload}. En m&#243;viles una carga alta puede reducir mucho el rendimiento e incluso provocar que el navegador fuerce el bloqueo o cierre de la p&#225;gina.`
          : `${baseText} Con esta garant&#237;a se supera el l&#237;mite seguro de ${feasibility.limit.toLocaleString(&#39;es-ES&#39;)} casos para un navegador. A&#241;ade fijos, selecciona menos n&#250;meros o elige una garant&#237;a inferior.`;

      developmentNumberGrid.querySelectorAll(&#39;[data-development-number]&#39;).forEach((button) =&gt; {

        button.setAttribute(
          &#39;aria-label&#39;,
          fixed
            ? `N&#250;mero ${number}, fijo. Toca para quitarlo.`
            : selected
              ? `N&#250;mero ${number}, seleccionado. Toca para convertirlo en fijo.`
              : `N&#250;mero ${number}, no seleccionado. Toca para seleccionarlo.`

    function updateDevelopmentModeGuidance(prefix = &#39;&#39;) {

    function toggleDevelopmentNumber(number) {

    function selectRandomDevelopmentNumbers() {

    function clearDevelopmentNumbers() {

      developmentFixedNumbers = [];

      scrutinyOutput.hidden = true;
      summary.textContent = &#39;Generador y reductor limpiados.&#39;;
      refreshDevelopmentControls();
    }

    function createSixNumberEntries(numbers, fixedNumbers = []) {
      const entries = [];
      const fixedSet = new Set(fixedNumbers);
      const fixedIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? index : -1)
        .filter((index) =&gt; index &gt;= 0);
      const availableIndices = numbers
        .map((number, index) =&gt; fixedSet.has(number) ? -1 : index)
        .filter((index) =&gt; index &gt;= 0);
      const needed = 6 - fixedIndices.length;
      if (needed &lt; 0 || needed &gt; availableIndices.length) return entries;
      const positions = new Array(needed);
      let baseLow = 0;
      let baseHigh = 0;
      fixedIndices.forEach((index) =&gt; {
        if (index &lt; 32) baseLow |= 1 &lt;&lt; index;
        else baseHigh |= 1 &lt;&lt; (index - 32);
      });
      const visit = (depth, start, maskLow, maskHigh) =&gt; {
        if (depth === needed) {
          const indices = fixedIndices.concat(positions).sort((first, second) =&gt; first - second);
          entries.push({
            indices,
            mask: maskLow,
            maskLow: maskLow &gt;&gt;&gt; 0,
            maskHigh: maskHigh &gt;&gt;&gt; 0,
            maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
            combination: indices.map((index) =&gt; numbers[index])
          });
          return;
        }
        const remainingPlaces = needed - depth;
        for (let position = start; position &lt;= availableIndices.length - remainingPlaces; position += 1) {
          const index = availableIndices[position];
          positions[depth] = index;
          visit(
            depth + 1,
            position + 1,
            index &lt; 32 ? maskLow | (1 &lt;&lt; index) : maskLow,
            index &gt;= 32 ? maskHigh | (1 &lt;&lt; (index - 32)) : maskHigh
          );
        }
      };
      visit(0, 0, baseLow, baseHigh);
      return entries;
    }

    function createDevelopmentEntryFromCombination(numbers, combination) {
      const indices = combination
        .map((number) =&gt; numbers.indexOf(number))
        .sort((first, second) =&gt; first - second);
      if (indices.length !== 6 || indices.some((index) =&gt; index &lt; 0)) {
        throw new Error(&#39;La reducci&#243;n guardada no coincide con los n&#250;meros seleccionados.&#39;);
      }
      let maskLow = 0;
      let maskHigh = 0;
      indices.forEach((index) =&gt; {
        if (index &lt; 32) maskLow |= 1 &lt;&lt; index;
        else maskHigh |= 1 &lt;&lt; (index - 32);
      });
      return {
        indices,
        mask: maskLow,
        maskLow: maskLow &gt;&gt;&gt; 0,
        maskHigh: maskHigh &gt;&gt;&gt; 0,
        maskKey: `${maskLow &gt;&gt;&gt; 0}:${maskHigh &gt;&gt;&gt; 0}`,
        combination: combination.slice()
      };
    }

    function popcount32(value) {
      let current = value &gt;&gt;&gt; 0;
      current -= (current &gt;&gt;&gt; 1) &amp; 0x55555555;
      current = (current &amp; 0x33333333) + ((current &gt;&gt;&gt; 2) &amp; 0x33333333);
      return (((current + (current &gt;&gt;&gt; 4)) &amp; 0x0f0f0f0f) * 0x01010101) &gt;&gt;&gt; 24;
    }

    function developmentEntryHits(firstEntry, secondEntry) {
      return popcount32(firstEntry.maskLow &amp; secondEntry.maskLow) +
        popcount32(firstEntry.maskHigh &amp; secondEntry.maskHigh);
    }

    function forEachBitsetIndex(bitset, maximum, callback) {
      for (let wordIndex = 0; wordIndex &lt; bitset.length; wordIndex += 1) {
        let bits = bitset[wordIndex] &gt;&gt;&gt; 0;
        while (bits !== 0) {
          const lowestBit = (bits &amp; -bits) &gt;&gt;&gt; 0;
          const offset = 31 - Math.clz32(lowestBit);
          const index = wordIndex * 32 + offset;
          if (index &lt; maximum) callback(index);
          bits = (bits ^ lowestBit) &gt;&gt;&gt; 0;
        }
      }
    }

    function createFullBitset(total) {
      const bitset = new Uint32Array(Math.ceil(total / 32));
      for (let index = 0; index &lt; total; index += 1) {
        bitset[index &gt;&gt;&gt; 5] |= 1 &lt;&lt; (index &amp; 31);
      }
      return bitset;
    }

    function bitsetScore(bitset, uncovered) {
      let score = 0;
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        score += popcount32(bitset[wordIndex] &amp; uncovered[wordIndex]);
      }
      return score;
    }

    function removeCovered(uncovered, coverage) {
      for (let wordIndex = 0; wordIndex &lt; uncovered.length; wordIndex += 1) {
        uncovered[wordIndex] = (uncovered[wordIndex] &amp; ~coverage[wordIndex]) &gt;&gt;&gt; 0;
      }
    }

    function bitsetIsEmpty(bitset) {
      return bitset.every((word) =&gt; word === 0);
    }

    function mergeCoverage(target, source) {
      for (let wordIndex = 0; wordIndex &lt; target.length; wordIndex += 1) {
        target[wordIndex] |= source[wordIndex];
      }
    }

    async function buildDevelopmentCoverage(candidateEntries, winningEntries, guarantee) {
      const candidateTotal = candidateEntries.length;
      const universeTotal = winningEntries.length;
      const words = Math.ceil(universeTotal / 32);
      const coverage = Array.from({ length: candidateTotal }, () =&gt; new Uint32Array(words));
      const symmetricUniverse = candidateEntries === winningEntries;
      for (let first = 0; first &lt; candidateTotal; first += 1) {
        const start = symmetricUniverse ? first : 0;
        for (let second = start; second &lt; universeTotal; second += 1) {
          if (developmentEntryHits(candidateEntries[first], winningEntries[second]) &lt; guarantee) continue;
          coverage[first][second &gt;&gt;&gt; 5] |= 1 &lt;&lt; (second &amp; 31);
          if (symmetricUniverse) {
            coverage[second][first &gt;&gt;&gt; 5] |= 1 &lt;&lt; (first &amp; 31);
          }
        }
        if (first % 48 === 47) {
          const progress = Math.round(((first + 1) / candidateTotal) * 100);
          setDevelopmentMessage(`Preparando la comprobaci&#243;n matem&#225;tica… ${progress} %`);
          await wait(0);
        }
      }
      return coverage;
    }

    function createSeededRandom(seed) {
      let state = seed &gt;&gt;&gt; 0;
      return () =&gt; {
        state = (Math.imul(state, 1664525) + 1013904223) &gt;&gt;&gt; 0;
        return state / 4294967296;
      };
    }

    function shuffleWithRandom(values, random) {
      const result = values.slice();
      for (let index = result.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = Math.floor(random() * (index + 1));
        [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
      }
      return result;
    }

    function chooseBestCoverage(coverages, uncovered, excluded, random) {
      let bestScore = -1;
      let selectedIndex = -1;
      let equalBestTotal = 0;
      for (let index = 0; index &lt; coverages.length; index += 1) {
        if (excluded?.[index]) continue;
        const score = bitsetScore(coverages[index], uncovered);
        if (score &gt; bestScore) {
          bestScore = score;
          selectedIndex = index;
          equalBestTotal = 1;
        } else if (score === bestScore &amp;&amp; score &gt; 0) {
          equalBestTotal += 1;
          if (random() &lt; 1 / equalBestTotal) selectedIndex = index;
        }
      }
      return { index: selectedIndex, score: bestScore };
    }

    function pruneSelectedItems(selected, coverages, universeTotal, targetCount, random) {
      const coverageCounts = new Uint16Array(universeTotal);
      selected.forEach((selectedIndex) =&gt; {
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] += 1;
        });
      });

      let coveredTotal = coverageCounts.reduce((total, count) =&gt; total + (count &gt; 0 ? 1 : 0), 0);
      const retained = new Set(selected);
      shuffleWithRandom(selected, random).forEach((selectedIndex) =&gt; {
        let lostCases = 0;
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          if (coverageCounts[coveredIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &lt; targetCount) return;
        retained.delete(selectedIndex);
        forEachBitsetIndex(coverages[selectedIndex], universeTotal, (coveredIndex) =&gt; {
          coverageCounts[coveredIndex] -= 1;
        });
        coveredTotal -= lostCases;
      });
      return selected.filter((selectedIndex) =&gt; retained.has(selectedIndex));
    }

    async function createRandomReduction(coverage, random, universeTotal, targetCount, cycleProgress = null) {
      const candidateTotal = coverage.length;
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(candidateTotal);
      const selected = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(coverage, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#39;No se ha podido completar la cobertura.&#39;);
        used[best.index] = 1;
        selected.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, coverage[best.index]);
        if (selected.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso &#183; mejor B=${cycleProgress.best ?? &#39;—&#39;} &#183; ${cycleProgress.stagnant} sin mejora &#183; ${selected.length} apuestas provisionales &#183; ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `Construyendo la reducci&#243;n aleatoria… ${selected.length} apuestas provisionales &#183; ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }
      return pruneSelectedItems(selected, coverage, universeTotal, targetCount, random);
    }

    function rotateDevelopmentMask(mask, shift, size) {
      if (shift % size === 0) return mask;
      const normalized = shift % size;
      const limit = (1 &lt;&lt; size) - 1;
      return ((mask &lt;&lt; normalized) | (mask &gt;&gt;&gt; (size - normalized))) &amp; limit;
    }

    function createCycleGroups(entries, size, coverage, random) {
      const positionOrder = shuffleWithRandom(
        Array.from({ length: size }, (_, index) =&gt; index),
        random
      );
      const maskToIndex = new Map(entries.map((entry, index) =&gt; [entry.mask, index]));
      const assigned = new Uint8Array(entries.length);
      const words = Math.ceil(entries.length / 32);
      const groups = [];

      const toCycleMask = (originalMask) =&gt; positionOrder.reduce(
        (cycleMask, originalPosition, cyclePosition) =&gt;
          originalMask &amp; (1 &lt;&lt; originalPosition) ? cycleMask | (1 &lt;&lt; cyclePosition) : cycleMask,
        0
      );
      const fromCycleMask = (cycleMask) =&gt; positionOrder.reduce(
        (originalMask, originalPosition, cyclePosition) =&gt;
          cycleMask &amp; (1 &lt;&lt; cyclePosition) ? originalMask | (1 &lt;&lt; originalPosition) : originalMask,
        0
      );

      for (let entryIndex = 0; entryIndex &lt; entries.length; entryIndex += 1) {
        if (assigned[entryIndex]) continue;
        const cycleMask = toCycleMask(entries[entryIndex].mask);
        const indices = [];
        const uniqueIndices = new Set();
        for (let shift = 0; shift &lt; size; shift += 1) {
          const originalMask = fromCycleMask(rotateDevelopmentMask(cycleMask, shift, size));
          const rotatedIndex = maskToIndex.get(originalMask);
          if (rotatedIndex !== undefined &amp;&amp; !uniqueIndices.has(rotatedIndex)) {
            uniqueIndices.add(rotatedIndex);
            indices.push(rotatedIndex);
          }
        }
        indices.forEach((index) =&gt; {
          assigned[index] = 1;
        });
        const groupCoverage = new Uint32Array(words);
        indices.forEach((index) =&gt; mergeCoverage(groupCoverage, coverage[index]));
        groups.push({ indices, coverage: groupCoverage });
      }
      return groups;
    }

    async function createCycleReduction(entries, coverage, random, universeTotal, targetCount) {
      const groups = createCycleGroups(entries, developmentSelectedNumbers.length, coverage, random);
      const groupCoverages = groups.map((group) =&gt; group.coverage);
      const uncovered = createFullBitset(universeTotal);
      const used = new Uint8Array(groups.length);
      const selectedGroups = [];
      let coveredTotal = 0;
      while (coveredTotal &lt; targetCount) {
        const best = chooseBestCoverage(groupCoverages, uncovered, used, random);
        if (best.index &lt; 0 || best.score &lt;= 0) throw new Error(&#39;No se ha podido completar la cobertura por ciclos.&#39;);
        used[best.index] = 1;
        selectedGroups.push(best.index);
        coveredTotal += best.score;
        removeCovered(uncovered, groupCoverages[best.index]);
        if (selectedGroups.length % 3 === 0) {
          setDevelopmentMessage(`Construyendo la reducci&#243;n por ciclos… ${selectedGroups.length} ciclos provisionales.`);
          await wait(0);
        }
      }
      const retainedGroups = pruneSelectedItems(selectedGroups, groupCoverages, universeTotal, targetCount, random);
      const ticketIndices = retainedGroups.flatMap((groupIndex) =&gt; groups[groupIndex].indices);
      return {
        ticketIndices: [...new Set(ticketIndices)],
        cycleTotal: retainedGroups.length
      };
    }

    async function createHybridReduction(entries, coverage, random, universeTotal, targetCount) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateIndices = await createRandomReduction(coverage, random, universeTotal, targetCount, {
          cycle: completedCycles,
          best: bestIndices?.length ?? null,
          stagnant: stagnantCycles
        });
        const candidateVerification = verifyDevelopmentReduction(
          candidateIndices,
          coverage,
          universeTotal,
          targetCount
        );
        if (
          bestIndices === null ||
          candidateIndices.length &lt; bestIndices.length ||
          (candidateIndices.length === bestIndices.length &amp;&amp; candidateVerification.coveredTotal &gt; bestCoveredTotal)
        ) {
          bestIndices = candidateIndices.slice();
          bestCoveredTotal = candidateVerification.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
          if (
            candidateIndices.length === bestIndices.length &amp;&amp;
            candidateVerification.coveredTotal === bestCoveredTotal &amp;&amp;
            random() &lt; 0.5
          ) {
            bestIndices = candidateIndices.slice();
          }
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} &#183; mejor resultado B=${bestIndices.length} &#183; cobertura ${formatDevelopmentPercentage(bestCoveredTotal / universeTotal * 100)} &#183; ${stagnantCycles} ${stagnantCycles === 1 ? &#39;ciclo sin mejora&#39; : &#39;ciclos sin mejora&#39;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        completedCycles,
        stagnantCycles
      };
    }

    async function createSparseRandomReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount,
      cycleProgress = null
    ) {
      const universeTotal = winningEntries.length;
      const coverageCounts = new Uint16Array(universeTotal);
      const selectedRecords = [];
      let coveredTotal = 0;

      const findUncoveredIndex = () =&gt; {
        const start = Math.floor(random() * universeTotal);
        for (let offset = 0; offset &lt; universeTotal; offset += 1) {
          const index = (start + offset) % universeTotal;
          if (coverageCounts[index] === 0) return index;
        }
        return -1;
      };

      while (coveredTotal &lt; targetCount) {
        const ticketIndex = findUncoveredIndex();
        if (ticketIndex &lt; 0) break;
        const ticketEntry = candidateEntries[ticketIndex];
        const coveredIndices = [];
        for (let winningIndex = 0; winningIndex &lt; universeTotal; winningIndex += 1) {
          if (developmentEntryHits(ticketEntry, winningEntries[winningIndex]) &gt;= guarantee) {
            coveredIndices.push(winningIndex);
          }
        }
        coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 0) coveredTotal += 1;
          coverageCounts[winningIndex] += 1;
        });
        selectedRecords.push({ index: ticketIndex, coveredIndices });
        if (selectedRecords.length % 4 === 0) {
          const provisionalPercentage = universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100;
          setDevelopmentMessage(
            cycleProgress
              ? `Ciclo ${cycleProgress.cycle} en curso &#183; mejor B=${cycleProgress.best ?? &#39;—&#39;} &#183; ${selectedRecords.length} apuestas provisionales &#183; ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
              : `C&#225;lculo avanzado en curso… ${selectedRecords.length} apuestas provisionales &#183; ${formatDevelopmentPercentage(provisionalPercentage)} cubierto.`
          );
          await wait(0);
        }
      }

      const retained = new Set(selectedRecords.map((record) =&gt; record.index));
      const pruningOrder = shuffleWithRandom(selectedRecords, random);
      for (let recordIndex = 0; recordIndex &lt; pruningOrder.length; recordIndex += 1) {
        const record = pruningOrder[recordIndex];
        let lostCases = 0;
        record.coveredIndices.forEach((winningIndex) =&gt; {
          if (coverageCounts[winningIndex] === 1) lostCases += 1;
        });
        if (coveredTotal - lostCases &gt;= targetCount) {
          retained.delete(record.index);
          record.coveredIndices.forEach((winningIndex) =&gt; {
            coverageCounts[winningIndex] -= 1;
          });
          coveredTotal -= lostCases;
        }
        if (recordIndex % 24 === 23) await wait(0);
      }

      return {
        ticketIndices: selectedRecords
          .map((record) =&gt; record.index)
          .filter((index) =&gt; retained.has(index)),
        coveredTotal
      };
    }

    async function createSparseHybridReduction(
      candidateEntries,
      winningEntries,
      guarantee,
      random,
      targetCount
    ) {
      let bestIndices = null;
      let bestCoveredTotal = 0;
      let completedCycles = 0;
      let stagnantCycles = 0;
      do {
        completedCycles += 1;
        const candidateResult = await createSparseRandomReduction(
          candidateEntries,
          winningEntries,
          guarantee,
          random,
          targetCount,
          {
            cycle: completedCycles,
            best: bestIndices?.length ?? null,
            stagnant: stagnantCycles
          }
        );
        if (
          bestIndices === null ||
          candidateResult.ticketIndices.length &lt; bestIndices.length ||
          (
            candidateResult.ticketIndices.length === bestIndices.length &amp;&amp;
            candidateResult.coveredTotal &gt; bestCoveredTotal
          )
        ) {
          bestIndices = candidateResult.ticketIndices.slice();
          bestCoveredTotal = candidateResult.coveredTotal;
          stagnantCycles = 0;
        } else {
          stagnantCycles += 1;
        }
        setDevelopmentMessage(
          `Ciclo ${completedCycles} &#183; mejor resultado B=${bestIndices.length} &#183; cobertura ${formatDevelopmentPercentage(bestCoveredTotal / winningEntries.length * 100)} &#183; ${stagnantCycles} ${stagnantCycles === 1 ? &#39;ciclo sin mejora&#39; : &#39;ciclos sin mejora&#39;}.`
        );
        await wait(0);
      } while (!developmentStopRequested);
      return {
        ticketIndices: bestIndices || [],
        coveredTotal: bestCoveredTotal,
        completedCycles,
        stagnantCycles
      };
    }

    function verifyDevelopmentReduction(selectedIndices, coverage, universeTotal, targetCount = universeTotal) {
      const covered = new Uint32Array(Math.ceil(universeTotal / 32));
      selectedIndices.forEach((index) =&gt; mergeCoverage(covered, coverage[index]));
      let coveredTotal = 0;
      covered.forEach((word) =&gt; {
        coveredTotal += popcount32(word);
      });
      return {
        valid: coveredTotal &gt;= targetCount,
        coveredTotal,
        coveragePercentage: universeTotal === 0 ? 0 : coveredTotal / universeTotal * 100
      };
    }

    async function calculateDevelopmentPrizeBreakdown(winningEntries, ticketEntries, options = {}) {
      const groups = Array.from({ length: 7 }, () =&gt; ({
        cases: 0,
        minimums: Array(7).fill(Infinity),
        maximums: Array(7).fill(0)
      }));
      const yieldEvery = Math.max(
        1,
        Math.min(512, Math.floor(250000 / Math.max(1, ticketEntries.length)))
      );

      for (let winningIndex = 0; winningIndex &lt; winningEntries.length; winningIndex += 1) {
        const winningEntry = winningEntries[winningIndex];
        const prizesByHits = Array(7).fill(0);
        ticketEntries.forEach((ticketEntry) =&gt; {
          const hits = developmentEntryHits(winningEntry, ticketEntry);
          prizesByHits[hits] += 1;
        });
        let bestHits = 6;
        while (bestHits &gt; 0 &amp;&amp; prizesByHits[bestHits] === 0) bestHits -= 1;
        const group = groups[bestHits];
        group.cases += 1;
        for (let hits = 0; hits &lt;= 6; hits += 1) {
          group.minimums[hits] = Math.min(group.minimums[hits], prizesByHits[hits]);
          group.maximums[hits] = Math.max(group.maximums[hits], prizesByHits[hits]);
        }
        if (
          winningIndex % yieldEvery === yieldEvery - 1 ||
          winningIndex === winningEntries.length - 1
        ) {
          if (options.shouldCancel?.()) {
            const cancellationError = new Error(&#39;BREAKDOWN_CANCELLED&#39;);
            cancellationError.code = &#39;BREAKDOWN_CANCELLED&#39;;
            throw cancellationError;
          }
          options.onProgress?.(
            Math.min(100, Math.round((winningIndex + 1) / winningEntries.length * 100))
          );
          await wait(0);
        }
      }

      let cumulativeCases = 0;
      return Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((guarantee) =&gt; {
        const group = groups[guarantee];
        cumulativeCases += group.cases;
        return {
          guarantee,
          cases: group.cases,
          coverage: winningEntries.length === 0 ? 0 : cumulativeCases / winningEntries.length * 100,
          ranges: Array.from({ length: 7 }, (_, index) =&gt; 6 - index).map((hits) =&gt; {
            if (group.cases === 0) return &#39;—&#39;;
            return `${group.minimums[hits]}–${group.maximums[hits]}`;
          })
        };
      });
    }

    function renderDevelopmentPrizeBreakdown(rows) {
      developmentBreakdownBody.replaceChildren();
      rows.forEach((rowData) =&gt; {
        const row = document.createElement(&#39;tr&#39;);
        row.classList.toggle(&#39;has-cases&#39;, rowData.cases &gt; 0);
        const values = [
          rowData.cases.toLocaleString(&#39;es-ES&#39;),
          formatDevelopmentPercentage(rowData.coverage),
          `${rowData.guarantee} si 6`,
          ...rowData.ranges
        ];
        values.forEach((value) =&gt; {
          const cell = document.createElement(&#39;td&#39;);
          cell.textContent = value;
          row.appendChild(cell);
        });
        developmentBreakdownBody.appendChild(row);
      });
    }

    function renderSelectedDevelopmentPrizeBreakdown() {
      developmentBreakdownPending.hidden = true;
      developmentBreakdownTableWrap.hidden = false;
      developmentBreakdownNote.hidden = false;
      const hasFixedNumbers = developmentGeneratedFixedNumbers.length &gt; 0;
      const hasGeneralBreakdown = developmentBreakdownData.general.length &gt; 0;
      developmentBreakdownViewWrap.hidden = !hasFixedNumbers || !hasGeneralBreakdown;
      if (!hasFixedNumbers || !hasGeneralBreakdown) developmentBreakdownViewSelect.value = &#39;conditioned&#39;;
      const selectedView = hasFixedNumbers &amp;&amp; hasGeneralBreakdown
        ? developmentBreakdownViewSelect.value
        : &#39;conditioned&#39;;

      renderDevelopmentPrizeBreakdown(rows);

      if (hasFixedNumbers &amp;&amp; selectedView === &#39;conditioned&#39;) {

          `Sistema condicionado: ${conditionedCases.toLocaleString(&#39;es-ES&#39;)} casos en los que se aciertan los ${developmentGeneratedFixedNumbers.length} fijos (${developmentGeneratedFixedNumbers.map((number) =&gt; String(number).padStart(2, &#39;0&#39;)).join(&#39;, &#39;)}).`;
        developmentBreakdownNote.textContent = hasGeneralBreakdown
          ? &#39;La cobertura es acumulada y est&#225; condicionada a acertar todos los fijos. &#171;5 si 6&#187; incluye los casos con 5 o 6 aciertos.&#39;
          : &#39;La cobertura est&#225; condicionada a acertar todos los fijos. Por el tama&#241;o del sistema se ha omitido el desglose general para proteger el rendimiento del dispositivo.&#39;;
      } else if (hasFixedNumbers) {

        developmentBreakdownDescription.textContent =
          `Desglose general sobre los ${generalCases.toLocaleString(&#39;es-ES&#39;)} posibles resultados de seis n&#250;meros, sin presuponer que se acierten los fijos.`;
        developmentBreakdownNote.textContent =
          &#39;Este desglose general complementa la garant&#237;a condicionada. La cobertura es acumulada y no incluye complementario, reintegro ni Joker.&#39;;
      } else {
        developmentBreakdownDescription.textContent = developmentGeneratedExternalSourceLabel
          ? `Desglose condicionado al universo recibido desde &#171;${developmentGeneratedExternalSourceLabel}&#187; y cantidad m&#237;nima–m&#225;xima de apuestas premiadas.`
          : &#39;Casos posibles al acertar los 6 n&#250;meros seleccionados y cantidad m&#237;nima–m&#225;xima de apuestas premiadas en la reducci&#243;n.&#39;;
        developmentBreakdownNote.textContent = developmentGeneratedExternalSourceLabel
          ? &#39;La cobertura solo se refiere a las combinaciones del universo recibido. Es acumulada y no incluye complementario, reintegro ni Joker.&#39;
          : &#39;La cobertura es acumulada: por ejemplo, &#171;5 si 6&#187; incluye todos los casos con al menos 5 aciertos. No se incluyen complementario, reintegro ni Joker.&#39;;
      }
    }

    function renderPendingDevelopmentBreakdown() {
      if (!developmentPendingBreakdown) return;
      const pending = developmentPendingBreakdown;
      developmentBreakdown.hidden = false;
      developmentBreakdownViewWrap.hidden = true;
      developmentBreakdownTableWrap.hidden = true;
      developmentBreakdownNote.hidden = true;
      developmentBreakdownPending.hidden = false;
      developmentBreakdownCalculateButton.hidden = developmentBreakdownBusy;
      developmentBreakdownCancelButton.hidden = !developmentBreakdownBusy;
      developmentBreakdownCancelButton.disabled = developmentBreakdownCancelRequested;
      developmentBreakdownCancelButton.textContent = developmentBreakdownCancelRequested
        ? &#39;Cancelando…&#39;
        : &#39;Cancelar c&#225;lculo&#39;;
      developmentBreakdownDescription.textContent =
        &#39;La cobertura solicitada est&#225; comprobada, pero el desglose detallado requiere un c&#225;lculo adicional muy exigente.&#39;;
      developmentBreakdownPendingText.textContent =
        `${pending.caseTotal.toLocaleString(&#39;es-ES&#39;)} casos &#215; ${pending.ticketTotal.toLocaleString(&#39;es-ES&#39;)} apuestas = aproximadamente ${pending.comparisonTotal.toLocaleString(&#39;es-ES&#39;)} comparaciones.`;
    }

    async function calculatePendingDevelopmentBreakdown() {
      if (!developmentPendingBreakdown || developmentBreakdownBusy) return;
      const pending = developmentPendingBreakdown;
      developmentBreakdownBusy = true;
      developmentBreakdownCancelRequested = false;
      developmentBusy = true;
      renderPendingDevelopmentBreakdown();
      refreshDevelopmentControls();
      setDevelopmentWarning(
        `Calculando voluntariamente el desglose de ${pending.caseTotal.toLocaleString(&#39;es-ES&#39;)} casos. Puedes cancelarlo; en m&#243;viles puede tardar bastante.`
      );

      try {
        let winningEntries = pending.universeCombinations
          ? pending.universeCombinations.map((combination) =&gt;
              createDevelopmentEntryFromCombination(pending.numbers, combination)
            )
          : createSixNumberEntries(pending.numbers, pending.fixedNumbers);
        if (pending.filterConfiguration &amp;&amp; !pending.universeAlreadyFiltered) {
          winningEntries = winningEntries.filter((entry) =&gt;
            combinationPassesActiveFilters(entry.combination, pending.filterConfiguration)
          );
        }
        const ticketEntries = pending.combinations.map((combination) =&gt;
          createDevelopmentEntryFromCombination(pending.numbers, combination)
        );
        await wait(0);
        const rows = await calculateDevelopmentPrizeBreakdown(
          winningEntries,
          ticketEntries,
          {
            shouldCancel: () =&gt; developmentBreakdownCancelRequested,
            onProgress: (progress) =&gt; {
              setDevelopmentWarning(
                `Calculando el desglose completo… ${progress} %. No cierres la p&#225;gina si deseas conservar el c&#225;lculo.`
              );
            }
          }
        );
        developmentBreakdownData.conditioned = rows;
        developmentPendingBreakdown = null;
        developmentBreakdownPending.hidden = true;
        developmentBreakdownTableWrap.hidden = false;
        developmentBreakdownNote.hidden = false;
        renderSelectedDevelopmentPrizeBreakdown();
        setDevelopmentMessage(
          `Desglose completo calculado sobre ${pending.caseTotal.toLocaleString(&#39;es-ES&#39;)} casos y ${pending.ticketTotal.toLocaleString(&#39;es-ES&#39;)} apuestas.`
        );
      } catch (error) {
        if (error.code === &#39;BREAKDOWN_CANCELLED&#39;) {
          setDevelopmentWarning(
            &#39;C&#225;lculo del desglose cancelado. La reducci&#243;n y su cobertura comprobada se conservan; puedes volver a solicitarlo cuando quieras.&#39;
          );
        } else {
          setDevelopmentMessage(`No se ha podido calcular el desglose: ${error.message}`, true);
        }
      } finally {
        developmentBreakdownBusy = false;
        developmentBreakdownCancelRequested = false;
        developmentBusy = false;
        if (developmentPendingBreakdown) renderPendingDevelopmentBreakdown();
        refreshDevelopmentControls();
      }
    }

    function cancelPendingDevelopmentBreakdown() {
      if (!developmentBreakdownBusy || developmentBreakdownCancelRequested) return;
      developmentBreakdownCancelRequested = true;
      renderPendingDevelopmentBreakdown();
      setDevelopmentWarning(
        &#39;Cancelaci&#243;n solicitada. Se detendr&#225; el desglose conservando intacta la reducci&#243;n generada.&#39;
      );
    }

    function sortDevelopmentCombinations(combinations) {
      return combinations.slice().sort((first, second) =&gt; {
        for (let index = 0; index &lt; 6; index += 1) {
          if (first[index] !== second[index]) return first[index] - second[index];
        }
        return 0;
      });
    }

    function getActiveDevelopmentCombinations() {
      return developmentViewSelect.value === &#39;full&#39;
        ? developmentFullCombinations
        : developmentReducedCombinations;
    }

    function renderDevelopmentResults() {
      const combinations = getActiveDevelopmentCombinations();
      refreshScrutinySourceButtons();
      const pageTotal = Math.max(1, Math.ceil(combinations.length / DEVELOPMENT_PAGE_SIZE));
      developmentPageIndex = Math.min(Math.max(0, developmentPageIndex), pageTotal - 1);
      const start = developmentPageIndex * DEVELOPMENT_PAGE_SIZE;
      const pageCombinations = combinations.slice(start, start + DEVELOPMENT_PAGE_SIZE);
      developmentList.replaceChildren();

      pageCombinations.forEach((combination, pageIndex) =&gt; {
        const item = document.createElement(&#39;li&#39;);
        item.className = &#39;development-list-item&#39;;
        const indexLabel = document.createElement(&#39;span&#39;);
        indexLabel.className = &#39;development-list-index&#39;;
        indexLabel.textContent = String(start + pageIndex + 1).padStart(2, &#39;0&#39;);
        const numbersLabel = document.createElement(&#39;span&#39;);
        numbersLabel.className = &#39;development-list-numbers&#39;;
        numbersLabel.textContent = combination.map((number) =&gt; String(number).padStart(2, &#39;0&#39;)).join(&#39; &#183; &#39;);
        item.append(indexLabel, numbersLabel);
        developmentList.appendChild(item);
      });

      developmentResultCount.textContent = `${combinations.length.toLocaleString(&#39;es-ES&#39;)} ${combinations.length === 1 ? &#39;combinaci&#243;n&#39; : &#39;combinaciones&#39;}`;
      developmentPagination.hidden = pageTotal &lt;= 1;
      developmentPage.textContent = `${developmentPageIndex + 1} de ${pageTotal}`;
      developmentPreviousButton.disabled = developmentPageIndex === 0;
      developmentNextButton.disabled = developmentPageIndex === pageTotal - 1;
      developmentCopyButton.disabled = combinations.length === 0;
      developmentQrButton.disabled = combinations.length === 0;
      refreshFilterSourceButtons();
    }

    async function generateDevelopmentReduction() {
      if (developmentBusy) return;
      const externalSource = developmentExternalSource
        ? {
            key: developmentExternalSource.key,
            label: developmentExternalSource.label,
            combinations: developmentExternalSource.combinations.map(
              (combination) =&gt; combination.slice()
            ),
            numbers: developmentExternalSource.numbers.slice()
          }
        : null;
      const numbers = externalSource
        ? externalSource.numbers.slice()
        : developmentSelectedNumbers.slice();
      const fixedNumbers = externalSource
        ? []
        : developmentFixedNumbers
            .filter((number) =&gt; numbers.includes(number))
            .slice()
            .sort((first, second) =&gt; first - second);
      const mode = externalSource ? &#39;reduced&#39; : getDevelopmentMode();
      const guarantee = Number(developmentGuaranteeSelect.value);
      if (
        externalSource
        &amp;&amp; (externalSource.combinations.length &lt; 2 || numbers.length &lt; DEVELOPMENT_MIN_NUMBERS)
      ) {
        setDevelopmentMessage(
          &#39;El universo recibido necesita al menos 2 combinaciones distintas y 7 n&#250;meros naturales diferentes.&#39;,
          true
        );
        return;
      }
      if (!externalSource &amp;&amp; (numbers.length &lt; DEVELOPMENT_MIN_NUMBERS || numbers.length &gt; DEVELOPMENT_MAX_NUMBERS)) {
        setDevelopmentMessage(
          `Selecciona entre ${DEVELOPMENT_MIN_NUMBERS} y ${DEVELOPMENT_MAX_NUMBERS} n&#250;meros antes de generar.`,
          true
        );
        return;
      }
      if (fixedNumbers.length &gt; 5) {
        setDevelopmentMessage(&#39;Puedes utilizar como m&#225;ximo 5 n&#250;meros fijos.&#39;, true);
        return;
      }
      const feasibility = externalSource
        ? getExternalDevelopmentFeasibility(externalSource, guarantee)
        : getDevelopmentFeasibility(numbers.length, fixedNumbers.length, mode, guarantee);
      if (!feasibility.feasible) {
        setDevelopmentMessage(
          externalSource
            ? `Las ${feasibility.caseTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones recibidas superan el l&#237;mite seguro de ${feasibility.limit.toLocaleString(&#39;es-ES&#39;)} para esta garant&#237;a y dispositivo. Reduce o filtra primero la lista.`
            : `Los ${feasibility.caseTotal.toLocaleString(&#39;es-ES&#39;)} casos superan el l&#237;mite seguro de ${feasibility.limit.toLocaleString(&#39;es-ES&#39;)} para esta opci&#243;n. A&#241;ade fijos, selecciona menos n&#250;meros o cambia la garant&#237;a.`,
          true
        );
        return;
      }
      let filterConfiguration;
      try {
        filterConfiguration = readZoneFilterConfiguration(
          developmentFilterModeSelect,
          &#39;Desarrollos y reducciones&#39;
        );
      } catch (error) {
        setDevelopmentMessage(error.message, true);
        return;
      }
      const filtersApplied = Boolean(filterConfiguration);

      developmentBusy = true;
      developmentStopRequested = false;
      developmentRunCounter += 1;
      refreshDevelopmentControls();
      developmentOutput.hidden = true;
      const requestedPercentage = getDevelopmentRequestedPercentage();
      const percentageMode = getDevelopmentCoverageMode() === &#39;percentage&#39;;
      const method = developmentMethodSelect.value;
      const generalUniverseTotal = externalSource
        ? externalSource.combinations.length
        : exactCombinationCount(numbers.length, 6);
      const conditionedUniverseTotal = externalSource
        ? externalSource.combinations.length
        : exactCombinationCount(
            numbers.length - fixedNumbers.length,
            6 - fixedNumbers.length
          );
      setDevelopmentMessage(
        externalSource
          ? `Preparando las ${conditionedUniverseTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones recibidas desde &#171;${externalSource.label}&#187;${filtersApplied ? &#39; para aplicar adem&#225;s los filtros activos&#39; : &#39;&#39;}…`
          : fixedNumbers.length &gt; 0
          ? `Preparando ${conditionedUniverseTotal.toLocaleString(&#39;es-ES&#39;)} casos condicionados y ${generalUniverseTotal.toLocaleString(&#39;es-ES&#39;)} casos generales${filtersApplied ? &#39; para aplicar los filtros activos&#39; : &#39;&#39;}…`
          : `Preparando ${generalUniverseTotal.toLocaleString(&#39;es-ES&#39;)} combinaciones posibles${filtersApplied ? &#39; para aplicar los filtros activos&#39; : &#39;&#39;}…`
      );

      try {
        let conditionedEntries = externalSource
          ? externalSource.combinations.map((combination) =&gt;
              createDevelopmentEntryFromCombination(numbers, combination)
            )
          : createSixNumberEntries(numbers, fixedNumbers);
        const unfilteredConditionedTotal = conditionedEntries.length;
        if (filterConfiguration) {
          conditionedEntries = conditionedEntries.filter((entry) =&gt;
            combinationPassesActiveFilters(entry.combination, filterConfiguration)
          );
          if (conditionedEntries.length === 0) {
            throw new Error(
              &#39;ninguna combinaci&#243;n del sistema elegido cumple todos los filtros activos&#39;
            );
          }
        }
        let allEntries = fixedNumbers.length === 0 ? conditionedEntries : null;
        const candidateEntries = conditionedEntries;
        await wait(0);
        if (mode === &#39;full&#39;) {
          developmentReducedCombinations = [];
          developmentFullCombinations = candidateEntries.map((entry) =&gt; entry.combination);
          developmentBreakdown.hidden = true;
          developmentBreakdownBody.replaceChildren();
          developmentBreakdownData = { conditioned: [], general: [] };
          developmentGeneratedFixedNumbers = fixedNumbers.slice();
          createDevelopmentViewOptions(&#39;full&#39;);
          developmentPageIndex = 0;
          developmentResultTitle.textContent = &#39;Desarrollo completo&#39;;
          developmentNotation.textContent = fixedNumbers.length &gt; 0
            ? `C(${numbers.length - fixedNumbers.length},${6 - fixedNumbers.length})=${developmentFullCombinations.length.toLocaleString(&#39;es-ES&#39;)} &#183; ${fixedNumbers.length} fijos: ${fixedNumbers.map((number) =&gt; String(number).padStart(2, &#39;0&#39;)).join(&#39;, &#39;)}${filtersApplied ? &#39; &#183; filtros activos&#39; : &#39;&#39;}`
            : `C(${numbers.length},6)=${developmentFullCombinations.length.toLocaleString(&#39;es-ES&#39;)} combinaciones${filtersApplied ? &#39; &#183; filtros activos&#39; : &#39;&#39;}`;
          developmentVerification.textContent = fixedNumbers.length &gt; 0
            ? `Todas las combinaciones contienen los fijos${filtersApplied ? &#39; y cumplen los filtros activos&#39; : &#39;&#39;}`
            : `Todas las combinaciones sin repetir${filtersApplied ? &#39; que cumplen los filtros activos&#39; : &#39;&#39;}`;
          developmentOutput.hidden = false;
          renderDevelopmentResults();
          setDevelopmentMessage(
            `Desarrollo completo generado con ${developmentFullCombinations.length.toLocaleString(&#39;es-ES&#39;)} combinaciones${filtersApplied ? ` de ${unfilteredConditionedTotal.toLocaleString(&#39;es-ES&#39;)} posibles tras exigir los filtros activos` : &#39;&#39;}. Se muestran por p&#225;ginas de ${DEVELOPMENT_PAGE_SIZE}.`
          );
          summary.textContent = `Desarrollo completo de ${numbers.length} n&#250;meros generado con ${developmentFullCombinations.length} combinaciones${fixedNumbers.length &gt; 0 ? ` y ${fixedNumbers.length} fijos` : &#39;&#39;}${filtersApplied ? &#39;, condicionado por los filtros activos&#39; : &#39;&#39;}.`;
          return;
        }

        const targetCount = percentageMode
          ? Math.ceil(conditionedEntries.length * requestedPercentage / 100 - 1e-10)
          : conditionedEntries.length;
        const seed = numbers.reduce(
          (value, number, index) =&gt; (Math.imul(value ^ (number + index * 97), 2654435761)) &gt;&gt;&gt; 0,
          (
            Date.now() ^
            developmentRunCounter ^
            guarantee * 1009 ^
            fixedNumbers.length * 811 ^
            Math.round(requestedPercentage * 1000)
          ) &gt;&gt;&gt; 0
        );
        const random = createSeededRandom(seed);
        let selectedIndices;
        let cycleTotal = 0;
        let hybridAttemptTotal = 0;
        let hybridStagnantTotal = 0;
        let verification;
        const useDenseCoverage =
          conditionedEntries.length &lt;= DEVELOPMENT_DENSE_CASE_LIMIT &amp;&amp;
          numbers.length &lt;= 30;
        if (useDenseCoverage) {
          const coverage = await buildDevelopmentCoverage(candidateEntries, conditionedEntries, guarantee);
          if (method === &#39;cycles&#39;) {
            const cycleResult = await createCycleReduction(
              candidateEntries,
              coverage,
              random,
              conditionedEntries.length,
              targetCount
            );
            selectedIndices = cycleResult.ticketIndices;
            cycleTotal = cycleResult.cycleTotal;
          } else if (method === &#39;hybrid&#39;) {
            const hybridResult = await createHybridReduction(
              candidateEntries,
              coverage,
              random,
              conditionedEntries.length,
              targetCount
            );
            selectedIndices = hybridResult.ticketIndices;
            hybridAttemptTotal = hybridResult.completedCycles;
            hybridStagnantTotal = hybridResult.stagnantCycles;
          } else {
            selectedIndices = await createRandomReduction(
              coverage,
              random,
              conditionedEntries.length,
              targetCount
            );
          }
          verification = verifyDevelopmentReduction(
            selectedIndices,
            coverage,
            conditionedEntries.length,
            targetCount
          );
        } else {
          setDevelopmentMessage(
            `C&#225;lculo avanzado sobre ${conditionedEntries.length.toLocaleString(&#39;es-ES&#39;)} casos. En m&#243;viles puede tardar y afectar temporalmente al rendimiento…`
          );
          if (method === &#39;hybrid&#39;) {
            const hybridResult = await createSparseHybridReduction(
              candidateEntries,
              conditionedEntries,
              guarantee,
              random,
              targetCount
            );
            selectedIndices = hybridResult.ticketIndices;
            hybridAttemptTotal = hybridResult.completedCycles;
            hybridStagnantTotal = hybridResult.stagnantCycles;
            verification = {
              valid: hybridResult.coveredTotal &gt;= targetCount,
              coveredTotal: hybridResult.coveredTotal,
              coveragePercentage: hybridResult.coveredTotal / conditionedEntries.length * 100
            };
          } else {
            const sparseResult = await createSparseRandomReduction(
              candidateEntries,
              conditionedEntries,
              guarantee,
              random,
              targetCount
            );
            selectedIndices = sparseResult.ticketIndices;
            verification = {
              valid: sparseResult.coveredTotal &gt;= targetCount,
              coveredTotal: sparseResult.coveredTotal,
              coveragePercentage: sparseResult.coveredTotal / conditionedEntries.length * 100
            };
          }
        }

        if (!verification.valid) {
          throw new Error(&#39;La comprobaci&#243;n final no ha alcanzado la cobertura solicitada.&#39;);
        }
        const selectedTicketEntries = selectedIndices.map((index) =&gt; candidateEntries[index]);
        const conditionedComparisonTotal = conditionedEntries.length * selectedTicketEntries.length;
        let conditionedBreakdown = [];
        let generalBreakdown = [];
        if (conditionedComparisonTotal &lt;= DEVELOPMENT_BREAKDOWN_COMPARISON_LIMIT) {
          setDevelopmentMessage(&#39;Calculando el desglose por categor&#237;as de aciertos…&#39;);
          conditionedBreakdown = await calculateDevelopmentPrizeBreakdown(
            conditionedEntries,
            selectedTicketEntries
          );
          if (fixedNumbers.length === 0) {
            generalBreakdown = conditionedBreakdown;
          } else if (
            generalUniverseTotal * selectedTicketEntries.length &lt;=
            DEVELOPMENT_BREAKDOWN_COMPARISON_LIMIT
          ) {
            allEntries = createSixNumberEntries(numbers);
            if (filterConfiguration) {
              allEntries = allEntries.filter((entry) =&gt;
                combinationPassesActiveFilters(entry.combination, filterConfiguration)
              );
            }
            generalBreakdown = await calculateDevelopmentPrizeBreakdown(
              allEntries,
              selectedTicketEntries
            );
          }
        }
        developmentBreakdownData = {
          conditioned: conditionedBreakdown,
          general: generalBreakdown
        };
        developmentPendingBreakdown = conditionedBreakdown.length === 0
          ? {
              numbers: numbers.slice(),
              fixedNumbers: fixedNumbers.slice(),
              combinations: selectedTicketEntries.map((entry) =&gt; entry.combination.slice()),
              universeCombinations: externalSource
                ? conditionedEntries.map((entry) =&gt; entry.combination.slice())
                : null,
              universeAlreadyFiltered: Boolean(externalSource),
              caseTotal: conditionedEntries.length,
              ticketTotal: selectedTicketEntries.length,
              comparisonTotal: conditionedComparisonTotal,
              filterConfiguration
            }
          : null;
        developmentGeneratedFixedNumbers = fixedNumbers.slice();
        developmentGeneratedExternalSourceLabel = externalSource?.label ?? &#39;&#39;;
        developmentBreakdownViewSelect.value = &#39;conditioned&#39;;
        if (conditionedBreakdown.length &gt; 0) renderSelectedDevelopmentPrizeBreakdown();

        developmentReducedCombinations = sortDevelopmentCombinations(
          selectedTicketEntries.map((entry) =&gt; entry.combination)
        );
        developmentFullCombinations = [];
        developmentBreakdown.hidden = false;
        createDevelopmentViewOptions(&#39;reduced&#39;);
        developmentPageIndex = 0;
        developmentResultTitle.textContent = &#39;Resultado de la reducci&#243;n&#39;;
        const methodLabel = method === &#39;cycles&#39;
          ? `solo por ciclos &#183; ${cycleTotal} ${cycleTotal === 1 ? &#39;ciclo&#39; : &#39;ciclos&#39;}`
          : method === &#39;hybrid&#39;
            ? `ciclos + aleatorio &#183; ${hybridAttemptTotal} pasadas`
            : &#39;aleatorio &#183; un intento&#39;;
        const fixedNotation = fixedNumbers.length &gt; 0
          ? ` &#183; F=${fixedNumbers.length} (${fixedNumbers.map((number) =&gt; String(number).padStart(2, &#39;0&#39;)).join(&#39;, &#39;)})`
          : &#39;&#39;;
        const coverageNotation = percentageMode
          ? ` &#183; objetivo ${formatDevelopmentPercentage(requestedPercentage)} &#183; real ${formatDevelopmentPercentage(verification.coveragePercentage)}`
          : &#39; &#183; cobertura 100 %&#39;;
        developmentNotation.textContent = externalSource
          ? `U(${conditionedEntries.length.toLocaleString(&#39;es-ES&#39;)},T=${guarantee},M=6,L=1)=${developmentReducedCombinations.length}${coverageNotation} &#183; m&#233;todo ${methodLabel} &#183; origen ${externalSource.label}${filtersApplied ? &#39; &#183; filtros activos&#39; : &#39;&#39;}`
          : `C(${numbers.length},6,${guarantee},6,1)=${developmentReducedCombinations.length}${fixedNotation}${coverageNotation} &#183; m&#233;todo ${methodLabel}${filtersApplied ? &#39; &#183; filtros activos&#39; : &#39;&#39;}`;
        developmentVerification.textContent = externalSource
          ? `${verification.coveredTotal.toLocaleString(&#39;es-ES&#39;)} de ${conditionedEntries.length.toLocaleString(&#39;es-ES&#39;)} combinaciones del universo recibido cubiertas${filtersApplied ? &#39; &#183; garant&#237;a condicionada adem&#225;s a los filtros activos&#39; : &#39;&#39;}`
          : `${verification.coveredTotal.toLocaleString(&#39;es-ES&#39;)} de ${conditionedEntries.length.toLocaleString(&#39;es-ES&#39;)} casos ${fixedNumbers.length &gt; 0 ? &#39;condicionados &#39; : &#39;&#39;}cubiertos${filtersApplied ? &#39; &#183; garant&#237;a condicionada a los filtros activos&#39; : &#39;&#39;}`;
        developmentOutput.hidden = false;
        renderDevelopmentResults();
        if (developmentPendingBreakdown) renderPendingDevelopmentBreakdown();

        const searchText = method === &#39;hybrid&#39;
          ? ` El usuario ha detenido la b&#250;squeda despu&#233;s de ${hybridAttemptTotal} pasadas completas; en ese momento llevaba ${hybridStagnantTotal} ${hybridStagnantTotal === 1 ? &#39;ciclo seguido sin reducir B&#39; : &#39;ciclos seguidos sin reducir B&#39;}.`
          : &#39;&#39;;
        const breakdownText = conditionedBreakdown.length === 0
          ? &#39; El desglose detallado queda pendiente por el tama&#241;o del c&#225;lculo; puedes solicitarlo voluntariamente desde el aviso mostrado bajo la reducci&#243;n. La cobertura indicada s&#237; ha sido comprobada.&#39;
          : &#39;&#39;;
        setDevelopmentMessage(
          externalSource
            ? `Reducci&#243;n del universo &#171;${externalSource.label}&#187; comprobada: cobertura real ${formatDevelopmentPercentage(verification.coveragePercentage)} para ${guarantee} aciertos cuando la combinaci&#243;n ganadora pertenece a las ${conditionedEntries.length.toLocaleString(&#39;es-ES&#39;)} combinaciones recibidas${filtersApplied ? &#39; y cumple tambi&#233;n los filtros activos&#39; : &#39;&#39;}.${searchText}${breakdownText} El resultado conserva las condiciones de su zona de origen y es el mejor encontrado, no una prueba de m&#237;nimo absoluto.`
            : fixedNumbers.length &gt; 0
            ? `Reducci&#243;n condicionada comprobada: cobertura real ${formatDevelopmentPercentage(verification.coveragePercentage)} para ${guarantee} aciertos si los ${fixedNumbers.length} fijos est&#225;n entre los 6 ganadores${filtersApplied ? &#39; y el caso ganador cumple los filtros activos&#39; : &#39;&#39;}.${searchText}${breakdownText} El resultado es el mejor encontrado, no una prueba de m&#237;nimo absoluto.`
            : `Reducci&#243;n comprobada con cobertura real ${formatDevelopmentPercentage(verification.coveragePercentage)} para ${guarantee} aciertos si los 6 ganadores est&#225;n entre los ${numbers.length} elegidos${filtersApplied ? &#39; y cumplen los filtros activos&#39; : &#39;&#39;}.${searchText}${breakdownText} El resultado es el mejor encontrado, no una prueba de m&#237;nimo absoluto.`
        );
        summary.textContent = externalSource
          ? `Reducci&#243;n de ${externalSource.label} comprobada con ${developmentReducedCombinations.length} combinaciones y ${formatDevelopmentPercentage(verification.coveragePercentage)} de cobertura condicionada al universo recibido${filtersApplied ? &#39; y a los filtros activos&#39; : &#39;&#39;}.`
          : `Reducci&#243;n C(${numbers.length},6,${guarantee},6,1) comprobada con ${developmentReducedCombinations.length} combinaciones y ${formatDevelopmentPercentage(verification.coveragePercentage)} de cobertura${fixedNumbers.length &gt; 0 || filtersApplied ? &#39; condicionada&#39; : &#39;&#39;}${filtersApplied ? &#39; a los filtros activos&#39; : &#39;&#39;}.`;
      } catch (error) {
        developmentReducedCombinations = [];
        developmentFullCombinations = [];
        developmentBreakdownData = { conditioned: [], general: [] };
        developmentPendingBreakdown = null;
        developmentGeneratedFixedNumbers = [];
        developmentGeneratedExternalSourceLabel = &#39;&#39;;
        developmentBreakdownBody.replaceChildren();
        developmentOutput.hidden = true;
        setDevelopmentMessage(`No se ha podido generar la reducci&#243;n: ${error.message}`, true);
      } finally {
        developmentBusy = false;
        developmentStopRequested = false;
        refreshDevelopmentControls();
      }
    }

    function stopDevelopmentCycles() {
      if (!developmentBusy || developmentMethodSelect.value !== &#39;hybrid&#39; || developmentStopRequested) return;
      developmentStopRequested = true;
      refreshDevelopmentControls();
      setDevelopmentMessage(&#39;Detenci&#243;n solicitada. Se terminar&#225; el ciclo actual y se conservar&#225; la mejor reducci&#243;n encontrada.&#39;);
    }

    async function copyDevelopmentResult() {
      const combinations = getActiveDevelopmentCombinations();
      if (combinations.length === 0) {
        setDevelopmentMessage(&#39;Genera primero una reducci&#243;n o un desarrollo completo.&#39;, true);
        return;
      }
      const result = await copyTextToClipboard(combinationsToClipboardText(combinations));
      if (result.copied) {
        setDevelopmentMessage(`${combinations.length.toLocaleString(&#39;es-ES&#39;)} combinaciones copiadas al portapapeles, una por l&#237;nea.`);
      } else if (result.manual) {
        setDevelopmentMessage(&#39;El navegador ha mostrado las combinaciones para copiarlas manualmente.&#39;);
      } else {
        setDevelopmentMessage(&#39;No se han podido copiar las combinaciones.&#39;, true);
      }
    }

    function generateDevelopmentQr() {
      const combinations = getActiveDevelopmentCombinations();
      if (combinations.length === 0) {
        setDevelopmentMessage(&#39;Genera primero una reducci&#243;n o un desarrollo completo.&#39;, true);
        return;
      }
      prepareQrGeneration(combinations, &#39;development&#39;);
    }

    function setScrutinyMessage(message, isError = false) {
      scrutinyMessage.textContent = message;
      scrutinyMessage.classList.toggle(&#39;is-error&#39;, isError);
    }

    function parseScrutinyWinningCombination() {
      const values = (scrutinyWinningInput.value.match(/\d+/g) || []).map(Number);
      if (values.length !== 6 || values.some((number) =&gt; number &lt; 1 || number &gt; 49) || new Set(values).size !== 6) {
        return null;
      }
      return values.sort((first, second) =&gt; first - second);
    }

    function consecutiveRuns(numbers) {
      const runs = [];
      let current = [numbers[0]];
      for (let index = 1; index &lt; numbers.length; index += 1) {
        if (numbers[index] === numbers[index - 1] + 1) {
          current.push(numbers[index]);
        } else {
          if (current.length &gt; 1) runs.push(current);
          current = [numbers[index]];
        }
      }
      if (current.length &gt; 1) runs.push(current);
      return runs;
    }

    function createScrutinyAnalysisItem(label, value) {
      const item = document.createElement(&#39;div&#39;);
      item.className = &#39;scrutiny-analysis-item&#39;;
      const name = document.createElement(&#39;span&#39;);
      name.textContent = label;
      const result = document.createElement(&#39;strong&#39;);
      result.textContent = value;
      item.append(name, result);
      return item;
    }

    function createScrutinySplitFigureItem(label, values, counts) {
      const item = document.createElement(&#39;div&#39;);
      item.className = &#39;scrutiny-analysis-item&#39;;
      const name = document.createElement(&#39;span&#39;);
      name.textContent = label;
      const figure = document.createElement(&#39;div&#39;);
      figure.className = &#39;scrutiny-actor-figure&#39;;
      figure.style.setProperty(&#39;--actor-count&#39;, String(values.length));
      figure.setAttribute(&#39;aria-label&#39;, `${label}: ${actorFigure(counts)}`);

    function classifyScrutinyCombination(combination, winning, complement, refund, playedRefund) {

        prizeTone = &#39;5&#39;;
      } else if (hits === 4) {

        prizeTone = &#39;4&#39;;
      } else if (hits === 3) {

        prizeTone = &#39;3&#39;;

        complementHit,
        refundHit,
        refundChecked,
        category,

    function secureRandomIndex(maximum) {
      const range = 0x100000000;
      const ceiling = Math.floor(range / maximum) * maximum;
      const value = new Uint32Array(1);
      do {
        crypto.getRandomValues(value);
      } while (value[0] &gt;= ceiling);
      return value[0] % maximum;
    }

    function ballPosition(index) {
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const radius = Math.sqrt((index + 0.7) / 49) * 43;
      const angle = index * goldenAngle - Math.PI / 2;
      return {
        left: 50 + Math.cos(angle) * radius,
        top: 50 + Math.sin(angle) * radius
      };
    }

    function createDrumBalls() {
      ballsContainer.replaceChildren();
      for (let number = 1; number &lt;= 49; number += 1) {
        const ball = document.createElement(&#39;span&#39;);
        const position = ballPosition(number - 1);
        ball.className = &#39;lottery-ball&#39;;
        ball.dataset.number = String(number);
        ball.textContent = String(number);
        ball.setAttribute(&#39;aria-hidden&#39;, &#39;true&#39;);
        ball.style.left = `${position.left}%`;
        ball.style.top = `${position.top}%`;
        ball.style.setProperty(&#39;--delay&#39;, `${(number % 7) * -22}ms`);
        ball.style.setProperty(&#39;--move-x&#39;, `${((number * 7) % 19) - 9}px`);
        ball.style.setProperty(&#39;--move-y&#39;, `${((number * 11) % 17) - 8}px`);
        ballsContainer.appendChild(ball);
      }
    }

    function relocateBalls() {
      const ballElements = Array.from(ballsContainer.children);
      if (ballElements.length &lt; 2) return;

      const targetPositions = ballElements.map((ball) =&gt; ({
        left: ball.style.left,
        top: ball.style.top
      }));

      for (let index = targetPositions.length - 1; index &gt; 0; index -= 1) {
        const swapIndex = secureRandomIndex(index);
        [targetPositions[index], targetPositions[swapIndex]] = [targetPositions[swapIndex], targetPositions[index]];
      }

      ballElements.forEach((ball, index) =&gt; {
        ball.style.left = targetPositions[index].left;
        ball.style.top = targetPositions[index].top;
        ball.style.setProperty(&#39;--move-x&#39;, `${secureRandomIndex(29) - 14}px`);
        ball.style.setProperty(&#39;--move-y&#39;, `${secureRandomIndex(27) - 13}px`);
        ball.style.setProperty(&#39;--delay&#39;, `${secureRandomIndex(145) * -1}ms`);
      });
    }

    function refreshResults() {
      const orderSlots = Array.from(drawOrder.children);
      orderSlots.forEach((slot, index) =&gt; {
        const number = drawn[index];
        slot.querySelector(&#39;strong&#39;).textContent = number ?? &#39;—&#39;;
        slot.classList.toggle(&#39;has-ball&#39;, number !== undefined);
      });

      const sorted = [...drawn].sort((a, b) =&gt; a - b);
      Array.from(winning.children).forEach((slot, index) =&gt; {
        const number = sorted[index];
        slot.textContent = number ?? &#39;—&#39;;
        slot.classList.toggle(&#39;has-ball&#39;, number !== undefined);
      });
      winning.classList.remove(&#39;is-updating&#39;);
      void winning.offsetWidth;
      if (sorted.length &gt; 0) winning.classList.add(&#39;is-updating&#39;);

      remainingLabel.textContent = `${remaining.length} ${remaining.length === 1 ? &#39;bola&#39; : &#39;bolas&#39;}`;

    async function drawBall() {
      if (busy || drawn.length &gt;= 6) return;

      busy = true;
      drawButton.disabled = true;
      resetButton.disabled = true;
      drawButton.textContent = &#39;Bombo girando…&#39;;
      status.textContent = &#39;El bombo est&#225; girando y mezclando las bolas…&#39;;
      drum.classList.add(&#39;is-mixing&#39;);
      await wait(reducedMotion ? 10 : 40);
      relocateBalls();
      await wait(reducedMotion ? 110 : 1280);

      const selectedIndex = secureRandomIndex(remaining.length);
      const selectedNumber = remaining.splice(selectedIndex, 1)[0];
      const selectedBall = ballsContainer.querySelector(`[data-number=&quot;${selectedNumber}&quot;]`);
      drum.classList.remove(&#39;is-mixing&#39;);
      winning.classList.remove(&#39;is-updating&#39;);
      selectedBall.classList.add(&#39;is-extracted&#39;);
      await wait(430);
      selectedBall.remove();

      drawn.push(selectedNumber);
      busy = false;
      refreshResults();

      if (drawn.length === 6) {
        const combination = [...drawn].sort((a, b) =&gt; a - b).join(&#39;, &#39;);
        status.textContent = `Sorteo completado &#183; ${combination}`;
        summary.textContent = `Sorteo completado. La combinaci&#243;n extra&#237;da ordenada es ${combination}. Ning&#250;n n&#250;mero se ha repetido.`;
      } else {
        status.textContent = `Ha salido el ${selectedNumber}. Quedan ${6 - drawn.length} extracciones.`;
        summary.textContent = `Bola extra&#237;da: ${selectedNumber}. ${remaining.length} bolas contin&#250;an en el bombo.`;
      }
    }

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {

  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };

      .then(({ x, y }) =&gt; {

        }

<script>
(() => {
  const frame = document.querySelector('#loto-suite-frame');
  if (!frame) return;

  const minimumZoom = 50;
  const maximumZoom = 200;
  const zoomStorageKey = 'qr-loto-suite.interface-zoom.v1';
  const themeStorageKey = 'qr-loto-suite.theme.v1';
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  let installPrompt = null;
  let installAvailable = !standalone;
  let zoom = 100;
  let theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  try {
    const stored = Number(window.localStorage.getItem(zoomStorageKey));
    if (Number.isInteger(stored) && stored >= minimumZoom && stored <= maximumZoom) {
      zoom = stored;
    }
    const storedTheme = window.localStorage.getItem(themeStorageKey);
    if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme;
  } catch (_) {
    // Los ajustes continúan disponibles durante esta sesión.
  }

  function sendUiState() {
    frame.contentWindow?.postMessage({
      type: 'qr-loto-suite-ui-state',
      zoom,
      theme,
      installVisible: installAvailable
    }, '*');
  }

  function applyZoom() {
    const scale = zoom / 100;
    const inverseScale = 100 / scale;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.width = `${inverseScale}%`;
    document.body.style.height = `${inverseScale}dvh`;
    document.body.style.transform = scale === 1 ? '' : `scale(${scale})`;
    document.documentElement.dataset.interfaceZoom = String(zoom);
    sendUiState();
  }

  function setZoom(nextZoom) {
    const rawZoom = String(nextZoom).trim();
    const numericZoom = rawZoom ? Math.round(Number(rawZoom)) : Number.NaN;
    if (!Number.isFinite(numericZoom)) {
      sendUiState();
      return;
    }
    zoom = Math.min(maximumZoom, Math.max(minimumZoom, numericZoom));
    try {
      window.localStorage.setItem(zoomStorageKey, String(zoom));
    } catch (_) {
      // El ajuste se mantiene durante la sesión si no puede guardarse.
    }
    applyZoom();
  }

  function applyTheme(nextTheme) {
    theme = nextTheme === 'light' ? 'light' : 'dark';

    const themeColor = document.querySelector('meta[name="theme-color"]');
    themeColor?.setAttribute('content', theme === 'light' ? '#f7f9fc' : '#061127');
    try {
      frame.contentDocument?.documentElement?.setAttribute('data-theme', theme);
    } catch (_) {

    }

    if (installPrompt) {

      await installPrompt.userChoice;
      installPrompt = null;
      return;
    }
    const isiPhoneOrIPad = /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.alert(isiPhoneOrIPad
      ? 'En Safari pulsa Compartir y después «Añadir a pantalla de inicio».'
      : 'Abre el menú del navegador y elige «Instalar aplicación» o «Añadir a pantalla de inicio». Si la opción aún no aparece, recarga la página una vez.');
  }

  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    sendUiState();
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installAvailable = false;
    sendUiState();
  });
  window.addEventListener('message', (event) => {
    if (event.source !== frame.contentWindow || !event.data) return;
    const { type, value } = event.data;
    if (type === 'qr-loto-suite-ui-ready') sendUiState();
    if (type === 'qr-loto-suite-zoom-step') setZoom(zoom + Number(value || 0));
    if (type === 'qr-loto-suite-zoom-set') setZoom(value);
    if (type === 'qr-loto-suite-theme-toggle') {
      const nextTheme = theme === 'light' ? 'dark' : 'light';
      try { window.localStorage.setItem(themeStorageKey, nextTheme); } catch (_) {}
      applyTheme(nextTheme);
    }
    if (type === 'qr-loto-suite-install') requestInstall();
  });

  frame.addEventListener('load', () => {
    applyTheme(theme);
    applyZoom();
  });
  applyTheme(theme);
  applyZoom();
})();
</script>
