<script>
(() => {
  if (!/^https?:$/.test(window.location.protocol)) return;

  const storageKey = 'qr-loto-suite-refresh-token';
  const queryKey = 'actualizacion';

  try {
    const currentUrl = new URL(window.location.href);
    const activeToken = window.sessionStorage.getItem(storageKey);

    if (activeToken && currentUrl.searchParams.get(queryKey) === activeToken) {
      currentUrl.searchParams.delete(queryKey);
      const cleanQuery = currentUrl.searchParams.toString();
      window.history.replaceState(
        null,
        '',
        `${currentUrl.pathname}${cleanQuery ? `?${cleanQuery}` : ''}${currentUrl.hash}`
      );
      return;
    }

    const freshToken = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    window.sessionStorage.setItem(storageKey, freshToken);
    currentUrl.searchParams.set(queryKey, freshToken);
    window.location.replace(currentUrl.toString());
  } catch (_) {
    // La aplicación continúa con normalidad si el navegador bloquea sessionStorage.
  }
})();
</script>

<script>
(() => {
  const splash = document.querySelector('#loto-suite-splash');
  const skip = document.querySelector('#loto-suite-splash-skip');
  if (!splash) return;
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    splash.classList.add('is-hidden');
    window.setTimeout(() => splash.remove(), 500);
  };
  skip?.addEventListener('click', close);
  window.setTimeout(close, 3600);
})();
</script>

<script>
(() => {
  const installButton = document.querySelector('#loto-suite-install');
  if (!installButton) return;
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (standalone) return;

  let installPrompt = null;
  installButton.hidden = false;
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    installButton.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installButton.hidden = true;
  });
  installButton.addEventListener('click', async () => {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      return;
    }
    const isiPhoneOrIPad = /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.alert(
      isiPhoneOrIPad
        ? 'En Safari pulsa Compartir y después «Añadir a pantalla de inicio».'
        : 'Abre el menú del navegador y elige «Instalar aplicación» o «Añadir a pantalla de inicio». Si la opción aún no aparece, recarga la página una vez.'
    );
  });
})();
</script>

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {

    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

<script>
(() => {
  const frame = document.querySelector('#loto-suite-frame');
  const zoomOutButton = document.querySelector('#loto-suite-zoom-out');
  const zoomInput = document.querySelector('#loto-suite-zoom-value');
  const zoomInButton = document.querySelector('#loto-suite-zoom-in');
  if (!frame || !zoomOutButton || !zoomInput || !zoomInButton) return;

  const minimumZoom = 50;
  const maximumZoom = 200;
  const buttonStep = 5;
  const storageKey = 'qr-loto-suite.interface-zoom.v1';
  let zoom = 100;
  try {
    const stored = Number(window.localStorage.getItem(storageKey));
    if (Number.isInteger(stored) && stored >= minimumZoom && stored <= maximumZoom) {
      zoom = stored;
    }
  } catch (_) {
    // El zoom continúa disponible aunque el navegador no permita guardarlo.
  }

  function updateButtons() {
    zoomInput.value = String(zoom);
    zoomInput.setAttribute('aria-label', `Zoom actual ${zoom} por ciento. Escribe un valor entre ${minimumZoom} y ${maximumZoom}`);
    zoomOutButton.disabled = zoom <= minimumZoom;
    zoomInButton.disabled = zoom >= maximumZoom;
  }

  function applyZoom() {
    updateButtons();
    const scale = zoom / 100;
    const inverseScale = 100 / scale;

    // Amplía el lienzo disponible y escala la aplicación completa.
    // Así cabecera, contorno e interfaz se comportan como con el zoom del navegador.
    document.documentElement.style.overflow = 'hidden';
    document.body.style.width = `${inverseScale}%`;
    document.body.style.height = `${inverseScale}dvh`;
    document.body.style.transform = scale === 1 ? '' : `scale(${scale})`;
    document.documentElement.dataset.interfaceZoom = String(zoom);
  }

  function setZoom(nextZoom) {
    const rawZoom = String(nextZoom).trim();
    const numericZoom = rawZoom ? Math.round(Number(rawZoom)) : Number.NaN;
    if (!Number.isFinite(numericZoom)) {
      updateButtons();
      return;
    }
    zoom = Math.min(maximumZoom, Math.max(minimumZoom, numericZoom));
    try {
      window.localStorage.setItem(storageKey, String(zoom));
    } catch (_) {
      // El ajuste se mantiene durante la sesión si no puede guardarse.
    }
    applyZoom();
  }

  zoomOutButton.addEventListener('click', () => {
    setZoom(zoom - buttonStep);
  });
  zoomInButton.addEventListener('click', () => {
    setZoom(zoom + buttonStep);
  });
  zoomInput.addEventListener('change', () => setZoom(zoomInput.value));
  zoomInput.addEventListener('blur', () => setZoom(zoomInput.value));
  zoomInput.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    setZoom(zoomInput.value);
    zoomInput.blur();
  });
  frame.addEventListener('load', applyZoom);
  applyZoom();
})();
</script>
<script>
(() => {
  const frame = document.querySelector('#loto-suite-frame');
  const themeButton = document.querySelector('#loto-suite-theme');
  if (!frame || !themeButton) return;

  const storageKey = 'qr-loto-suite.theme.v1';
  const systemTheme = () => window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  let theme = systemTheme();
  try {
    const stored = window.localStorage.getItem(storageKey);
    if (stored === 'light' || stored === 'dark') theme = stored;
  } catch (_) {
    // Se mantiene el tema del sistema si el navegador no permite guardar la opción.
  }

  function applyTheme(nextTheme) {
    theme = nextTheme === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    const themeColor = document.querySelector('meta[name="theme-color"]');
    themeColor?.setAttribute('content', theme === 'light' ? '#f7f9fc' : '#061127');
    themeButton.textContent = theme === 'light' ? '☾' : '☀︎';
    themeButton.setAttribute(
      'aria-label',
      theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro'
    );
    themeButton.title = theme === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
    try {
      frame.contentDocument?.documentElement?.setAttribute('data-theme', theme);
    } catch (_) {
      // El evento load volverá a aplicar el tema cuando el iframe esté disponible.
    }
  }

  applyTheme(theme);
  frame.addEventListener('load', () => applyTheme(theme));
  themeButton.addEventListener('click', () => {
    const nextTheme = theme === 'light' ? 'dark' : 'light';
    try {
      window.localStorage.setItem(storageKey, nextTheme);
    } catch (_) {
      // El cambio sigue activo durante esta sesión.
    }
    applyTheme(nextTheme);
  });
})();
</script>
