<script>
(() => {
  if (!/^https?:$/.test(window.location.protocol)) return;

  const storageKey = 'qr-loto-suite-refresh-token';
  const queryKey = 'actualizacion';

  try {
    const currentUrl = new URL(window.location.href);
    const activeToken = window.sessionStorage.getItem(storageKey);

    if (activeToken && currentUrl.searchParams.get(queryKey) === activeToken) {
      currentUrl.searchParams.delete(queryKey);
      const cleanQuery = currentUrl.searchParams.toString();
      window.history.replaceState(
        null,
        '',
        `${currentUrl.pathname}${cleanQuery ? `?${cleanQuery}` : ''}${currentUrl.hash}`
      );
      return;
    }

    const freshToken = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    window.sessionStorage.setItem(storageKey, freshToken);
    currentUrl.searchParams.set(queryKey, freshToken);
    window.location.replace(currentUrl.toString());
  } catch (_) {
    // La aplicación continúa con normalidad si el navegador bloquea sessionStorage.
  }
})();
</script>

<script>
(() => {
  const installButton = document.querySelector('#loto-suite-install');
  if (!installButton) return;
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (standalone) return;

  let installPrompt = null;
  installButton.hidden = false;
  window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    installPrompt = event;
    installButton.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installButton.hidden = true;
  });
  installButton.addEventListener('click', async () => {
    if (installPrompt) {
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      return;
    }
    const isiPhoneOrIPad = /iphone|ipad|ipod/i.test(navigator.userAgent);
    window.alert(
      isiPhoneOrIPad
        ? 'En Safari pulsa Compartir y después «Añadir a pantalla de inicio».'
        : 'Abre el menú del navegador y elige «Instalar aplicación» o «Añadir a pantalla de inicio». Si la opción aún no aparece, recarga la página una vez.'
    );
  });
})();
</script>

        for (let index = shuffled.length - 1; index &gt; 0; index -= 1) {

          [shuffled[index], shuffled[other]] = [shuffled[other], shuffled[index]];
        }
        return new Set(shuffled.slice(0, requested));

    function countDigitalPatternEquivalents(pattern) {
      let ways = Array(pattern[0] &lt;= 4 ? 6 : 5).fill(1);
      for (let position = 1; position &lt; 6; position += 1) {
        const nextLength = pattern[position] &lt;= 4 ? 6 : 5;
        const strictLayerIncrease = pattern[position - 1] &gt;= pattern[position] ? 1 : 0;
        const prefixes = [];
        let total = 0;
        ways.forEach((value) =&gt; {
          total += value;
          prefixes.push(total);
        });
        ways = Array.from({ length: nextLength }, (_, layer) =&gt; {
          const limit = layer - strictLayerIncrease;
          if (limit &lt; 0) return 0;
          return prefixes[Math.min(limit, prefixes.length - 1)] ?? 0;
        });
      }
      return ways.reduce((total, value) =&gt; total + value, 0);
    }

    function expandDigitalPattern(pattern) {
      const combinations = [];
      const current = [];

      function visit(position, previousLayer) {
        if (position === 6) {
          combinations.push([...current]);
          return;
        }
        const minimumLayer = position === 0
          ? 0
          : previousLayer + (pattern[position - 1] &gt;= pattern[position] ? 1 : 0);
        const maximumLayer = pattern[position] &lt;= 4 ? 5 : 4;
        for (let layer = minimumLayer; layer &lt;= maximumLayer; layer += 1) {
          current.push(pattern[position] + 9 * layer);
          visit(position + 1, layer);
          current.pop();
        }
      }

      visit(0, 0);
      return combinations;
    }

    function naturalNumbersForTermination(termination) {
      const numbers = [];
      for (
        let number = termination === 0 ? 10 : termination;
        number &lt;= 49;
        number += 10
      ) {
        numbers.push(number);
      }
      return numbers;
    }

    function countTerminationPatternEquivalents(pattern) {
      let previousNumbers = naturalNumbersForTermination(pattern[0]);
      let previousWays = previousNumbers.map(() =&gt; 1);
      for (let position = 1; position &lt; 6; position += 1) {
        const currentNumbers = naturalNumbersForTermination(pattern[position]);
        const currentWays = currentNumbers.map((number) =&gt; {
          let total = 0;
          for (let index = 0; index &lt; previousNumbers.length; index += 1) {
            if (previousNumbers[index] &lt; number) total += previousWays[index];
          }
          return total;
        });
        previousNumbers = currentNumbers;
        previousWays = currentWays;
      }
      return previousWays.reduce((total, value) =&gt; total + value, 0);
    }

    function expandTerminationPattern(pattern) {
      const combinations = [];
      const current = [];
      function visit(position, previousNumber) {
        if (position === 6) {
          combinations.push([...current]);
          return;
        }
        naturalNumbersForTermination(pattern[position]).forEach((number) =&gt; {
          if (number &lt;= previousNumber) return;
          current.push(number);
          visit(position + 1, number);
          current.pop();
        });
      }
      visit(0, 0);
      return combinations;
    }

    async function analyseTerminationPatterns(safeLimit) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#x27;termination&#x27;);
      const allowedPositions = terminationSelections.map((selection) =&gt;
        [...selection].sort((first, second) =&gt; first - second)
      );
      const pattern = Array(6).fill(0);
      const classStats = Object.fromEntries(
        DIGITAL_EQUIVALENCE_VALUES.map((value) =&gt; [
          value,
          {
            patterns: 0,
            natural: 0,
            active: activeEquivalences.has(value)
          }
        ])
      );
      const patterns = [];
      let keepPatterns = true;
      let patternCount = 0;
      let naturalTotal = 0;

      function visit(position) {
        if (position === 6) {
          const equivalenceCount = countTerminationPatternEquivalents(pattern);
          if (!DIGITAL_EQUIVALENCE_VALUES.includes(equivalenceCount)) return;
          const stats = classStats[equivalenceCount];
          stats.patterns += 1;
          stats.natural += equivalenceCount;
          if (!activeEquivalences.has(equivalenceCount)) return;
          patternCount += 1;
          naturalTotal += equivalenceCount;
          if (keepPatterns) {
            if (naturalTotal &lt;= safeLimit) patterns.push([...pattern]);
            else {
              patterns.length = 0;
              keepPatterns = false;
            }
          }
          return;
        }
        allowedPositions[position].forEach((value) =&gt; {
          pattern[position] = value;
          visit(position + 1);
        });
      }

      for (let index = 0; index &lt; allowedPositions[0].length; index += 1) {
        pattern[0] = allowedPositions[0][index];
        visit(1);
        setDigitalMessage(
          `Analizando firmas de terminación… ${index + 1} de ${allowedPositions[0].length} bloques.`
        );
        await wait(0);
        if (digitalCancelRequested) return null;
      }

      return {
        mode: &#x27;termination&#x27;,
        patternCount,
        naturalTotal,
        classStats,
        patterns: keepPatterns ? patterns : [],
        withinLimit: naturalTotal &lt;= safeLimit
      };
    }

    async function generateTerminationDevelopment() {
      const details = signatureModeDetails(&#x27;termination&#x27;);
      if (details.selections.some((selection) =&gt; selection.size === 0)) {
        setDigitalMessage(
          &#x27;Activa directamente al menos una terminación en cada posición P1–P6.&#x27;,
          &#x27;error&#x27;
        );
        return;
      }
      digitalBusy = true;
      digitalCancelRequested = false;
      digitalGeneratedCombinations = [];
      digitalGeneratedPatternCount = 0;
      digitalGeneratedSignatureMode = &#x27;termination&#x27;;
      digitalOutput.hidden = true;
      resetDigitalQrWarning();
      refreshDigitalControls();
      const safeLimit = digitalDeviceLimit();
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);
      setDigitalMessage(&#x27;Calculando el desarrollo exacto de la firma de terminación…&#x27;);

      try {
        const analysis = await analyseTerminationPatterns(safeLimit);
        if (!analysis || digitalCancelRequested) {
          setDigitalMessage(&#x27;Cálculo cancelado. No se ha guardado un resultado parcial.&#x27;, &#x27;warning&#x27;);
          return;
        }
        digitalLastAnalysis = analysis;
        renderDigitalAnalysis(analysis, safeLimit);

        if (analysis.naturalTotal === 0) {
          setDigitalMessage(
            &#x27;No existe ninguna combinación natural que cumpla las terminaciones y cantidades equivalentes seleccionadas.&#x27;,
            &#x27;error&#x27;
          );
          return;
        }
        if (!analysis.withinLimit) {
          setDigitalMessage(
            `La firma de terminación produce ${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones y supera el límite seguro de ${safeLimit.toLocaleString(&#x27;es-ES&#x27;)} para este dispositivo. Reduce valores o equivalencias antes de generar.`,
            &#x27;warning&#x27;
          );
          return;
        }

        const generated = [];
        for (let index = 0; index &lt; analysis.patterns.length; index += 1) {
          generated.push(...expandTerminationPattern(analysis.patterns[index]));
          if (index % 500 === 0) {
            const percentage = Math.round((index + 1) / analysis.patterns.length * 100);
            setDigitalMessage(`Generando combinaciones por terminación… ${percentage} %`);
            await wait(0);
            if (digitalCancelRequested) break;
          }
        }

        if (digitalCancelRequested) {
          setDigitalMessage(
            &#x27;Generación cancelada. No se ha guardado un resultado parcial.&#x27;,
            &#x27;warning&#x27;
          );
          return;
        }
        if (generated.length !== analysis.naturalTotal) {
          throw new Error(
            `el recuento previsto era ${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} y se han construido ${generated.length.toLocaleString(&#x27;es-ES&#x27;)}`
          );
        }

        digitalGeneratedCombinations = generated;
        digitalGeneratedPatternCount = analysis.patternCount;
        digitalPageIndex = 0;
        digitalResultDescription.textContent =
          `${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones naturales cumplen la firma de terminación configurada en P1–P6.`;
        renderDigitalResults();
        refreshFilterSourceButtons();
        setDigitalMessage(
          `Desarrollo completado: ${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones por firma de terminación. Puedes copiarlas, filtrarlas, reducirlas o preparar sus QR.`
        );
      } catch (error) {
        digitalGeneratedCombinations = [];
        digitalGeneratedPatternCount = 0;
        digitalOutput.hidden = true;
        refreshFilterSourceButtons();
        setDigitalMessage(
          `No se ha podido completar el desarrollo por terminación: ${error.message || &#x27;error desconocido&#x27;}.`,
          &#x27;error&#x27;
        );
      } finally {
        digitalBusy = false;
        digitalCancelRequested = false;
        refreshDigitalControls();
      }
    }

    async function analyseDigitalPatterns(safeLimit) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#x27;digital&#x27;);
      const allowedPositions = digitalSelections
        .slice(0, 6)
        .map((selection) =&gt; [...selection].sort((first, second) =&gt; first - second));
      const allowedSdcd = digitalSelections[6];
      const pattern = Array(6).fill(0);
      const classStats = Object.fromEntries(
        DIGITAL_EQUIVALENCE_VALUES.map((value) =&gt; [
          value,
          { patterns: 0, natural: 0, active: activeEquivalences.has(value) }
        ])
      );
      const patterns = [];
      let keepPatterns = true;
      let patternCount = 0;
      let naturalTotal = 0;

      function visit(position, digitalSum) {
        if (position === 6) {
          if (!allowedSdcd.has(digitalRoot(digitalSum))) return;
          const equivalenceCount = countDigitalPatternEquivalents(pattern);
          if (!DIGITAL_EQUIVALENCE_VALUES.includes(equivalenceCount)) return;
          const stats = classStats[equivalenceCount];
          stats.patterns += 1;
          stats.natural += equivalenceCount;
          if (!activeEquivalences.has(equivalenceCount)) return;
          patternCount += 1;
          naturalTotal += equivalenceCount;
          if (keepPatterns) {
            if (naturalTotal &lt;= safeLimit) {
              patterns.push([...pattern]);
            } else {
              patterns.length = 0;
              keepPatterns = false;
            }
          }
          return;
        }

        allowedPositions[position].forEach((value) =&gt; {
          pattern[position] = value;
          visit(position + 1, digitalSum + value);
        });
      }

      const firstValues = allowedPositions[0];
      for (let index = 0; index &lt; firstValues.length; index += 1) {
        pattern[0] = firstValues[index];
        visit(1, firstValues[index]);
        setDigitalMessage(
          `Analizando combinaciones digitales… ${index + 1} de ${firstValues.length} bloques.`
        );
        await wait(0);
        if (digitalCancelRequested) return null;
      }

      return {
        patternCount,
        naturalTotal,
        classStats,
        patterns: keepPatterns ? patterns : [],
        withinLimit: naturalTotal &lt;= safeLimit
      };
    }

    function renderDigitalAnalysis(analysis, safeLimit) {
      digitalPatternTotal.textContent = analysis.patternCount.toLocaleString(&#x27;es-ES&#x27;);
      digitalNaturalTotal.textContent = analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;);
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);
      digitalTotalBadge.textContent = `${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} naturales`;
      digitalEquivalenceBreakdown.replaceChildren();
      DIGITAL_EQUIVALENCE_VALUES.forEach((value) =&gt; {
        const stats = analysis.classStats[value];
        const chip = document.createElement(&#x27;span&#x27;);
        chip.className = &#x27;digital-equivalence-stat&#x27;;
        const title = document.createElement(&#x27;strong&#x27;);
        title.textContent = `${value} eq.`;
        const description = stats.active
          ? `${stats.patterns.toLocaleString(&#x27;es-ES&#x27;)} ${analysis.mode === &#x27;termination&#x27; ? &#x27;firmas&#x27; : &#x27;digitales&#x27;} · ${stats.natural.toLocaleString(&#x27;es-ES&#x27;)} naturales`
          : &#x27;desactivada&#x27;;
        chip.append(title, document.createTextNode(description));
        digitalEquivalenceBreakdown.appendChild(chip);
      });
    }

    function renderCombinedAnalysis(analysis, safeLimit) {
      digitalPatternLabel.textContent = &#x27;Patrones digitales examinados&#x27;;
      digitalPatternTotal.textContent = analysis.patternCount.toLocaleString(&#x27;es-ES&#x27;);
      digitalNaturalTotal.textContent = analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;);
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);
      digitalTotalBadge.textContent = `${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} combinadas`;
      digitalEquivalenceBreakdown.replaceChildren();
      [
        [&#x27;Digital&#x27;, [...effectiveEquivalenceSelectionsForMode(&#x27;digital&#x27;)].sort((a, b) =&gt; a - b).join(&#x27; · &#x27;)],
        [&#x27;Terminación&#x27;, [...effectiveEquivalenceSelectionsForMode(&#x27;termination&#x27;)].sort((a, b) =&gt; a - b).join(&#x27; · &#x27;)],
        [&#x27;Candidatas revisadas&#x27;, analysis.candidateTotal.toLocaleString(&#x27;es-ES&#x27;)]
      ].forEach(([label, value]) =&gt; {
        const chip = document.createElement(&#x27;span&#x27;);
        chip.className = &#x27;digital-equivalence-stat&#x27;;
        const title = document.createElement(&#x27;strong&#x27;);
        title.textContent = `${label}:`;
        chip.append(title, document.createTextNode(value));
        digitalEquivalenceBreakdown.appendChild(chip);
      });
    }

    function renderDigitalResults() {
      const total = digitalGeneratedCombinations.length;
      const pageTotal = Math.max(1, Math.ceil(total / DIGITAL_PAGE_SIZE));
      digitalPageIndex = Math.min(Math.max(0, digitalPageIndex), pageTotal - 1);
      const start = digitalPageIndex * DIGITAL_PAGE_SIZE;
      digitalResultList.replaceChildren();
      digitalGeneratedCombinations
        .slice(start, start + DIGITAL_PAGE_SIZE)
        .forEach((combination, pageIndex) =&gt; {
          const item = document.createElement(&#x27;li&#x27;);
          item.className = &#x27;digital-result-item&#x27;;
          const index = document.createElement(&#x27;span&#x27;);
          index.className = &#x27;digital-result-index&#x27;;
          index.textContent = String(start + pageIndex + 1).padStart(2, &#x27;0&#x27;);
          const numbers = document.createElement(&#x27;span&#x27;);
          numbers.className = &#x27;digital-result-numbers&#x27;;
          numbers.textContent = combination
            .map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;))
            .join(&#x27; · &#x27;);
          const detail = document.createElement(&#x27;span&#x27;);
          detail.className = &#x27;digital-result-roots&#x27;;
          if (digitalGeneratedSignatureMode === &#x27;termination&#x27;) {
            const endings = combination.map((number) =&gt; number % 10);
            const terminationEquivalence = countTerminationPatternEquivalents(endings);
            detail.textContent = `Terminaciones ${endings.join(&#x27;-&#x27;)} · ${terminationEquivalence} ${terminationEquivalence === 1 ? &#x27;equivalencia&#x27; : &#x27;equivalencias&#x27;}`;
          } else if (digitalGeneratedSignatureMode === &#x27;combined&#x27;) {
            const roots = combination.map(digitalRoot);
            const endings = combination.map((number) =&gt; number % 10);
            const digitalEquivalence = countDigitalPatternEquivalents(roots);
            const terminationEquivalence = countTerminationPatternEquivalents(endings);
            detail.textContent = `DR ${roots.join(&#x27;-&#x27;)} (${digitalEquivalence}) · T ${endings.join(&#x27;-&#x27;)} (${terminationEquivalence}) · SDCD ${digitalRoot(
              roots.reduce((sum, value) =&gt; sum + value, 0)
            )}`;
          } else {
            const roots = combination.map(digitalRoot);
            const equivalenceTotal = countDigitalPatternEquivalents(roots);
            detail.textContent = `DR ${roots.join(&#x27;-&#x27;)} · SDCD ${digitalRoot(
              roots.reduce((sum, value) =&gt; sum + value, 0)
            )} · ${equivalenceTotal} ${equivalenceTotal === 1 ? &#x27;equivalencia&#x27; : &#x27;equivalencias&#x27;}`;
          }
          item.append(index, numbers, detail);
          digitalResultList.appendChild(item);
        });
      digitalOutput.hidden = total === 0;
      digitalResultCount.textContent = `${total.toLocaleString(&#x27;es-ES&#x27;)} ${total === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}`;
      digitalPagination.hidden = total &lt;= DIGITAL_PAGE_SIZE;
      digitalPage.textContent = `${digitalPageIndex + 1} de ${pageTotal}`;
      digitalPreviousButton.disabled = digitalPageIndex === 0;
      digitalNextButton.disabled = digitalPageIndex &gt;= pageTotal - 1;
      filterDigitalButton.disabled = total === 0;
      digitalCopyButton.disabled = total === 0;
      digitalReducerButton.disabled = total &lt; 2;
      digitalReducerButton.title = total &lt; 2
        ? &#x27;Se necesitan al menos 2 combinaciones para realizar una reducción.&#x27;
        : &#x27;&#x27;;
      digitalQrButton.disabled = total === 0;
    }

    async function generateDigitalDevelopment() {
      if (digitalBusy) return;
      if (getSignatureMode() === &#x27;termination&#x27;) {
        await generateTerminationDevelopment();
        return;
      }
      if (digitalSelections.some((selection) =&gt; selection.size === 0)) {
        setDigitalMessage(
          &#x27;Activa al menos un valor en cada una de las columnas P1–P6 y SDCD.&#x27;,
          &#x27;error&#x27;
        );
        return;
      }
      digitalBusy = true;
      digitalCancelRequested = false;
      digitalGeneratedCombinations = [];
      digitalGeneratedPatternCount = 0;
      digitalGeneratedSignatureMode = &#x27;digital&#x27;;
      digitalOutput.hidden = true;
      resetDigitalQrWarning();
      refreshDigitalControls();
      const safeLimit = digitalDeviceLimit();
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);

      try {
        const analysis = await analyseDigitalPatterns(safeLimit);
        if (!analysis || digitalCancelRequested) {
          setDigitalMessage(&#x27;Cálculo cancelado. No se ha sustituido ningún desarrollo.&#x27;, &#x27;warning&#x27;);
          return;
        }
        digitalLastAnalysis = analysis;
        renderDigitalAnalysis(analysis, safeLimit);

        if (analysis.naturalTotal === 0) {
          setDigitalMessage(
            &#x27;No existen combinaciones naturales que cumplan simultáneamente la selección posicional, la SDCD y las equivalencias activadas.&#x27;,
            &#x27;error&#x27;
          );
          return;
        }
        if (!analysis.withinLimit) {
          setDigitalMessage(
            `El desarrollo contiene ${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} combinaciones naturales y supera el límite seguro de ${safeLimit.toLocaleString(&#x27;es-ES&#x27;)} para este dispositivo. Desactiva valores posicionales, valores de SDCD o clases de equivalencias antes de generarlo.`,
            &#x27;warning&#x27;
          );
          return;
        }

        const patterns = analysis.patterns;
        analysis.patterns = [];
        const generated = [];
        for (let index = 0; index &lt; patterns.length; index += 1) {
          generated.push(...expandDigitalPattern(patterns[index]));
          if ((index + 1) % 250 === 0) {
            const percentage = Math.round((index + 1) / patterns.length * 100);
            setDigitalMessage(`Generando equivalencias naturales… ${percentage} %`);
            await wait(0);
            if (digitalCancelRequested) break;
          }
        }

        if (digitalCancelRequested) {
          setDigitalMessage(&#x27;Generación cancelada. No se ha guardado un resultado parcial.&#x27;, &#x27;warning&#x27;);
          return;
        }
        if (generated.length !== analysis.naturalTotal) {
          throw new Error(
            `el recuento previsto era ${analysis.naturalTotal.toLocaleString(&#x27;es-ES&#x27;)} y se han construido ${generated.length.toLocaleString(&#x27;es-ES&#x27;)}`
          );
        }

        digitalGeneratedCombinations = generated;
        digitalGeneratedPatternCount = analysis.patternCount;
        digitalPageIndex = 0;
        const naturalDescription = generated.length === 1
          ? &#x27;1 combinación natural equivalente&#x27;
          : `${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones naturales equivalentes`;
        const naturalMessage = generated.length === 1
          ? &#x27;1 combinación natural&#x27;
          : `${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones naturales`;
        digitalResultDescription.textContent = analysis.patternCount === 1
          ? `1 combinación digital posicional ha desarrollado ${naturalDescription}.`
          : `${analysis.patternCount.toLocaleString(&#x27;es-ES&#x27;)} combinaciones digitales posicionales han desarrollado ${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones naturales equivalentes.`;
        renderDigitalResults();
        refreshFilterSourceButtons();
        setDigitalMessage(
          analysis.patternCount === 1
            ? `Desarrollo completado: ${naturalMessage}, procedente de 1 combinación digital.`
            : `Desarrollo completado: ${naturalMessage}, procedentes de ${analysis.patternCount.toLocaleString(&#x27;es-ES&#x27;)} combinaciones digitales.`
        );
      } catch (error) {
        digitalGeneratedCombinations = [];
        digitalGeneratedPatternCount = 0;
        digitalOutput.hidden = true;
        refreshFilterSourceButtons();
        setDigitalMessage(
          `No se ha podido completar el desarrollo: ${error.message || &#x27;error desconocido&#x27;}.`,
          &#x27;error&#x27;
        );
      } finally {
        digitalBusy = false;
        digitalCancelRequested = false;
        refreshDigitalControls();
      }
    }

    function terminationPatternKey(pattern) {
      return pattern.reduce((key, value) =&gt; key * 10 + value, 0);
    }

    function combinationMatchesTerminationConfiguration(combination, equivalenceCache) {
      const activeEquivalences = effectiveEquivalenceSelectionsForMode(&#x27;termination&#x27;);
      const pattern = combination.map((number) =&gt; number % 10);
      for (let position = 0; position &lt; 6; position += 1) {
        if (!terminationSelections[position].has(pattern[position])) return false;
      }
      const key = terminationPatternKey(pattern);
      let equivalenceCount = equivalenceCache.get(key);
      if (equivalenceCount === undefined) {
        equivalenceCount = countTerminationPatternEquivalents(pattern);
        equivalenceCache.set(key, equivalenceCount);
      }
      return activeEquivalences.has(equivalenceCount);
    }

    async function generateCombinedSignatureDevelopment() {
      if (digitalBusy) return;
      if (!hasCompleteSignatureConfiguration(&#x27;digital&#x27;)) {
        setDigitalMessage(
          &#x27;Completa P1–P6, SDCD y las equivalencias de la firma de raíz digital antes de combinar.&#x27;,
          &#x27;error&#x27;
        );
        return;
      }
      if (!hasCompleteSignatureConfiguration(&#x27;termination&#x27;)) {
        setDigitalMessage(
          &#x27;Completa P1–P6 y las equivalencias de la firma de terminación antes de combinar.&#x27;,
          &#x27;error&#x27;
        );
        return;
      }

      digitalBusy = true;
      digitalCancelRequested = false;
      digitalGeneratedCombinations = [];
      digitalGeneratedPatternCount = 0;
      digitalGeneratedSignatureMode = &#x27;combined&#x27;;
      digitalOutput.hidden = true;
      resetDigitalQrWarning();
      refreshDigitalControls();
      const safeLimit = digitalDeviceLimit();
      digitalSafeLimit.textContent = formatOperationLimit(safeLimit);
      setDigitalMessage(&#x27;Combinando las firmas digital y de terminación…&#x27;);

      try {
        const activeDigitalEquivalences = effectiveEquivalenceSelectionsForMode(&#x27;digital&#x27;);
        const allowedDigitalPositions = digitalSelections
          .slice(0, 6)
          .map((selection) =&gt; [...selection].sort((a, b) =&gt; a - b));
        const allowedSdcd = digitalSelections[6];
        const digitalPattern = Array(6).fill(0);
        const terminationEquivalenceCache = new Map();
        const generated = [];
        let keepGenerated = true;
        let patternCount = 0;
        let candidateTotal = 0;
        let combinedTotal = 0;

        function visitDigital(position, digitalSum) {
          if (position === 6) {
            if (!allowedSdcd.has(digitalRoot(digitalSum))) return;
            const digitalEquivalence = countDigitalPatternEquivalents(digitalPattern);
            if (!activeDigitalEquivalences.has(digitalEquivalence)) return;
            patternCount += 1;
            const candidates = expandDigitalPattern(digitalPattern);
            candidateTotal += candidates.length;
            candidates.forEach((combination) =&gt; {
              if (!combinationMatchesTerminationConfiguration(
                combination,
                terminationEquivalenceCache
              )) return;
              combinedTotal += 1;
              if (keepGenerated) {
                if (combinedTotal &lt;= safeLimit) generated.push(combination);
                else {
                  generated.length = 0;
                  keepGenerated = false;
                }
              }
            });
            return;
          }
          allowedDigitalPositions[position].forEach((value) =&gt; {
            digitalPattern[position] = value;
            visitDigital(position + 1, digitalSum + value);
          });
        }

        for (let index = 0; index &lt; allowedDigitalPositions[0].length; index += 1) {
          digitalPattern[0] = allowedDigitalPositions[0][index];
          visitDigital(1, allowedDigitalPositions[0][index]);
          setDigitalMessage(
            `Combinando firmas… ${index + 1} de ${allowedDigitalPositions[0].length} bloques digitales.`
          );
          await wait(0);
          if (digitalCancelRequested) break;
        }

        if (digitalCancelRequested) {
          setDigitalMessage(&#x27;Combinación de firmas cancelada. No se ha guardado un resultado parcial.&#x27;, &#x27;warning&#x27;);
          return;
        }

        const analysis = {
          mode: &#x27;combined&#x27;,
          patternCount,
          candidateTotal,
          naturalTotal: combinedTotal,
          withinLimit: combinedTotal &lt;= safeLimit
        };
        digitalLastAnalysis = analysis;
        renderCombinedAnalysis(analysis, safeLimit);

        if (combinedTotal === 0) {
          setDigitalMessage(
            &#x27;No existe ninguna combinación que cumpla simultáneamente las dos firmas y sus equivalencias.&#x27;,
            &#x27;error&#x27;
          );
          return;
        }
        if (!analysis.withinLimit) {
          setDigitalMessage(
            `La combinación de firmas conserva ${combinedTotal.toLocaleString(&#x27;es-ES&#x27;)} apuestas y supera el límite seguro de ${safeLimit.toLocaleString(&#x27;es-ES&#x27;)}. Restringe valores o equivalencias en alguna de las dos firmas.`,
            &#x27;warning&#x27;
          );
          return;
        }
        if (generated.length !== combinedTotal) {
          throw new Error(
            `el recuento combinado era ${combinedTotal.toLocaleString(&#x27;es-ES&#x27;)} y se han conservado ${generated.length.toLocaleString(&#x27;es-ES&#x27;)}`
          );
        }

        digitalGeneratedCombinations = generated;
        digitalGeneratedPatternCount = patternCount;
        digitalPageIndex = 0;
        digitalResultDescription.textContent =
          `${generated.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones cumplen simultáneamente la firma digital y la firma de terminación configuradas.`;
        renderDigitalResults();
        refreshFilterSourceButtons();
        setDigitalMessage(
          `Combinación completada: ${generated.length.toLocaleString(&#x27;es-ES&#x27;)} apuestas. Puedes copiarlas, pasarlas a los filtros, reducirlas o preparar sus QR.`
        );
      } catch (error) {
        digitalGeneratedCombinations = [];
        digitalGeneratedPatternCount = 0;
        digitalOutput.hidden = true;
        refreshFilterSourceButtons();
        setDigitalMessage(
          `No se han podido combinar las firmas: ${error.message || &#x27;error desconocido&#x27;}.`,
          &#x27;error&#x27;
        );
      } finally {
        digitalBusy = false;
        digitalCancelRequested = false;
        refreshDigitalControls();
      }
    }

    function cancelDigitalDevelopment() {
      if (!digitalBusy || digitalCancelRequested) return;
      digitalCancelRequested = true;
      digitalCancelButton.disabled = true;
      setDigitalMessage(
        &#x27;Cancelación solicitada. El proceso se detendrá al finalizar el bloque actual.&#x27;,
        &#x27;warning&#x27;
      );
    }

    async function copyDigitalDevelopment() {
      if (digitalGeneratedCombinations.length === 0) {
        setDigitalMessage(&#x27;Genera primero un desarrollo por firma posicional.&#x27;, &#x27;error&#x27;);
        return;
      }
      const result = await copyTextToClipboard(
        combinationsToClipboardText(digitalGeneratedCombinations)
      );
      if (result.copied) {
        setDigitalMessage(
          `${digitalGeneratedCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones copiadas, una por línea.`
        );
      } else if (result.manual) {
        setDigitalMessage(&#x27;El navegador ha mostrado el desarrollo para copiarlo manualmente.&#x27;);
      } else {
        setDigitalMessage(&#x27;No se ha podido copiar el desarrollo.&#x27;, &#x27;error&#x27;);
      }
    }

    function generateDigitalQr() {
      const total = digitalGeneratedCombinations.length;
      if (total === 0) {
        setDigitalMessage(&#x27;Genera primero un desarrollo por firma posicional.&#x27;, &#x27;error&#x27;);

          `Este desarrollo contiene ${total.toLocaleString(&#x27;es-ES&#x27;)} apuestas y puede producir aproximadamente ${Math.ceil(total / 8).toLocaleString(&#x27;es-ES&#x27;)} códigos QR. Pulsa de nuevo para enviarlo a la configuración QR.`,
          &#x27;warning&#x27;
        );
        return;
      }
      resetDigitalQrWarning();
      prepareQrGeneration(digitalGeneratedCombinations, &#x27;digital&#x27;);
    }

    function createFilterRangeRow(container, label, key, limits = {}) {

      maxInput.max = String(limits.maximum ?? 6);
      maxInput.value = String(limits.defaultMax ?? limits.maximum ?? 6);

    function createFilterFigureChips(container, figures, group, formatter = (value) =&gt; value) {

    function buildFilterControls() {
      const decadeRows = root.querySelector(&#x27;#lottery-filter-decade-rows&#x27;);
      [&#x27;01–09&#x27;, &#x27;10–19&#x27;, &#x27;20–29&#x27;, &#x27;30–39&#x27;, &#x27;40–49&#x27;].forEach((label, index) =&gt; {
        createFilterRangeRow(decadeRows, `Decena ${label}`, `decade-${index}`);
      });
      createFilterFigureChips(
        root.querySelector(&#x27;#lottery-filter-decade-figures&#x27;),
        FILTER_FIGURES_WITH_SIX_GROUPS,
        &#x27;decades&#x27;
      );

      const distanceRows = root.querySelector(&#x27;#lottery-filter-distance-rows&#x27;);
      for (let index = 0; index &lt; 5; index += 1) {
        createFilterRangeRow(
          distanceRows,
          `Bolas ${index + 1} y ${index + 2}`,
          `distance-${index}`,
          { minimum: 1, maximum: 48, defaultMin: 1, defaultMax: 48 }
        );

    function setFilterProfileMessage(message, isError = false) {
      filterProfileMessage.textContent = message;
      filterProfileMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function makeFilterProfileId() {
      return window.crypto?.randomUUID?.()
        ?? `filter-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function cleanFilterProfileName(value) {
      return String(value ?? &#x27;&#x27;).replace(/\s+/g, &#x27; &#x27;).trim().slice(0, 60);
    }

    function filterControlKey(input) {
      if (input.id) return `id:${input.id}`;
      const dataKey = Object.entries(input.dataset)
        .sort(([first], [second]) =&gt; first.localeCompare(second))
        .map(([key, value]) =&gt; `${key}:${value}`)
        .join(&#x27;|&#x27;);
      const fixedValue = input.dataset.filterFigure ? `|option:${input.value}` : &#x27;&#x27;;
      return `data:${dataKey}${fixedValue}`;
    }

    function snapshotFilterControls() {
      return [...filterGrid.querySelectorAll(&#x27;input&#x27;)].map((input) =&gt; {
        const saved = { key: filterControlKey(input) };
        if (input.type === &#x27;checkbox&#x27;) saved.checked = input.checked;
        else saved.value = input.value;
        return saved;
      });
    }

    function normaliseFilterProfile(profile) {
      if (!profile || typeof profile !== &#x27;object&#x27;) {
        throw new Error(&#x27;Configuración de filtros no válida.&#x27;);
      }
      const name = cleanFilterProfileName(profile.name);
      if (!name || !Array.isArray(profile.controls)) {
        throw new Error(&#x27;Configuración de filtros incompleta.&#x27;);
      }
      const controls = profile.controls
        .slice(0, 500)
        .filter((control) =&gt; control &amp;&amp; typeof control.key === &#x27;string&#x27;)
        .map((control) =&gt; ({
          key: control.key.slice(0, 180),
          ...(Object.prototype.hasOwnProperty.call(control, &#x27;checked&#x27;)
            ? { checked: Boolean(control.checked) }
            : { value: String(control.value ?? &#x27;&#x27;).slice(0, 500) })
        }));
      return {
        id: String(profile.id || makeFilterProfileId()).slice(0, 100),
        name,
        createdAt: String(profile.createdAt || new Date().toISOString()),
        updatedAt: String(profile.updatedAt || profile.createdAt || new Date().toISOString()),
        controls
      };
    }

    function saveFilterProfilesToBrowser() {
      try {
        window.localStorage.setItem(
          FILTER_PROFILE_STORAGE_KEY,
          JSON.stringify(savedFilterProfiles)
        );
        return true;
      } catch (error) {
        setFilterProfileMessage(
          &#x27;Este navegador no permite guardar la configuración o no dispone de espacio. Los filtros actuales continúan aplicados, pero no se conservarán al cerrar.&#x27;,
          true
        );
        return false;
      }
    }

    function loadFilterProfilesFromBrowser() {
      try {
        const stored = window.localStorage.getItem(FILTER_PROFILE_STORAGE_KEY);
        if (!stored) {
          savedFilterProfiles = [];
          return;
        }
        const parsed = JSON.parse(stored);
        savedFilterProfiles = Array.isArray(parsed)
          ? parsed
            .slice(0, FILTER_PROFILE_STORAGE_LIMIT)
            .map((profile) =&gt; {
              try {
                return normaliseFilterProfile(profile);
              } catch (error) {
                return null;
              }
            })
            .filter(Boolean)
          : [];
        setFilterProfileMessage(
          savedFilterProfiles.length &gt; 0
            ? `${savedFilterProfiles.length} ${savedFilterProfiles.length === 1 ? &#x27;configuración recuperada&#x27; : &#x27;configuraciones recuperadas&#x27;} en este navegador.`
            : &#x27;Las configuraciones se conservan localmente en este navegador.&#x27;
        );
      } catch (error) {
        savedFilterProfiles = [];
        setFilterProfileMessage(
          &#x27;No se han podido leer las configuraciones guardadas en este navegador.&#x27;,
          true
        );
      }
    }

    function exportFilterProfileBackup() {
      if (filterBusy) return;
      if (savedFilterProfiles.length === 0) {
        setFilterProfileMessage(&#x27;No hay configuraciones guardadas para incluir en el respaldo.&#x27;, true);
        return;
      }
      try {
        const backup = {
          schema: FILTER_PROFILE_EXPORT_SCHEMA,
          version: FILTER_PROFILE_EXPORT_VERSION,
          exportedAt: new Date().toISOString(),
          profiles: savedFilterProfiles.map((profile) =&gt; normaliseFilterProfile(profile))
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], {
          type: &#x27;application/json;charset=utf-8&#x27;
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        const date = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = `QR-Loto-Suite-filtros-${date}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
        setFilterProfileMessage(
          `Respaldo descargado con ${savedFilterProfiles.length} ${savedFilterProfiles.length === 1 ? &#x27;configuración&#x27; : &#x27;configuraciones&#x27;}.`
        );
      } catch (error) {
        setFilterProfileMessage(&#x27;No se ha podido crear el respaldo de filtros.&#x27;, true);
      }
    }

    async function importFilterProfileBackup(file) {
      if (filterBusy || !file) return;
      if (file.size &gt; FILTER_PROFILE_IMPORT_MAX_BYTES) {
        setFilterProfileMessage(&#x27;El archivo de respaldo es demasiado grande.&#x27;, true);
        return;
      }
      try {
        const parsed = JSON.parse(await file.text());
        let sourceProfiles;
        if (Array.isArray(parsed)) {
          sourceProfiles = parsed;
        } else if (
          parsed
          &amp;&amp; parsed.schema === FILTER_PROFILE_EXPORT_SCHEMA
          &amp;&amp; Number(parsed.version) === FILTER_PROFILE_EXPORT_VERSION
          &amp;&amp; Array.isArray(parsed.profiles)
        ) {
          sourceProfiles = parsed.profiles;
        } else {
          throw new Error(&#x27;El archivo no pertenece a un respaldo compatible de QR Loto Suite.&#x27;);
        }

        const imported = sourceProfiles
          .slice(0, FILTER_PROFILE_STORAGE_LIMIT)
          .map((profile) =&gt; normaliseFilterProfile(profile));
        if (imported.length === 0) {
          throw new Error(&#x27;El respaldo no contiene configuraciones de filtros.&#x27;);
        }

        const previousProfiles = savedFilterProfiles.map((profile) =&gt; ({
          ...profile,
          controls: profile.controls.map((control) =&gt; ({ ...control }))
        }));
        const merged = [...savedFilterProfiles];
        let added = 0;
        let replaced = 0;
        imported.forEach((profile) =&gt; {
          const existingIndex = merged.findIndex(
            (current) =&gt; current.name.toLocaleLowerCase(&#x27;es&#x27;) === profile.name.toLocaleLowerCase(&#x27;es&#x27;)
          );
          if (existingIndex &gt;= 0) {
            merged[existingIndex] = {
              ...profile,
              id: merged[existingIndex].id,
              createdAt: merged[existingIndex].createdAt,
              updatedAt: new Date().toISOString()
            };
            replaced += 1;
          } else if (merged.length &lt; FILTER_PROFILE_STORAGE_LIMIT) {
            merged.push({
              ...profile,
              id: makeFilterProfileId(),
              updatedAt: new Date().toISOString()
            });
            added += 1;
          }
        });
        savedFilterProfiles = merged.slice(0, FILTER_PROFILE_STORAGE_LIMIT);
        if (!saveFilterProfilesToBrowser()) {
          savedFilterProfiles = previousProfiles;
          renderFilterProfiles();
          return;
        }
        filterProfilePendingDeleteId = null;
        filterProfileDeleteButton.textContent = &#x27;Eliminar&#x27;;
        renderFilterProfiles();
        setFilterProfileMessage(
          `Respaldo importado: ${added} ${added === 1 ? &#x27;configuración añadida&#x27; : &#x27;configuraciones añadidas&#x27;}${replaced ? ` y ${replaced} ${replaced === 1 ? &#x27;actualizada&#x27; : &#x27;actualizadas&#x27;}` : &#x27;&#x27;}.`
        );
      } catch (error) {
        setFilterProfileMessage(error.message || &#x27;No se ha podido importar el respaldo.&#x27;, true);
      }
    }

    function renderFilterProfiles(selectedId = filterProfileSelect.value) {
      filterProfileSelect.replaceChildren();
      const placeholder = document.createElement(&#x27;option&#x27;);
      placeholder.value = &#x27;&#x27;;
      placeholder.textContent = savedFilterProfiles.length
        ? &#x27;Selecciona una configuración&#x27;
        : &#x27;No hay configuraciones guardadas&#x27;;
      filterProfileSelect.appendChild(placeholder);
      savedFilterProfiles.forEach((profile) =&gt; {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = profile.id;
        option.textContent = profile.name;
        filterProfileSelect.appendChild(option);
      });
      filterProfileSelect.value = savedFilterProfiles.some((profile) =&gt; profile.id === selectedId)
        ? selectedId
        : &#x27;&#x27;;
      const total = savedFilterProfiles.length;
      filterProfileCount.textContent = `${total} ${total === 1 ? &#x27;guardada&#x27; : &#x27;guardadas&#x27;}`;
      const hasSelection = Boolean(filterProfileSelect.value);
      filterProfileLoadButton.disabled = !hasSelection || filterBusy;
      filterProfileDeleteButton.disabled = !hasSelection || filterBusy;
      filterProfileExportButton.disabled = savedFilterProfiles.length === 0 || filterBusy;
      filterProfileImportButton.disabled = filterBusy;
    }

    function applyFilterControlSnapshot(controls) {
      const savedByKey = new Map(controls.map((control) =&gt; [control.key, control]));
      filterGrid.querySelectorAll(&#x27;input&#x27;).forEach((input) =&gt; {
        if (input.type === &#x27;checkbox&#x27;) input.checked = false;
        else input.value = input.defaultValue;
        const saved = savedByKey.get(filterControlKey(input));
        if (!saved) return;
        if (input.type === &#x27;checkbox&#x27;) input.checked = Boolean(saved.checked);
        else input.value = String(saved.value ?? &#x27;&#x27;);
      });
    }

    function saveCurrentFilterProfile() {
      if (filterBusy) return;
      const name = cleanFilterProfileName(filterProfileNameInput.value);
      if (!name) {
        setFilterProfileMessage(&#x27;Escribe un nombre para identificar la configuración.&#x27;, true);
        filterProfileNameInput.focus();
        return;
      }
      try {
        readFilterConfiguration();
      } catch (error) {
        setFilterProfileMessage(
          `${error.message || &#x27;Revisa la configuración de los filtros.&#x27;} Corrígelo antes de guardarla.`,
          true
        );
        return;
      }

      const now = new Date().toISOString();
      const existingIndex = savedFilterProfiles.findIndex(
        (profile) =&gt; profile.name.localeCompare(name, &#x27;es&#x27;, { sensitivity: &#x27;base&#x27; }) === 0
      );
      if (existingIndex === -1 &amp;&amp; savedFilterProfiles.length &gt;= FILTER_PROFILE_STORAGE_LIMIT) {
        setFilterProfileMessage(
          `Se ha alcanzado el límite de ${FILTER_PROFILE_STORAGE_LIMIT} configuraciones. Elimina alguna antes de guardar otra.`,
          true
        );
        return;
      }
      const previousProfiles = [...savedFilterProfiles];
      const profile = normaliseFilterProfile({
        id: existingIndex &gt;= 0 ? savedFilterProfiles[existingIndex].id : makeFilterProfileId(),
        name,
        createdAt: existingIndex &gt;= 0 ? savedFilterProfiles[existingIndex].createdAt : now,
        updatedAt: now,
        controls: snapshotFilterControls()
      });
      if (existingIndex &gt;= 0) savedFilterProfiles.splice(existingIndex, 1);
      savedFilterProfiles.unshift(profile);
      if (!saveFilterProfilesToBrowser()) {
        savedFilterProfiles = previousProfiles;
        renderFilterProfiles();
        return;
      }
      filterProfilePendingDeleteId = null;
      filterProfileDeleteButton.textContent = &#x27;Eliminar&#x27;;
      filterProfileNameInput.value = profile.name;
      renderFilterProfiles(profile.id);
      setFilterProfileMessage(
        existingIndex &gt;= 0
          ? `Configuración «${profile.name}» actualizada.`
          : `Configuración «${profile.name}» guardada para usarla en otra ocasión.`
      );
    }

    function loadSelectedFilterProfile() {
      if (filterBusy) return;
      const profile = savedFilterProfiles.find(
        (savedProfile) =&gt; savedProfile.id === filterProfileSelect.value
      );
      if (!profile) {
        setFilterProfileMessage(&#x27;Selecciona la configuración que quieres cargar.&#x27;, true);
        return;
      }
      const previousControls = snapshotFilterControls();
      applyFilterControlSnapshot(profile.controls);
      try {
        readFilterConfiguration();
      } catch (error) {
        applyFilterControlSnapshot(previousControls);
        setFilterProfileMessage(
          &#x27;La configuración guardada no es compatible con esta versión y no se ha aplicado.&#x27;,
          true
        );
        return;
      }
      filterProfileNameInput.value = profile.name;
      filterProfilePendingDeleteId = null;
      filterProfileDeleteButton.textContent = &#x27;Eliminar&#x27;;
      refreshFilterCardStates();
      clearFilteredResult(
        `Configuración «${profile.name}» cargada. Pulsa «Aplicar filtros» para obtener un nuevo resultado.`
      );
      updateFilterSourceSummary(false);
      setFilterProfileMessage(`Configuración «${profile.name}» cargada correctamente.`);
    }

    function deleteSelectedFilterProfile() {
      if (filterBusy) return;
      const profile = savedFilterProfiles.find(
        (savedProfile) =&gt; savedProfile.id === filterProfileSelect.value
      );
      if (!profile) {
        setFilterProfileMessage(&#x27;Selecciona la configuración que quieres eliminar.&#x27;, true);
        return;
      }
      if (filterProfilePendingDeleteId !== profile.id) {
        filterProfilePendingDeleteId = profile.id;
        filterProfileDeleteButton.textContent = &#x27;Confirmar eliminación&#x27;;
        setFilterProfileMessage(
          `Pulsa otra vez para eliminar definitivamente «${profile.name}».`,
          true
        );
        return;
      }
      const previousProfiles = [...savedFilterProfiles];
      savedFilterProfiles = savedFilterProfiles.filter(
        (savedProfile) =&gt; savedProfile.id !== profile.id
      );
      if (!saveFilterProfilesToBrowser()) {
        savedFilterProfiles = previousProfiles;
        return;
      }
      filterProfilePendingDeleteId = null;
      filterProfileDeleteButton.textContent = &#x27;Eliminar&#x27;;
      filterProfileNameInput.value = &#x27;&#x27;;
      renderFilterProfiles(&#x27;&#x27;);
      setFilterProfileMessage(`Configuración «${profile.name}» eliminada.`);
    }

    function handleFilterProfileSelection() {
      const profile = savedFilterProfiles.find(
        (savedProfile) =&gt; savedProfile.id === filterProfileSelect.value
      );
      filterProfilePendingDeleteId = null;
      filterProfileDeleteButton.textContent = &#x27;Eliminar&#x27;;
      filterProfileNameInput.value = profile?.name ?? &#x27;&#x27;;
      renderFilterProfiles(profile?.id ?? &#x27;&#x27;);
      if (profile) {
        setFilterProfileMessage(`Seleccionada «${profile.name}». Pulsa «Cargar» para aplicarla.`);
      }
    }

    function setFilterMessage(message, isError = false) {
      filterMessage.textContent = message;
      filterMessage.classList.toggle(&#x27;is-error&#x27;, isError);
    }

    function filterSourceDetails(source = filterSourceSelect.value) {
      if (source === &#x27;current&#x27;) {
        const combinations = drawn.length === 6 ? [[...drawn].sort((first, second) =&gt; first - second)] : [];
        return {
          key: &#x27;current&#x27;,
          label: &#x27;Bombo · combinación extraída actual&#x27;,
          description: combinations.length
            ? &#x27;La combinación completa que aparece actualmente en la zona del bombo.&#x27;
            : &#x27;Todavía no hay una combinación completa para filtrar.&#x27;,
          combinations
        };
      }
      if (source === &#x27;random&#x27;) {
        const combinations = savedOrigin === &#x27;random&#x27; ? savedCombinations : [];
        return {
          key: &#x27;random&#x27;,
          label: &#x27;Bombo · combinaciones guardadas&#x27;,
          description: combinations.length
            ? &#x27;Combinaciones extraídas mediante el bombo y guardadas en la lista.&#x27;
            : &#x27;No hay combinaciones aleatorias guardadas.&#x27;,
          combinations
        };
      }
      if (source === &#x27;rules&#x27;) {
        return {
          key: &#x27;rules&#x27;,
          label: &#x27;Generador con fijos y semifijos&#x27;,
          description: ruleGeneratedCombinations.length
            ? &#x27;Combinaciones creadas aplicando los fijos y semifijos seleccionados.&#x27;
            : &#x27;Todavía no se han generado combinaciones con fijos y semifijos.&#x27;,
          combinations: ruleGeneratedCombinations
        };
      }
      if (source === &#x27;imported&#x27;) {
        return {
          key: importedSource === &#x27;clipboard&#x27; ? &#x27;clipboard&#x27; : &#x27;file&#x27;,
          label: importedSource === &#x27;clipboard&#x27;
            ? &#x27;Combinaciones pegadas desde el portapapeles&#x27;
            : &#x27;Archivo TXT cargado&#x27;,
          description: importedCombinations.length
            ? &#x27;Combinaciones cargadas en la zona de TXT y portapapeles.&#x27;
            : &#x27;Todavía no se han cargado combinaciones desde TXT o portapapeles.&#x27;,
          combinations: importedCombinations
        };
      }
      if (source === &#x27;reduced&#x27;) {
        return {
          key: &#x27;reduced&#x27;,
          label: &#x27;Reducción matemática&#x27;,
          description: developmentReducedCombinations.length
            ? &#x27;Combinaciones que forman la última reducción calculada.&#x27;
            : &#x27;Todavía no se ha generado una reducción.&#x27;,
          combinations: developmentReducedCombinations
        };
      }
      if (source === &#x27;development&#x27;) {
        return {
          key: &#x27;full&#x27;,
          label: &#x27;Desarrollo completo&#x27;,
          description: developmentFullCombinations.length
            ? &#x27;Combinaciones que forman el último desarrollo completo.&#x27;
            : &#x27;Todavía no se ha generado un desarrollo completo.&#x27;,
          combinations: developmentFullCombinations
        };
      }
      if (source === &#x27;digital&#x27;) {
        const label = signatureSourceLabel();
        return {
          key: &#x27;digital&#x27;,
          label,
          description: digitalGeneratedCombinations.length
            ? digitalGeneratedSignatureMode === &#x27;combined&#x27;
              ? &#x27;Combinaciones que cumplen simultáneamente la firma digital, la firma de terminación y sus equivalencias.&#x27;
              : digitalGeneratedSignatureMode === &#x27;termination&#x27;
                ? &#x27;Combinaciones naturales generadas con las terminaciones y equivalencias seleccionadas en P1–P6.&#x27;
                : &#x27;Combinaciones naturales equivalentes generadas mediante P1–P6, SDCD y las clases de equivalencia seleccionadas.&#x27;
            : `Todavía no se ha generado un desarrollo de ${label.toLocaleLowerCase(&#x27;es-ES&#x27;)}.`,
          combinations: digitalGeneratedCombinations
        };
      }
      if (source === &#x27;ticket&#x27;) {
        return {
          key: &#x27;saved-ticket&#x27;,
          label: loadedTicketForFilters
            ? `Mis boletos · ${loadedTicketForFilters.name}`
            : &#x27;Mis boletos · ninguno seleccionado&#x27;,
          description: loadedTicketForFilters
            ? `Apuestas del boleto completo guardado «${loadedTicketForFilters.name}».`
            : &#x27;Pulsa «Filtrar» en uno de los boletos guardados.&#x27;,
          combinations: loadedTicketForFilters?.combinations ?? []
        };
      }
      return { key: &#x27;unknown&#x27;, label: &#x27;Procedencia desconocida&#x27;, description: &#x27;&#x27;, combinations: [] };
    }

    function refreshFilterSourceButtons() {
      filterCurrentButton.disabled = drawn.length !== 6;
      filterSavedButton.disabled = savedOrigin !== &#x27;random&#x27; || savedCombinations.length === 0;
      filterRulesButton.disabled = ruleGeneratedCombinations.length === 0;
      filterImportedButton.disabled = importedCombinations.length === 0;
      filterDevelopmentButton.disabled = getActiveDevelopmentCombinations().length === 0;
      filterDigitalButton.disabled = digitalGeneratedCombinations.length === 0;
      filterDevelopmentButton.dataset.filterSource = developmentViewSelect.value === &#x27;full&#x27;
        ? &#x27;development&#x27;
        : &#x27;reduced&#x27;;
      if (filterSourceSelect.value) updateFilterSourceSummary(false);
    }

    function clearFilteredResult(message = &#x27;&#x27;) {
      filteredCombinations = [];
      filteredSourceDetails = null;
      filterPageIndex = 0;
      filterOutput.hidden = true;
      filterResultList.replaceChildren();
      filterPagination.hidden = true;
      filterResultCount.textContent = &#x27;0 resultantes&#x27;;
      filterReducerButton.disabled = true;
      root.querySelectorAll(&#x27;[data-filter-eliminated]&#x27;).forEach((label) =&gt; {
        label.textContent = &#x27;0 eliminadas&#x27;;
      });
      if (message) setFilterMessage(message);
    }

    function updateFilterSourceSummary(clearResult = true) {
      const details = filterSourceDetails();
      filterSourceSummary.dataset.source = details.key;
      filterSourceName.textContent = details.label;
      filterSourceDescription.textContent = details.description;
      filterSourceCount.textContent = `${details.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} ${details.combinations.length === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}`;
      filterApplyButton.disabled = filterBusy || details.combinations.length === 0;
      if (clearResult) {
        clearFilteredResult(
          details.combinations.length
            ? `${details.combinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones preparadas. Activa los filtros que necesites y pulsa «Aplicar filtros».`
            : details.description
        );
      }
    }

    function scrollToFilters() {
      requestAnimationFrame(() =&gt; {
        const targetTop = filterSection.getBoundingClientRect().top + window.scrollY - 12;
        window.scrollTo({ top: Math.max(0, targetTop), behavior: reducedMotion ? &#x27;auto&#x27; : &#x27;smooth&#x27; });
        filterSection.focus({ preventScroll: true });
        quickNavLinks.forEach((item) =&gt; item.removeAttribute(&#x27;aria-current&#x27;));
        const quickFilterLink = quickNavLinks.find((link) =&gt; link.getAttribute(&#x27;href&#x27;) === &#x27;#lottery-filters-section&#x27;);
        quickFilterLink?.setAttribute(&#x27;aria-current&#x27;, &#x27;location&#x27;);
      });
    }

    function openFiltersForSource(source, ticket = null) {
      if (ticket) loadedTicketForFilters = normaliseTicket(ticket);
      filterSourceSelect.value = source;
      updateFilterSourceSummary();
      scrollToFilters();
    }

    function parseFilterNumberSet(value) {
      const text = String(value ?? &#x27;&#x27;).trim();
      if (!text) return null;
      const numbers = new Set();
      const tokens = text.split(/[\s,;]+/).filter(Boolean);
      tokens.forEach((token) =&gt; {
        const rangeMatch = token.match(/^(\d{1,2})-(\d{1,2})$/);
        if (rangeMatch) {
          let start = Number(rangeMatch[1]);
          let end = Number(rangeMatch[2]);
          if (start &gt; end) [start, end] = [end, start];
          for (let number = start; number &lt;= end; number += 1) {
            if (number &gt;= 1 &amp;&amp; number &lt;= 49) numbers.add(number);
          }
          return;
        }
        const number = Number(token);
        if (Number.isInteger(number) &amp;&amp; number &gt;= 1 &amp;&amp; number &lt;= 49) numbers.add(number);
      });
      if (numbers.size === 0) throw new Error(`No se reconoce la lista «${text}».`);
      return numbers;
    }

    function readFilterRange(key, minimum, maximum, label) {
      const minInput = filterGrid.querySelector(`[data-filter-min=&quot;${key}&quot;]`);
      const maxInput = filterGrid.querySelector(`[data-filter-max=&quot;${key}&quot;]`);
      const min = Math.trunc(Number(minInput?.value));
      const max = Math.trunc(Number(maxInput?.value));
      if (!Number.isInteger(min) || !Number.isInteger(max) || min &lt; minimum || max &gt; maximum || min &gt; max) {
        throw new Error(`${label}: revisa los valores mínimo y máximo.`);
      }
      return { min, max };
    }

    function readStaticRange(minId, maxId, minimum, maximum, label) {
      const min = Math.trunc(Number(root.querySelector(minId).value));
      const max = Math.trunc(Number(root.querySelector(maxId).value));
      if (!Number.isInteger(min) || !Number.isInteger(max) || min &lt; minimum || max &gt; maximum || min &gt; max) {
        throw new Error(`${label}: revisa los valores mínimo y máximo.`);
      }
      return { min, max };
    }

    function selectedFilterFigures(group) {
      return new Set(
        [...filterGrid.querySelectorAll(`[data-filter-figure=&quot;${group}&quot;]:checked`)]
          .map((input) =&gt; input.value)
      );
    }

    function readFilterConfiguration() {
      const enabled = [...filterGrid.querySelectorAll(&#x27;[data-filter-enabled]:checked&#x27;)]
        .map((input) =&gt; input.dataset.filterEnabled);
      const configuration = { enabled };

      configuration.low = readStaticRange(&#x27;#lottery-filter-low-min&#x27;, &#x27;#lottery-filter-low-max&#x27;, 0, 6, &#x27;Bajos&#x27;);
      configuration.high = readStaticRange(&#x27;#lottery-filter-high-min&#x27;, &#x27;#lottery-filter-high-max&#x27;, 0, 6, &#x27;Altos&#x27;);
      configuration.decades = Array.from({ length: 5 }, (_, index) =&gt; (
        readFilterRange(`decade-${index}`, 0, 6, `Decena ${index + 1}`)
      ));
      configuration.decadeFigures = selectedFilterFigures(&#x27;decades&#x27;);
      configuration.distances = Array.from({ length: 5 }, (_, index) =&gt; (
        readFilterRange(`distance-${index}`, 1, 48, `Distancia ${index + 1}`)
      ));
      configuration.span = readStaticRange(&#x27;#lottery-filter-span-min&#x27;, &#x27;#lottery-filter-span-max&#x27;, 5, 48, &#x27;Amplitud&#x27;);
      configuration.pairDistance = readStaticRange(
        &#x27;#lottery-filter-pair-distance-min&#x27;,
        &#x27;#lottery-filter-pair-distance-max&#x27;,
        0,
        1000,
        &#x27;Suma de distancias&#x27;
      );

      configuration.groups = Array.from({ length: 10 }, (_, index) =&gt; {
        const set = parseFilterNumberSet(filterGrid.querySelector(`[data-filter-group-numbers=&quot;${index}&quot;]`).value);
        const min = Math.trunc(Number(filterGrid.querySelector(`[data-filter-group-min=&quot;${index}&quot;]`).value));
        const max = Math.trunc(Number(filterGrid.querySelector(`[data-filter-group-max=&quot;${index}&quot;]`).value));
        if (!Number.isInteger(min) || !Number.isInteger(max) || min &lt; 0 || max &gt; 6 || min &gt; max) {
          throw new Error(`Grupo ${index + 1}: revisa los aciertos mínimo y máximo.`);
        }
        return { set, min, max };
      });

      configuration.roots = Array.from({ length: 9 }, (_, index) =&gt; (
        readFilterRange(`root-${index + 1}`, 0, 6, `Raíz ${index + 1}`)
      ));
      configuration.rootFigures = selectedFilterFigures(&#x27;digital-roots&#x27;);
      configuration.parityFigures = selectedFilterFigures(&#x27;parity&#x27;);
      configuration.consecutive = readStaticRange(
        &#x27;#lottery-filter-consecutive-min&#x27;,
        &#x27;#lottery-filter-consecutive-max&#x27;,
        0,
        5,
        &#x27;Números seguidos&#x27;
      );
      configuration.consecutiveFigures = selectedFilterFigures(&#x27;consecutives&#x27;);

      configuration.sums = Array.from({ length: 10 }, (_, index) =&gt; {
        const minValue = filterGrid.querySelector(`[data-filter-sum-min=&quot;${index}&quot;]`).value.trim();
        const maxValue = filterGrid.querySelector(`[data-filter-sum-max=&quot;${index}&quot;]`).value.trim();
        if (!minValue &amp;&amp; !maxValue) return null;
        const min = Math.trunc(Number(minValue));
        const max = Math.trunc(Number(maxValue));
        if (!Number.isInteger(min) || !Number.isInteger(max) || min &lt; 21 || max &gt; 279 || min &gt; max) {
          throw new Error(`Intervalo de sumas ${index + 1}: indica un mínimo y un máximo válidos.`);
        }
        return { min, max };
      }).filter(Boolean);

      configuration.endings = Array.from({ length: 10 }, (_, index) =&gt; (
        readFilterRange(`ending-${index}`, 0, 6, `Terminación ${index}`)
      ));
      configuration.endingFigures = selectedFilterFigures(&#x27;endings&#x27;);
      configuration.endingSum = readStaticRange(
        &#x27;#lottery-filter-ending-sum-min&#x27;,
        &#x27;#lottery-filter-ending-sum-max&#x27;,
        2,
        53,
        &#x27;Suma de terminaciones&#x27;
      );
      configuration.positions = Array.from({ length: 6 }, (_, index) =&gt; (
        parseFilterNumberSet(filterGrid.querySelector(`[data-filter-position=&quot;${index}&quot;]`).value)
      ));
      return configuration;
    }

    function filterFigure(counts) {
      const present = counts.filter((count) =&gt; count &gt; 0).sort((first, second) =&gt; second - first);
      if (present.length === 1) return `${present[0]}-0`;
      return present.join(&#x27;-&#x27;);
    }

    function analyseFilterCombination(combination) {
      const numbers = [...combination].sort((first, second) =&gt; first - second);
      const decadeCounts = Array(5).fill(0);
      const rootCounts = Array(9).fill(0);
      const endingCounts = Array(10).fill(0);
      let low = 0;
      let even = 0;
      let sum = 0;
      let endingSum = 0;
      numbers.forEach((number) =&gt; {
        if (number &lt;= 24) low += 1;
        if (number % 2 === 0) even += 1;
        sum += number;
        const decade = number &lt; 10 ? 0 : Math.floor(number / 10);
        decadeCounts[decade] += 1;
        const digitalRoot = ((number - 1) % 9);
        rootCounts[digitalRoot] += 1;
        const ending = number % 10;
        endingCounts[ending] += 1;
        endingSum += ending;
      });

      const distances = numbers.slice(1).map((number, index) =&gt; number - numbers[index]);
      let pairDistanceSum = 0;
      for (let first = 0; first &lt; numbers.length; first += 1) {
        for (let second = first + 1; second &lt; numbers.length; second += 1) {
          pairDistanceSum += numbers[second] - numbers[first];
        }
      }

      const runs = [];
      let currentRun = 1;
      distances.forEach((distance) =&gt; {
        if (distance === 1) {
          currentRun += 1;
        } else {
          runs.push(currentRun);
          currentRun = 1;
        }
      });
      runs.push(currentRun);
      const consecutiveLinks = runs.reduce((total, length) =&gt; total + Math.max(0, length - 1), 0);

      return {
        numbers,
        low,
        high: 6 - low,
        even,
        odd: 6 - even,
        sum,
        decadeCounts,
        decadeFigure: filterFigure(decadeCounts),
        rootCounts,
        rootFigure: filterFigure(rootCounts),
        endingCounts,
        endingFigure: filterFigure(endingCounts),
        endingSum,
        distances,
        span: numbers[5] - numbers[0],
        pairDistanceSum,
        consecutiveLinks,
        consecutiveFigure: filterFigure(runs)
      };
    }

    function valueInRange(value, range) {
      return value &gt;= range.min &amp;&amp; value &lt;= range.max;
    }

    function filterCombinationPasses(key, metrics, configuration) {
      if (key === &#x27;low-high&#x27;) {
        return valueInRange(metrics.low, configuration.low)
          &amp;&amp; valueInRange(metrics.high, configuration.high);
      }
      if (key === &#x27;decades&#x27;) {
        return metrics.decadeCounts.every((count, index) =&gt; valueInRange(count, configuration.decades[index]))
          &amp;&amp; (configuration.decadeFigures.size === 0 || configuration.decadeFigures.has(metrics.decadeFigure));
      }
      if (key === &#x27;distances&#x27;) {
        return metrics.distances.every((distance, index) =&gt; valueInRange(distance, configuration.distances[index]))
          &amp;&amp; valueInRange(metrics.span, configuration.span)
          &amp;&amp; valueInRange(metrics.pairDistanceSum, configuration.pairDistance);
      }
      if (key === &#x27;groups&#x27;) {
        return configuration.groups.every((group) =&gt; {
          if (!group.set) return true;
          const count = metrics.numbers.filter((number) =&gt; group.set.has(number)).length;
          return count &gt;= group.min &amp;&amp; count &lt;= group.max;
        });
      }
      if (key === &#x27;digital-roots&#x27;) {
        return metrics.rootCounts.every((count, index) =&gt; valueInRange(count, configuration.roots[index]))
          &amp;&amp; (configuration.rootFigures.size === 0 || configuration.rootFigures.has(metrics.rootFigure));
      }
      if (key === &#x27;parity&#x27;) {
        return configuration.parityFigures.size === 0
          || configuration.parityFigures.has(`${metrics.even}-${metrics.odd}`);
      }
      if (key === &#x27;consecutives&#x27;) {
        return valueInRange(metrics.consecutiveLinks, configuration.consecutive)
          &amp;&amp; (configuration.consecutiveFigures.size === 0
            || configuration.consecutiveFigures.has(metrics.consecutiveFigure));
      }
      if (key === &#x27;sums&#x27;) {
        return configuration.sums.length === 0
          || configuration.sums.some((range) =&gt; valueInRange(metrics.sum, range));
      }
      if (key === &#x27;endings&#x27;) {
        return metrics.endingCounts.every((count, index) =&gt; valueInRange(count, configuration.endings[index]))
          &amp;&amp; valueInRange(metrics.endingSum, configuration.endingSum)
          &amp;&amp; (configuration.endingFigures.size === 0
            || configuration.endingFigures.has(metrics.endingFigure));
      }
      if (key === &#x27;positions&#x27;) {
        return configuration.positions.every((set, index) =&gt; !set || set.has(metrics.numbers[index]));
      }
      return true;
    }

    function combinationPassesActiveFilters(combination, configuration) {
      const metrics = analyseFilterCombination(combination);
      return configuration.enabled.every((key) =&gt;
        filterCombinationPasses(key, metrics, configuration)
      );
    }

    function readZoneFilterConfiguration(modeSelect, zoneLabel) {
      if (modeSelect?.value !== &#x27;active&#x27;) return null;
      const configuration = readFilterConfiguration();
      if (configuration.enabled.length === 0) {
        throw new Error(
          `${zoneLabel}: has elegido aplicar filtros, pero todavía no hay ninguno activado en la zona «Filtros».`
        );
      }
      return configuration;
    }

    function refreshFilterCardStates() {
      filterGrid.querySelectorAll(&#x27;[data-filter-card]&#x27;).forEach((card) =&gt; {
        const enabled = card.querySelector(&#x27;[data-filter-enabled]&#x27;)?.checked;
        card.classList.toggle(&#x27;is-active&#x27;, Boolean(enabled));
      });
    }

    function renderFilteredCombinations() {
      const pageTotal = Math.max(1, Math.ceil(filteredCombinations.length / FILTER_PAGE_SIZE));
      filterPageIndex = Math.min(Math.max(0, filterPageIndex), pageTotal - 1);
      const start = filterPageIndex * FILTER_PAGE_SIZE;
      const pageCombinations = filteredCombinations.slice(start, start + FILTER_PAGE_SIZE);
      filterResultList.replaceChildren();
      pageCombinations.forEach((combination, pageIndex) =&gt; {
        const item = document.createElement(&#x27;li&#x27;);
        item.className = &#x27;filter-result-item&#x27;;
        const index = document.createElement(&#x27;span&#x27;);
        index.className = &#x27;filter-result-index&#x27;;
        index.textContent = String(start + pageIndex + 1).padStart(2, &#x27;0&#x27;);
        const numbers = document.createElement(&#x27;span&#x27;);
        numbers.className = &#x27;filter-result-numbers&#x27;;
        numbers.textContent = combination.map((number) =&gt; String(number).padStart(2, &#x27;0&#x27;)).join(&#x27; · &#x27;);
        item.append(index, numbers);
        filterResultList.appendChild(item);
      });
      filterOutput.hidden = false;
      filterOutputCount.textContent = `${filteredCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} ${filteredCombinations.length === 1 ? &#x27;combinación&#x27; : &#x27;combinaciones&#x27;}`;
      filterResultCount.textContent = `${filteredCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} resultantes`;
      filterPagination.hidden = filteredCombinations.length &lt;= FILTER_PAGE_SIZE;
      filterPage.textContent = `${filterPageIndex + 1} de ${pageTotal}`;
      filterPreviousButton.disabled = filterPageIndex === 0;
      filterNextButton.disabled = filterPageIndex &gt;= pageTotal - 1;
      const hasResults = filteredCombinations.length &gt; 0;
      filterCopyButton.disabled = !hasResults;
      filterQrButton.disabled = !hasResults;
      filterReducerButton.disabled = filteredCombinations.length &lt; 2;
      filterScrutinyButton.disabled = !hasResults;
    }

    async function applyCombinationFilters() {
      if (filterBusy) return;
      const source = filterSourceDetails();
      const base = source.combinations;
      if (base.length === 0) {
        updateFilterSourceSummary();
        setFilterMessage(&#x27;La procedencia seleccionada no contiene combinaciones para filtrar.&#x27;, true);
        return;
      }
      const isMobile = window.matchMedia(&#x27;(max-width: 760px)&#x27;).matches;
      const preventiveLimit = isMobile
        ? FILTER_MOBILE_COMBINATION_LIMIT
        : FILTER_DESKTOP_COMBINATION_LIMIT;
      const safeLimit = effectiveCombinationLimit(preventiveLimit);
      if (base.length &gt; safeLimit) {
        setFilterMessage(
          `La procedencia contiene ${base.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones y supera el límite seguro de ${safeLimit.toLocaleString(&#x27;es-ES&#x27;)} para este dispositivo. Reduce primero el desarrollo o utiliza una lista más pequeña.`,
          true
        );
        return;
      }

      let configuration;
      try {
        configuration = readFilterConfiguration();
      } catch (error) {
        setFilterMessage(error.message || &#x27;Revisa la configuración de los filtros.&#x27;, true);
        return;
      }

      filterBusy = true;
      filterCancelRequested = false;
      filterApplyButton.disabled = true;
      filterCancelButton.hidden = false;
      filterCancelButton.disabled = false;
      filterResetButton.disabled = true;
      filterProfileSaveButton.disabled = true;
      filterProfileLoadButton.disabled = true;
      filterProfileDeleteButton.disabled = true;
      filterProfileExportButton.disabled = true;
      filterProfileImportButton.disabled = true;
      const nextCombinations = [];
      const eliminated = Object.fromEntries(configuration.enabled.map((key) =&gt; [key, 0]));
      root.querySelectorAll(&#x27;[data-filter-eliminated]&#x27;).forEach((label) =&gt; {
        label.textContent = &#x27;0 eliminadas&#x27;;
      });
      setFilterMessage(
        highLoadOverrideEnabled &amp;&amp; base.length &gt; preventiveLimit
          ? `Analizando ${base.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones con la alta carga autorizada bajo tu responsabilidad…`
          : `Analizando ${base.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones…`
      );

      const chunkSize = isMobile ? 750 : 2500;
      for (let index = 0; index &lt; base.length; index += 1) {
        const combination = base[index];
        const metrics = analyseFilterCombination(combination);
        let accepted = true;
        for (const key of configuration.enabled) {
          if (!filterCombinationPasses(key, metrics, configuration)) {
            eliminated[key] += 1;
            accepted = false;
            break;
          }
        }
        if (accepted) nextCombinations.push([...metrics.numbers]);

        if ((index + 1) % chunkSize === 0) {
          const percentage = Math.round((index + 1) / base.length * 100);
          setFilterMessage(`Filtrando combinaciones… ${percentage} %`);
          await wait(0);
          if (filterCancelRequested) break;
        }
      }

      filterBusy = false;
      filterCancelButton.hidden = true;
      filterCancelButton.disabled = true;
      filterResetButton.disabled = false;
      filterApplyButton.disabled = false;
      filterProfileSaveButton.disabled = false;
      renderFilterProfiles();
      if (filterCancelRequested) {
        setFilterMessage(&#x27;Filtrado cancelado. Se conserva el resultado anterior.&#x27;);
        return;
      }

      filteredCombinations = nextCombinations;
      filteredSourceDetails = {
        key: &#x27;filtered&#x27;,
        label: `Filtros · ${source.label}`,
        description: `Combinaciones filtradas a partir de ${source.label}.`
      };
      filterPageIndex = 0;
      configuration.enabled.forEach((key) =&gt; {
        const label = root.querySelector(`[data-filter-eliminated=&quot;${key}&quot;]`);
        const total = eliminated[key] ?? 0;
        label.textContent = `${total.toLocaleString(&#x27;es-ES&#x27;)} ${total === 1 ? &#x27;eliminada&#x27; : &#x27;eliminadas&#x27;}`;
      });
      renderFilteredCombinations();
      const removed = base.length - filteredCombinations.length;
      filterOutputSummary.textContent = `Procedencia: ${source.label}. Se han eliminado ${removed.toLocaleString(&#x27;es-ES&#x27;)} de ${base.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones.`;
      setFilterMessage(
        configuration.enabled.length === 0
          ? &#x27;No había filtros activados: se ha conservado la lista completa.&#x27;
          : `${filteredCombinations.length.toLocaleString(&#x27;es-ES&#x27;)} combinaciones cumplen todos los filtros activados.`
      );
    }

    function cancelCombinationFilters() {
      if (!filterBusy) return;
      filterCancelRequested = true;
      filterCancelButton.disabled = true;
      setFilterMessage(&#x27;Cancelación solicitada. El proceso se detendrá al terminar el bloque actual.&#x27;);
    }

    function resetCombinationFilters() {
      if (filterBusy) return;
      filterGrid.querySelectorAll(&#x27;input&#x27;).forEach((input) =&gt; {
        if (input.type === &#x27;checkbox&#x27;) input.checked = false;
